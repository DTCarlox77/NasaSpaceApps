# Blueprint de Render para la API de demo (datos SINTÉTICOS).
# Render → New → Blueprint → este repo, rama `backend`. Ver backend/docs/RELEVO.md ("Despliegue").
databases:
  - name: astro-health-db
    plan: free
    databaseName: astro_health
    user: astro
    postgresMajorVersion: '16'

services:
  - type: web
    name: astro-health-api
    runtime: node
    plan: free
    branch: backend
    rootDir: backend
    buildCommand: npm ci
    # Migra, siembra la demo (DEMO_SEED=true) y arranca. El plan gratuito no tiene pre-deploy.
    startCommand: npm run start:deploy
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: astro-health-db
          property: connectionString
      # Conexión interna de Render: SSL sin verificar el certificado.
      - key: DB_SSL
        value: no-verify
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
      - key: TRUST_PROXY
        value: '1'
      # Datos de demo SINTÉTICOS (usuarios con Demo2026!). Nunca con datos reales.
      - key: DEMO_SEED
        value: 'true'
