  # ===================================================================== Simulador (solo demo)
  /api/v1/admin/simulator/history:
    post:
      tags: [Simulador]
      summary: Carga la historia sintética de ARES-1 (solo demo)
      description: |
        **Solo demo**: responde 404 si el servidor no tiene `SIMULATOR_ENABLED=true`.

        Genera los últimos `days` días (terminan ahora, en UTC) de la tripulación vigente y del
        hábitat, con datos **sintéticos** dentro de los rangos normales del catálogo:
        - signos vitales diarios, sueño, ejercicio, glucosa en ayunas cada 2–3 días, masa semanal
          y dosis de radiación diaria y acumulada;
        - hábitat cada hora por módulo (CO₂, temperatura, humedad y ruido);
        - bienestar: check-in diario, PVT semanal (con 3 corridas de línea base al inicio de la
          misión) y PHQ-2/GAD-2 cada 2 semanas.

        Cada lectura entra por el mismo camino que la API (validación, reglas activas, derivados y
        escalamientos), como el astronauta o la cuenta de servicio que la registraría. La historia
        normal no genera críticos ni escalamientos (solo alguna precaución de autocuidado).

        **Idempotente**: la misma `seed` da los mismos valores y los mismos `client_uuid`; correrla
        otra vez responde con todo en `duplicate`. Tarda unos segundos (en Render, hasta ~1 min).
      operationId: loadSimulatorHistory
      x-status: extra
      x-roles: [admin]
      x-hazards:
        [
          space_radiation,
          isolation_confinement,
          distance_from_earth,
          gravity_fields,
          hostile_closed_env,
        ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatorHistoryRequest'
            examples:
              default:
                summary: 14 días con la semilla 42
                value: { days: 14, seed: 42 }
      responses:
        '200':
          description: Historia cargada (o ya existente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorSummary'
              examples:
                history:
                  $ref: '#/components/examples/SimulatorHistorySummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El simulador está apagado (`SIMULATOR_ENABLED` no es `true`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/simulator/scenarios/{name}:
    post:
      tags: [Simulador]
      summary: Dispara un escenario de la demo ahora (solo demo)
      description: |
        **Solo demo**: responde 404 si el servidor no tiene `SIMULATOR_ENABLED=true` o si el
        escenario no existe. Crea las lecturas del escenario en el momento actual, encima de la
        historia (cárgala antes), por el mismo camino que la API:
        - `solar_event`: evento solar en el dosímetro de toda la tripulación (`event_active`).
          `low` llega a precaución (dosis del evento ≥ 125 mSv → flight surgeon) y `high` a crítico
          (≥ 250 mSv). Con `astronaut`, ese tripulante reporta náusea: crítico por síntomas.
        - `crew_illness`: fiebre (38.4 °C; 39.6 °C crítico en `high`), tos y FC elevada en
          `astronaut` (por defecto LYRA). Con `contagion: true` empezó ayer y un segundo
          tripulante enferma hoy.
        - `co2_spike`: el CO₂ de `module_id` (por defecto HAB-1) pasa de 3 y luego de 4.5 mmHg en
          50 min (precaución a la tripulación); en `high` llega a ~10.8 mmHg (crítico).
        - `wellbeing_decline`: 5 check-ins seguidos claramente peores en `astronaut` (por defecto
          ATLAS) → escalamiento **confidencial** a `behavioral_health`. En `high`, además PHQ-2 y
          GAD-2 ≥ 3. Corrige los check-ins de esos días (`supersedes_uuid`). Necesita la historia
          de 14 días para la línea base.
        - `offline_batch`: ~24 h sin conexión de `astronaut` (por defecto ORION) empujadas por
          `POST /sync/push` desde `TAB-1` (13 items, como `docs/examples/sync-push.json`): un
          crítico de hace 6 h (SpO₂ 89 %, se procesa primero y llega con `late_sync`), una
          corrección y un duplicado. El resumen trae `sync` con los conteos del lote.
        - `emergency_solar`: el triaje de punta a punta. Evento solar y dos tripulantes con
          náusea (VEGA y `astronaut`, por defecto LYRA) → activación automática por lectura
          crítica → hombre muerto vencido (el barrido se adelanta) → el comandante evalúa
          (`astronaut` no responde: solo signos observables) → corte de enlace con una pregunta
          y el cierre en cola → al cerrar el corte, el reporte sale hacia Tierra. El resumen
          trae `emergency`. Ejemplo del reporte: `docs/examples/emergency-session.json`.

        Un reintento en el mismo minuto no duplica; dispararlo más tarde crea un episodio nuevo.
        Las alertas a `flight_surgeon` llegan a `GET /admin/inbox` tras el retraso de la misión
        (ARES-1: 90 s). El resumen nunca incluye niveles ni escalamientos de bienestar.
      operationId: runSimulatorScenario
      x-status: extra
      x-roles: [admin]
      x-hazards: [space_radiation, isolation_confinement, hostile_closed_env]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum:
              [
                solar_event,
                crew_illness,
                co2_spike,
                wellbeing_decline,
                offline_batch,
                emergency_solar,
              ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatorScenarioRequest'
            examples:
              solarHigh:
                summary: Evento solar fuerte, VEGA con náusea
                value: { intensity: high, astronaut: VEGA }
              illness:
                summary: Enfermedad con contagio
                value: { astronaut: LYRA, contagion: true }
              co2:
                summary: CO₂ en HAB-2
                value: { module_id: HAB-2, intensity: low }
      responses:
        '200':
          description: Escenario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorSummary'
              examples:
                co2Spike:
                  $ref: '#/components/examples/SimulatorCo2Summary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El simulador está apagado o el escenario no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/demo/reset:
    post:
      tags: [Simulador]
      summary: Reinicia la demo de ARES-1 (solo demo)
      description: |
        **Solo demo**: responde 404 fuera del modo demo (`SIMULATOR_ENABLED=true` y, en
        producción, además `DEMO_SEED=true`), igual que el simulador. Solo `admin`.
        Confirmación obligatoria: `{ "confirm": "ARES-1" }` (si falta o es otra, 400).

        Deja la demo lista con datos **sintéticos**, sin borrar nada (las tablas de lecturas y
        bitácoras son append-only: lo que se puede, se cierra):
        1. El check-in perdido cuenta desde ahora (antes de tocar nada), así el barrido no abre
           emergencias a mitad del reinicio ni justo después.
        2. Usuarios del seed: activos, desbloqueados y con la contraseña del seed (`Demo2026!`);
           ATLAS (`m.silva`) sigue con cambio de contraseña obligatorio. Si una contraseña
           cambió, se restaura y sus sesiones se cierran.
        3. Recarga la historia de `days` días (14) hasta ahora (idempotente, como
           `POST /admin/simulator/history`).
        4. Cierra (`cancelled`) las emergencias abiertas, con evento `closed` y reporte, sin
           avisar a Tierra.
        5. Cierra los cortes de enlace en curso (los programados a futuro no se tocan).
        6. Cierra los escalamientos y las solicitudes de apoyo abiertos de ARES-1 (también los
           de escenarios y pruebas de humo). Lo conductual se cierra pero **no se cuenta**.
        7. Aptitud: una PVT en descanso de ahora, dentro de su línea base, para 3 de los 4
           astronautas → 3 `fit` y 1 `not_confirmed` (ATLAS, o el siguiente si ATLAS ya tenía
           una PVT apta reciente: lo dice `not_confirmed`).

        `panel_flags` = lo que el panel seguirá marcando (última lectura física vigente en
        caution o critical): una lectura critical de un escenario anterior no se puede quitar
        sin borrar. Tarda unos segundos (en Render, hasta ~1 min). Un reinicio a la vez (409).
      operationId: resetDemo
      x-status: extra
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoResetRequest'
            examples:
              default:
                summary: Reinicio con la historia de 14 días
                value: { confirm: ARES-1 }
      responses:
        '200':
          description: Demo reiniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResetSummary'
              examples:
                reset:
                  $ref: '#/components/examples/DemoResetSummaryExample'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Fuera del modo demo (la ruta no existe).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'

