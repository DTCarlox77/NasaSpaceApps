  /api/v1/admin/comm-outages:
    get:
      tags: [Misión]
      summary: Lista cortes de comunicación de una misión
      operationId: listCommOutages
      x-status: mvp
      x-roles: [admin]
      x-hazards: [distance_from_earth]
      parameters:
        - $ref: '#/components/parameters/MissionIdQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de cortes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommOutagePage'
              examples:
                ares1:
                  summary: Conjunción solar programada
                  value:
                    items:
                      - id: '23000000-0000-4000-8000-000000000001'
                        mission_id: '20000000-0000-4000-8000-000000000001'
                        starts_at: '2026-11-14T18:00:00Z'
                        ends_at: '2026-11-14T20:00:00Z'
                        reason: 'Conjunción solar (demo)'
                        created_at: '2026-11-14T10:00:00Z'
                    next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Misión]
      summary: Programa un corte de comunicación
      description: Sin `ends_at` el corte queda abierto y `compute_deliver_at` devuelve null (los mensajes esperan en cola).
      operationId: createCommOutage
      x-status: mvp
      x-roles: [admin]
      x-hazards: [distance_from_earth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommOutageCreate'
            examples:
              conjunction:
                summary: Conjunción solar de 2 horas
                value:
                  mission_id: '20000000-0000-4000-8000-000000000001'
                  starts_at: '2026-11-14T18:00:00Z'
                  ends_at: '2026-11-14T20:00:00Z'
                  reason: Conjunción solar (demo)
      responses:
        '201':
          description: Corte creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommOutage'
              examples:
                created:
                  $ref: '#/components/examples/OutageConjunction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Se solapa con otro corte de la misma misión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                overlap:
                  summary: Corte solapado
                  value:
                    error:
                      code: OUTAGE_OVERLAP
                      message: Ya hay un corte de comunicación en ese periodo.
                      details: { conflicting_outage_id: '23000000-0000-4000-8000-000000000001' }

