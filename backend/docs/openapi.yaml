        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/me/confidential-access:
    get:
      tags: [Auditoría]
      summary: Quién consultó mis datos confidenciales
      description: |
        Para el astronauta: cada lectura de SUS datos de bienestar por otra persona (p. ej. la
        bandeja o el detalle de behavioral_health), con quién, su rol, qué recurso y cuándo. Sin
        el contenido ni la IP. Sus propias lecturas no se registran.
      operationId: listMyConfidentialAccess
      x-status: mvp
      x-roles: [astronaut]
      x-sensitivity: confidential
      x-hazards: [isolation_confinement]
      parameters:
