  # ===================================================================== Bienestar
  /api/v1/wellbeing/checkins:
    post:
      tags: [Bienestar]
      summary: Check-in diario de bienestar
      description: |
        Cuatro deslizadores 0–100 (ánimo, fatiga, estrés, conflicto con la tripulación), horas de
        sueño de la pulsera (opcional) y una nota privada opcional que **solo ve el astronauta**
        (behavioral_health ve valores y tendencias, nunca la nota). La respuesta es el **mensaje
        neutro** de la regla del catálogo: nunca un color, un nivel ni un puntaje.
        `offer_support` siempre es true (mostrar "Quiero hablar con alguien").

        Un check-in por día de misión (día UTC de `measured_at`): otro el mismo día **corrige**
        al anterior (append-only, `supersedes_id`). Idempotente por `client_uuid` (también por
        `/sync/push`, entity `wellbeing_checkin`, con el mismo body sin `client_uuid`).
        `streak` cuenta check-ins completados, nunca el resultado. El servidor compara contra el
        rango habitual (`baseline_ready`, `adverse_z_3d`, `adverse_sustained_days`) y, si el
        cambio se sostiene, avisa de forma confidencial solo a behavioral_health, con el retraso
        del enlace.
      operationId: createWellbeingCheckin
      x-status: mvp
      x-roles: [astronaut]
      x-sensitivity: confidential
      x-hazards: [isolation_confinement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinCreate'
            examples:
              evening:
                summary: Check-in de ORION
                value:
                  client_uuid: 'ca000000-0000-4000-8000-000000000001'
                  measured_at: '2026-11-14T06:45:00Z'
                  mood: 62
                  fatigue: 40
                  stress: 35
                  crew_conflict: 10
                  sleep_hours: 6.5
                  private_note: Dormí poco por el ruido del ventilador.
      responses:
        '201':
          description: Check-in guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellbeingAck'
              examples:
                thanks:
                  $ref: '#/components/examples/CheckinAck'
        '200':
          description: Duplicado (mismo client_uuid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellbeingAck'
              examples:
                duplicate:
                  $ref: '#/components/examples/CheckinAck'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

