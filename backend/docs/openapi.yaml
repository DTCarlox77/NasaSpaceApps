  /api/v1/indicators:
    get:
      tags: [Salud]
      summary: Catálogo de indicadores con su guía (las 5 preguntas del reto)
      description: Mismo contenido que `docs/catalogo-indicadores.json` sin las reglas (ver `GET /rules`). Catálogo completo, sin paginar.
      operationId: listIndicators
