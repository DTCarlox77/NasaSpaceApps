      description: |
        Métricas del minijuego, `device_id` (la línea base es por dispositivo) y
        `before_critical_task`. Devuelve solo la aptitud: `fit` si los tres indicadores PVT
        quedan en `normal`, si no `not_confirmed` (`fitnessFromPvt`). Es lo único que llega a admin.
      operationId: createPvtRun
      x-status: mvp
      x-roles: [astronaut]
      x-sensitivity: confidential
      x-hazards: [isolation_confinement, distance_from_earth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PvtRunCreate'
            examples:
              beforeEva:
                summary: Antes de una tarea crítica
                value:
                  client_uuid: 'cc000000-0000-4000-8000-000000000001'
                  device_id: TAB-1
                  measured_at: '2026-11-14T09:30:00Z'
                  before_critical_task: true
                  duration_s: 180
                  trials: 52
                  lapses: 3
                  mean_rt_ms: 262
                  false_starts: 1
      responses:
        '201':
          description: Corrida evaluada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvtRunResult'
              examples:
                fit:
                  summary: Apto
                  value:
                    id: 'a3000000-0000-4000-8000-000000000001'
                    client_uuid: 'cc000000-0000-4000-8000-000000000001'
                    received_at: '2026-11-14T09:30:02Z'
                    fitness: fit
                    message: Tu atención está en tu rango habitual.
                notConfirmed:
                  summary: Aptitud no confirmada
                  value:
                    id: 'a3000000-0000-4000-8000-000000000002'
                    client_uuid: 'cc000000-0000-4000-8000-000000000002'
                    received_at: '2026-11-14T09:40:02Z'
                    fitness: not_confirmed
                    message: Tu resultado no confirma la aptitud para la tarea. Descansa y repite la prueba más tarde.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

