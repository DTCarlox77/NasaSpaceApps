  # ===================================================================== Sync
  /api/v1/sync/push:
    post:
      tags: [Sync]
      summary: Envía un lote de cambios hechos sin conexión
      description: |
        Solo el astronauta, con sus datos y desde un dispositivo suyo: el `device_id` de su
        sesión, uno con el que inició sesión o una tableta registrada de su misión (si no, 403
        `DEVICE_NOT_OWNED`). Hasta 500 items (`SYNC_MAX_BATCH`; más → 413).

        **Orden de proceso**: primero `priority: emergency`, luego los **críticos** (el servidor
        evalúa cada lectura con sus propios valores, sin historial) y luego el resto por
        `payload.measured_at` (o `created_at`). Una corrección arrastra a su original del mismo
        lote. `sequence` en cada resultado dice el orden real.

        Cada `payload` tiene la misma forma que el body del endpoint en línea, sin `client_uuid`
        (va en el item): `reading` = `POST /readings`, `habitat_reading` = un elemento de
        `POST /habitat/readings`, `wellbeing_checkin` = `POST /wellbeing/checkins`,
        `pvt_run` = `POST /wellbeing/pvt-runs`, `wellbeing_screening` =
        `POST /wellbeing/screenings`. Cada item va en su propia transacción: uno que falla no
        tumba el lote. Resultado por item (el arreglo `results` sigue el orden de `items`):
        - `accepted`: guardado (`server_id`, y `result` con la evaluación si aplica).
        - `duplicate`: ya existía ese `client_uuid` con el mismo contenido (`server_id` del
          existente). **Reintentar el lote completo da todo `duplicate`.**
        - `conflict`: `PAYLOAD_MISMATCH` (ese `client_uuid` ya existe con otro contenido; las
          lecturas nunca se sobrescriben: corrige con `supersedes_uuid` y un `client_uuid`
          nuevo) o `SUPERSEDE_CONFLICT` (esa lectura ya se corrigió una vez). No reintentar igual.
        - `rejected`: inválido (`error` con el formato de errores): `VALIDATION_ERROR`,
          `FUTURE_TIMESTAMP` (`measured_at` más de 5 min en el futuro según el servidor; nunca
          se corrige en silencio), `UNKNOWN_ENTITY` o `ENTITY_NOT_SUPPORTED` (emergencias y
          apoyo, todavía no). No reintentar sin corregir.

        **Llegó tarde**: se evalúa con su `measured_at` y el escalamiento sale desde la recepción
        (`compute_deliver_at`, con cortes): un crítico viejo sigue escalando. `result.late_sync`
        es true si pasaron más de 15 min (`SYNC_LATE_AFTER_S`) entre la medición y la recepción;
        `result.lag_s` dice cuánto. `clock_offset_s` = recepción − `sent_at` (solo se registra).

        **Bienestar**: el resultado es un mensaje neutro (y la aptitud en `pvt_run`); nunca un
        nivel, un puntaje ni un escalamiento.
      operationId: syncPush
      x-status: mvp
      x-roles: [astronaut]
      x-hazards: [distance_from_earth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
            examples:
              mixed:
                summary: Respuesta de triaje, lecturas y check-in
                value:
                  device_id: ipad-crew-01
                  sent_at: '2026-11-14T08:06:00Z'
                  items:
                    - client_uuid: 'e1000000-0000-4000-8000-000000000003'
                      entity: emergency_answer
                      priority: emergency
                      created_at: '2026-11-14T08:02:50Z'
                      payload:
                        {
                          assessment_id: '50000000-0000-4000-8000-000000000001',
                          question_code: resp_rate_over_30,
                          answer: { value: false },
                          source: prefill,
                          answered_at: '2026-11-14T08:02:50Z',
                        }
                    - client_uuid: 'c1000000-0000-4000-8000-000000000101'
                      entity: reading
                      priority: normal
                      created_at: '2026-11-14T07:30:00Z'
                      payload:
                        {
                          indicator_code: BLOOD_PRESSURE,
                          measured_at: '2026-11-14T07:30:00Z',
                          values: { systolic: 145, diastolic: 88 },
                          input_method: manual,
                        }
                    - client_uuid: 'c1000000-0000-4000-8000-000000000116'
                      entity: reading
                      priority: normal
                      created_at: '2026-11-14T07:35:00Z'
                      payload:
                        {
                          indicator_code: HEART_RATE,
                          measured_at: '2026-11-14T07:35:00Z',
                          values: { value: 72 },
                          input_method: wearable,
                        }
                    - client_uuid: 'ca000000-0000-4000-8000-000000000001'
                      entity: wellbeing_checkin
                      priority: normal
                      created_at: '2026-11-14T06:45:00Z'
                      payload:
                        {
                          measured_at: '2026-11-14T06:45:00Z',
                          mood: 62,
                          fatigue: 40,
                          stress: 35,
                          crew_conflict: 10,
                          sleep_hours: 6.5,
                        }
      responses:
        '200':
          description: Resultado por item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
              examples:
                results:
                  summary: Los cuatro estados posibles
                  value:
                    server_time: '2026-11-14T08:06:01Z'
                    batch_id: '90000000-0000-4000-8000-000000000001'
                    clock_offset_s: 1
                    counts: { accepted: 1, duplicate: 1, conflict: 0, rejected: 2 }
                    results:
                      - client_uuid: 'e1000000-0000-4000-8000-000000000003'
                        entity: emergency_answer
                        status: rejected
                        server_id: null
                        error:
                          {
                            code: ENTITY_NOT_SUPPORTED,
                            message: El servidor todavía no acepta emergency_answer por sincronización.,
                            details: { entity: emergency_answer },
                          }
                      - client_uuid: 'c1000000-0000-4000-8000-000000000101'
                        entity: reading
                        status: duplicate
                        server_id: '30000000-0000-4000-8000-000000000101'
                        sequence: 1
                        result:
                          evaluation:
                            {
                              code: BLOOD_PRESSURE,
                              level: caution,
                              rule_index: 5,
                              rules_version: 1,
                              escalation: crew,
                            }
                          escalation_id: '60000000-0000-4000-8000-000000000101'
                          late_sync: true
                          lag_s: 2160
                      - client_uuid: 'c1000000-0000-4000-8000-000000000116'
                        entity: reading
                        status: accepted
                        server_id: '30000000-0000-4000-8000-000000000116'
                        sequence: 2
                        result:
                          evaluation:
                            {
                              code: HEART_RATE,
                              level: normal,
                              rule_index: 6,
                              rules_version: 1,
                              recommendation: Tu pulso en reposo está en rango normal.,
                              escalation: self_care,
                              basis: source,
                              source_ids: [aha_hr],
                            }
                          escalation_id: null
                          late_sync: true
                          lag_s: 1860
                      - client_uuid: 'ca000000-0000-4000-8000-000000000001'
                        entity: wellbeing_checkin
                        status: rejected
                        server_id: null
                        sequence: 3
                        error:
                          code: VALIDATION_ERROR
                          message: La petición tiene campos inválidos.
                          details:
                            - { field: payload.mood, issue: debe ser un entero entre 0 y 100 }
                conflict:
                  summary: Mismo client_uuid con otro contenido
                  value:
                    server_time: '2026-11-14T08:06:01Z'
                    batch_id: '90000000-0000-4000-8000-000000000002'
                    clock_offset_s: 0
                    counts: { accepted: 0, duplicate: 0, conflict: 2, rejected: 0 }
                    results:
                      - client_uuid: 'c1000000-0000-4000-8000-000000000101'
                        entity: reading
                        status: conflict
                        server_id: '30000000-0000-4000-8000-000000000101'
                        sequence: 1
                        error:
                          {
                            code: PAYLOAD_MISMATCH,
                            message: Ya existe un registro con ese client_uuid y otro contenido. Para corregirlo usa supersedes_uuid con un client_uuid nuevo.,
                            details: { server_id: '30000000-0000-4000-8000-000000000101' },
                          }
                      - client_uuid: 'c1000000-0000-4000-8000-000000000120'
