    post:
      tags: [Salud conductual]
      summary: Acuse de una solicitud de apoyo
      description: |
        Solo sobre lo que ya llegó a Tierra (`deliver_at <= now()`); antes, **404**. Idempotente
        (`open` → `acknowledged`); responder también cuenta como acuse. **409** si está cerrada.
      operationId: ackSupportRequest
      x-status: mvp
      x-roles: [behavioral_health]
      x-sensitivity: confidential
      x-hazards: [isolation_confinement, distance_from_earth]
