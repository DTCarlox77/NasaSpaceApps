  # ===================================================================== Sync
  /api/v1/sync/push:
    post:
      tags: [Sync]
      summary: Envía un lote de cambios hechos sin conexión
      description: |
        El servidor procesa primero los items con `priority: emergency` y luego el resto en
        orden de `created_at`. Cada `payload` tiene la misma forma que el body del endpoint en
        línea equivalente (p. ej. `reading` = `POST /readings`). Resultado por item:
        - `accepted`: guardado (`server_id`, y `result` con la evaluación si aplica).
        - `duplicate`: ya existía ese `client_uuid` (`server_id` del existente).
        - `conflict`: choca con el estado del servidor (p. ej. ya hay una sesión de emergencia activa).
        - `rejected`: inválido (`error` con el formato de errores); no reintentar sin corregir.
      operationId: syncPush
      x-status: mvp
      x-roles: [astronaut]
      x-hazards: [distance_from_earth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
            examples:
              mixed:
                summary: Respuesta de triaje, lecturas y check-in
                value:
                  device_id: ipad-crew-01
                  sent_at: '2026-11-14T08:06:00Z'
                  items:
                    - client_uuid: 'e1000000-0000-4000-8000-000000000003'
                      entity: emergency_answer
                      priority: emergency
                      created_at: '2026-11-14T08:02:50Z'
                      payload:
                        {
