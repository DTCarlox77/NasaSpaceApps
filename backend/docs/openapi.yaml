  /api/v1/wellbeing/support-requests:
    post:
      tags: [Bienestar]
      summary: Quiero hablar con alguien
      description: |
        Crea una solicitud confidencial para behavioral_health (nunca llega a la tripulación, al
        comandante, al oficial médico ni a admin, ni siquiera en conteos). Viaja a Tierra con el
        retraso del enlace (`deliver_at`; null = en cola durante un corte). Urgencia `later`
        (puede esperar), `today` o `now`; canal `message` o `session`. Con `now`, `suggestions`
        trae lo que la app puede ofrecer mientras tanto (respiración guiada y hablar con el
        oficial médico de a bordo): son sugerencias, el servidor no avisa a nadie a bordo. Las
        respuestas llegan por `GET /sync/pull` (`messages`, `channel: support`) cuando su
        `deliver_at` ya pasó. También por `/sync/push` (entity `support_request`).
      operationId: createSupportRequest
      x-status: mvp
      x-roles: [astronaut]
      x-sensitivity: confidential
      x-hazards: [isolation_confinement, distance_from_earth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportRequestCreate'
            examples:
              today:
                summary: Hablar hoy por mensaje
                value:
                  client_uuid: 'cd000000-0000-4000-8000-000000000001'
                  urgency: today
                  channel: message
                  content: Llevo varios días durmiendo mal y me cuesta concentrarme.
                  created_at: '2026-11-14T21:10:00Z'
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequest'
              examples:
                created:
                  $ref: '#/components/examples/SupportRequestOrion'
                now:
                  summary: Urgencia now (con sugerencias)
                  value:
                    id: 'a1000000-0000-4000-8000-000000000002'
                    client_uuid: 'cd000000-0000-4000-8000-000000000002'
                    astronaut_id: '10000000-0000-4000-8000-000000000014'
                    status: open
                    urgency: now
                    channel: message
                    content: Necesito hablar con alguien.
                    created_at: '2026-11-14T22:10:00Z'
                    received_at: '2026-11-14T22:10:01Z'
                    deliver_at: '2026-11-14T22:11:31Z'
                    suggestions:
                      - code: guided_breathing
                        title: Respiración guiada
                        description: Un ejercicio de respiración guiada en la app mientras llega la respuesta.
                      - code: talk_to_cmo
                        title: Hablar con el oficial médico de a bordo
                        description: 'Si lo necesitas ahora, puedes buscar al oficial médico. Es tu decisión: nadie a bordo recibe un aviso automático.'
        '200':
          description: Duplicado (mismo client_uuid)
