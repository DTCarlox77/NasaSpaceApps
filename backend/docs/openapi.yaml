  /api/v1/me/offline-pin:
    put:
      tags: [Auth]
      summary: Define el PIN de desbloqueo offline del dispositivo
      description: |
        Define o cambia el PIN de desbloqueo sin conexión del **dispositivo de la sesión**
        (`device_id` = el del login; si no, 403 `DEVICE_NOT_OWNED`). El servidor guarda solo el
        hash bcrypt y nunca devuelve el PIN ni su hash. Permite desbloquear la app sin conexión
        hasta `offline_unlock_until` (`OFFLINE_UNLOCK_DAYS`, 7 días; cada login en línea en ese
        dispositivo lo renueva). La verificación sin conexión la hace la app con su propio
        verificador local (`offline_verifier`). El PIN **nunca** autentica contra el servidor:
        para sincronizar hace falta un login o un refresh. Un PIN nuevo reemplaza al anterior; el
        comandante (`/crew/users/{id}/reset-pin`) o la revocación de la tableta lo borran
        (`offline_unlock_until: null` en el próximo login = pedir otro).
      operationId: setOfflinePin
      x-status: extra
      x-roles: [astronaut]
      x-hazards: [distance_from_earth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflinePinRequest'
            examples:
              pin:
                summary: PIN de 6 dígitos
                value: { pin: '482915', device_id: ipad-crew-01 }
      responses:
        '200':
          description: PIN guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflinePinResponse'
              examples:
                saved:
                  summary: PIN válido por 7 días
                  value:
                    device_id: ipad-crew-01
                    offline_unlock_until: '2026-11-21T16:00:00Z'
                    offline_verifier:
                      {
                        kdf: PBKDF2-HMAC-SHA256,
                        iterations: 600000,
                        salt_bytes: 16,
                        max_attempts: 5,
                      }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

