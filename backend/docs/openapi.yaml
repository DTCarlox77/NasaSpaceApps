  schemas:
    # ---------------------------------------------------------------- comunes
    Uuid:
      type: string
      format: uuid
      example: '00000000-0000-4000-8000-000000000011'
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 en UTC.
      example: '2026-11-14T08:02:00Z'
    NextCursor:
      type: string
      nullable: true
      description: Cursor de la página siguiente; null = última página.
    Role:
      type: string
      description: 'service = cuenta de servicio de los sensores del hábitat (solo POST /habitat/readings).'
      enum: [astronaut, flight_surgeon, behavioral_health, admin, service]
    CrewRole:
      type: string
      enum: [commander, pilot, crew_medical_officer, flight_engineer, mission_specialist]
    Hazard:
      type: string
      description: Peligro RIDGE de NASA.
      enum:
        [
          space_radiation,
          isolation_confinement,
          distance_from_earth,
          gravity_fields,
          hostile_closed_env,
        ]
    Level:
      type: string
      description: Nivel del semáforo. unrated = sin evaluar (medición no válida o sin línea base).
      enum: [normal, caution, critical, unrated]
    EscalationLevel:
      type: string
      description: A quién se escala. behavioral_health solo para indicadores confidenciales.
      enum: [self_care, crew, flight_surgeon, behavioral_health]
    Basis:
      type: string
      description: Base de la regla (fuente, fuente adaptada, regla de diseño o pendiente de fuente).
      enum: [source, source_adapted, design_rule, pending_source]
    Priority:
      type: string
      enum: [routine, urgent, emergency]
    EscalationStatus:
      type: string
      enum: [queued, delivered, acknowledged, responded, closed]
    TriageCategory:
      type: string
      enum: [green, yellow, red, black]
    TriggerType:
      type: string
      description: manual_button = botón manual; crew_event = un tripulante avisa (p. ej. por voz); missed_checkin, critical_reading y environment_alarm = activación automática.
      enum: [manual_button, crew_event, missed_checkin, critical_reading, environment_alarm]
    EmergencyStatus:
      type: string
      description: pending = activación automática esperando "estoy bien"; merged = activación que se unió a otra sesión (merged_into).
      enum: [pending, active, closed, cancelled, merged]
    AssessmentStatus:
      type: string
      enum: [in_progress, completed, unreachable]
    AnswerSource:
      type: string
      enum: [tap, voice, prefill, auto]
    MessageDirection:
      type: string
      enum: [to_earth, to_crew]
    InputMethod:
      type: string
      enum: [manual, camera, wearable, sensor, slider, questionnaire, minigame, clicks]
    Fitness:
      type: string
      description: Aptitud para tarea crítica según la PVT.
      enum: [fit, not_confirmed]
    Health:
      type: object
      required: [status, db, time, version]
      properties:
        status:
          type: string
          enum: [ok, error]
        db:
          type: string
          enum: [up, down]
        time:
          type: string
          format: date-time
        version:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Código estable para la lógica del cliente. Mínimos: VALIDATION_ERROR (400),
            UNAUTHENTICATED (401), FORBIDDEN (403), NOT_FOUND (404), CONFLICT (409),
            ACCOUNT_LOCKED (423), PASSWORD_CHANGE_REQUIRED (428), RATE_LIMITED (429).
            Emergencia: SESSION_CLOSED, ASSESSMENT_COMPLETED, DEADMAN_EXPIRED (409).
            Sync (por item): PAYLOAD_MISMATCH, SUPERSEDE_CONFLICT, FUTURE_TIMESTAMP,
            UNKNOWN_ENTITY, ENTITY_NOT_SUPPORTED; del lote: DEVICE_NOT_OWNED (403),
            PAYLOAD_TOO_LARGE (413).
            Específicos: INVALID_CREDENTIALS, TOKEN_REUSE_DETECTED, NO_ACTIVE_ASSIGNMENT,
            WEAK_PASSWORD, USERNAME_TAKEN, EMAIL_TAKEN, CALL_SIGN_TAKEN, CREW_ROLE_TAKEN,
            ASSIGNMENT_OVERLAP, OUTAGE_OVERLAP,
            SESSION_ALREADY_ACTIVE, INVALID_JSON, PAYLOAD_TOO_LARGE, INTERNAL_ERROR.
          example: NOT_FOUND
        message:
          type: string
          description: Texto legible en español; no usar para lógica.
          example: 'Ruta no encontrada: GET /api/v1/foo'
        details:
          description: Información adicional del error (opcional); su forma depende del código.

    # ---------------------------------------------------------------- auth
    LoginRequest:
      type: object
      required: [username, password, device_id]
      properties:
        username: { type: string, pattern: '^[a-z0-9._-]{3,40}$' }
        password: { type: string, format: password, minLength: 1 }
        device_id: { type: string, minLength: 1, maxLength: 100 }
    TokenPair:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Segundos de vida del access token. }
        refresh_token: { type: string, description: Rotativo; guárdalo de forma segura. }
    UserSummary:
      type: object
      required: [id, username, full_name, role]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        username: { type: string }
        full_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        email: { type: string, format: email, nullable: true }
    MissionRef:
      type: object
      required: [id, code, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [planned, active, completed, aborted] }
    EnvironmentRef:
      type: object
      required: [code, gravity_g, comm_delay_seconds]
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [spacecraft, space_station, rover, lunar_base, mars_base] }
        gravity_g: { type: number, minimum: 0, maximum: 1.5 }
        comm_delay_seconds: { type: integer, minimum: 0, description: Retraso en un sentido. }
    UserContext:
      type: object
      description: |
        Astronauta: su asignación vigente (`v_current_crew`), con misión y entorno.
        Personal de Tierra: `ground_missions` (equipo en Tierra) y los campos de astronauta en null.
      properties:
        astronaut_id: { type: string, format: uuid, nullable: true }
        call_sign: { type: string, nullable: true }
        crew_role:
          type: string
          nullable: true
          enum: [commander, pilot, crew_medical_officer, flight_engineer, mission_specialist, null]
        sex:
          $ref: '#/components/schemas/BiologicalSex'
        mission: { $ref: '#/components/schemas/MissionRef' }
        environment: { $ref: '#/components/schemas/EnvironmentRef' }
        ground_missions:
          type: array
          items: { $ref: '#/components/schemas/MissionRef' }
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [must_change_password, user, context]
          properties:
            must_change_password: { type: boolean }
            offline_unlock_until:
              type: string
              format: date-time
              nullable: true
              description: Hasta cuándo puede desbloquear la app sin conexión (con PIN).
            user: { $ref: '#/components/schemas/UserSummary' }
            context: { $ref: '#/components/schemas/UserContext' }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 10 }
        device_id: { type: string, maxLength: 100 }
    RefreshRequest:
      type: object
      required: [refresh_token, device_id]
      properties:
        refresh_token: { type: string }
        device_id: { type: string, maxLength: 100 }
    LogoutRequest:
      type: object
      properties:
        device_id: { type: string, maxLength: 100 }
        all_devices: { type: boolean, default: false }
    Me:
      type: object
      required: [user, context]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        context: { $ref: '#/components/schemas/UserContext' }
    OfflinePinRequest:
      type: object
      required: [pin, device_id]
      properties:
        pin: { type: string, pattern: '^[0-9]{4,8}$', format: password }
        device_id: { type: string, maxLength: 100 }
    OfflinePinResponse:
      type: object
      required: [device_id, offline_unlock_until]
      properties:
        device_id: { type: string }
        offline_unlock_until: { $ref: '#/components/schemas/Timestamp' }
        offline_verifier:
          type: object
          description: |
            Cómo guarda la app su verificador local del PIN (regla de diseño): KDF con una sal
            aleatoria generada en el dispositivo; tras `max_attempts` fallos (LOCKOUT_MAX_ATTEMPTS)
            borra el verificador y exige un login en línea.
          required: [kdf, iterations, salt_bytes, max_attempts]
          properties:
            kdf: { type: string, enum: [PBKDF2-HMAC-SHA256] }
            iterations:
              type: integer
              minimum: 10000
              example: 600000
              description: |
                `OFFLINE_PIN_PBKDF2_ITERATIONS` del servidor (600 000 por defecto, OWASP). Usa
                siempre el valor recibido: puede bajar si la app tarda demasiado en calcularlo.
            salt_bytes: { type: integer, minimum: 16 }
            max_attempts: { type: integer, minimum: 1 }

    # ---------------------------------------------------------------- cuentas y dispositivos
    UserAdmin:
      type: object
      required:
        [id, username, full_name, role, must_change_password, is_active, failed_login_attempts]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        username: { type: string }
        email: { type: string, format: email, nullable: true }
        full_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        must_change_password: { type: boolean }
        is_active: { type: boolean }
        failed_login_attempts: { type: integer, minimum: 0 }
        locked_until: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    CreateUserRequest:
      type: object
      required: [username, full_name, role]
      description: '`username` y `call_sign` son únicos sin distinguir mayúsculas; `email` también es único.'
      properties:
        username: { type: string, pattern: '^[a-z0-9._-]{3,40}$' }
        full_name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        astronaut:
          type: object
          description: Obligatorio si role = astronaut.
          required: [call_sign, mission_id, crew_role]
          properties:
            call_sign: { type: string, minLength: 2, maxLength: 20 }
            agency: { type: string, nullable: true }
            mission_id: { $ref: '#/components/schemas/Uuid' }
            crew_role: { $ref: '#/components/schemas/CrewRole' }
            sex:
              $ref: '#/components/schemas/BiologicalSex'
        ground_mission_ids:
          type: array
          description: Misiones a cuyo equipo en Tierra se agrega (no aplica a astronautas ni a service). Si se omite, las misiones activas del equipo en Tierra del admin que crea la cuenta.
          items: { $ref: '#/components/schemas/Uuid' }
        service:
          type: object
          description: Obligatorio si role = service. Vincula la cuenta de los sensores con su misión.
          required: [mission_id, description]
          properties:
            mission_id: { $ref: '#/components/schemas/Uuid' }
            description: { type: string, minLength: 1, maxLength: 200 }
    BiologicalSex:
      type: string
      nullable: true
      enum: [female, male, null]
      description: |
        Sexo biológico para referencias clínicas futuras. **No es identidad de género.** Datos
        sintéticos en la demo. Quién lo recibe (accessPolicy, vista `clinical_profile`): el propio
        astronauta, y `flight_surgeon` y `behavioral_health` de su misión. `admin` lo escribe
        pero **no** lo recibe; otro astronauta (también el CMO y el comandante) nunca lo ve, y no
        aparece en el dashboard. Si el rol no puede verlo, el campo no viene. Ninguna regla
        actual lo usa y la radiación no depende de él (límite de carrera universal,
        NASA-STD-3001 Vol. 1 [V1 4030]).
    AstronautProfile:
      type: object
      required: [id, user_id, call_sign, synthetic]
      description: Lo recibe admin, así que nunca trae `sex` (ver BiologicalSex).
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        user_id: { $ref: '#/components/schemas/Uuid' }
        call_sign: { type: string }
        agency: { type: string, nullable: true }
        synthetic: { type: boolean }
    AstronautPatch:
      type: object
      required: [sex]
      additionalProperties: false
      properties:
        sex:
          $ref: '#/components/schemas/BiologicalSex'
    CreatedUser:
      type: object
      required: [user, temporary_password]
      properties:
        user: { $ref: '#/components/schemas/UserAdmin' }
        astronaut: { $ref: '#/components/schemas/AstronautProfile' }
        assignment: { $ref: '#/components/schemas/Assignment' }
        temporary_password: { type: string, description: Se muestra una sola vez. }
    TemporaryPasswordResponse:
      type: object
      required: [user_id, temporary_password, must_change_password, revoked_refresh_tokens]
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        temporary_password: { type: string, description: Se muestra una sola vez. }
        must_change_password: { type: boolean }
        revoked_refresh_tokens: { type: integer, minimum: 0 }
    DeviceCreate:
      type: object
      required: [label, mission_id]
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        mission_id: { $ref: '#/components/schemas/Uuid' }
        module_id: { type: string, nullable: true }
    CrewDeviceCreate:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        module_id: { type: string, nullable: true }
    Device:
      type: object
      required: [id, label, kind, mission_id, registered_via, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        label: { type: string }
        kind: { type: string, enum: [tablet] }
        mission_id: { $ref: '#/components/schemas/Uuid' }
        module_id: { type: string, nullable: true }
        registered_by: { type: string, format: uuid, nullable: true }
        registered_via: { type: string, enum: [admin, commander] }
        status: { type: string, enum: [active, revoked] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_seen_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Device' }
    DeviceCreated:
      type: object
      required: [device, credential]
      properties:
        device: { $ref: '#/components/schemas/Device' }
        credential:
          { type: string, description: Se muestra una sola vez; va en X-Device-Credential. }
    DelegatedAudit:
      type: object
      required: [audit_id, reported_to_earth]
      properties:
        audit_id: { $ref: '#/components/schemas/Uuid' }
        reported_to_earth:
          type: boolean
          description: true = ya tiene hora de llegada a Tierra; false = en cola por un corte.
        deliver_at:
          type: string
          format: date-time
          nullable: true
          description: |
            compute_deliver_at(misión, recepción), calculado al leer (la bitácora es append-only).
            null = en cola esperando enlace.
    DelegatedActionResult:
      type: object
      required: [action, target_user_id, performed_at, audit]
      properties:
        action: { type: string, enum: [unlock_user, reset_offline_pin] }
        target_user_id: { $ref: '#/components/schemas/Uuid' }
        performed_at: { $ref: '#/components/schemas/Timestamp' }
        audit: { $ref: '#/components/schemas/DelegatedAudit' }
    CrewDeviceCreated:
      allOf:
        - $ref: '#/components/schemas/DeviceCreated'
        - type: object
          required: [audit]
          properties:
            audit: { $ref: '#/components/schemas/DelegatedAudit' }

    # ---------------------------------------------------------------- misión
    Mission:
      type: object
      required: [id, code, name, environment_code, status, starts_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        name: { type: string }
        environment_code: { type: string }
        status: { type: string, enum: [planned, active, completed, aborted] }
        starts_at: { $ref: '#/components/schemas/Timestamp' }
        ends_at: { type: string, format: date-time, nullable: true }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    MissionCreate:
      type: object
      required: [code, name, environment_code, starts_at]
      properties:
        code: { type: string, minLength: 2, maxLength: 20 }
        name: { type: string, minLength: 1, maxLength: 120 }
        environment_code: { type: string }
        starts_at: { $ref: '#/components/schemas/Timestamp' }
        ends_at: { type: string, format: date-time, nullable: true }
    MissionPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        environment_code: { type: string }
        status: { type: string, enum: [planned, active, completed, aborted] }
        ends_at: { type: string, format: date-time, nullable: true }
    MissionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Mission' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    Environment:
      type: object
      required: [code, name, type, gravity_g, comm_delay_seconds]
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [spacecraft, space_station, rover, lunar_base, mars_base] }
        gravity_g: { type: number, minimum: 0, maximum: 1.5 }
        comm_delay_seconds:
          { type: integer, minimum: 0, description: Retraso en un sentido (acelerado en la demo). }
        description: { type: string, nullable: true }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    EnvironmentCreate:
      type: object
      required: [code, name, type, gravity_g, comm_delay_seconds]
      properties:
        code: { type: string, pattern: '^[a-z0-9_]+$' }
        name: { type: string }
        type: { type: string, enum: [spacecraft, space_station, rover, lunar_base, mars_base] }
        gravity_g: { type: number, minimum: 0, maximum: 1.5 }
        comm_delay_seconds: { type: integer, minimum: 0 }
        description: { type: string, nullable: true }
    EnvironmentPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string }
        gravity_g: { type: number, minimum: 0, maximum: 1.5 }
        comm_delay_seconds: { type: integer, minimum: 0 }
        description: { type: string, nullable: true }
    EnvironmentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Environment' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    Assignment:
      type: object
      required: [id, mission_id, astronaut_id, crew_role, assigned_from]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mission_id: { $ref: '#/components/schemas/Uuid' }
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        call_sign: { type: string }
        crew_role: { $ref: '#/components/schemas/CrewRole' }
        assigned_from: { $ref: '#/components/schemas/Timestamp' }
        assigned_to:
          type: string
          format: date-time
          nullable: true
          description: null = sin fecha de fin. Vigente mientras assigned_from <= now() < assigned_to.
        created_at: { $ref: '#/components/schemas/Timestamp' }
    AssignmentCreate:
      type: object
      required: [mission_id, astronaut_id, crew_role]
      properties:
        mission_id: { $ref: '#/components/schemas/Uuid' }
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        crew_role: { $ref: '#/components/schemas/CrewRole' }
        assigned_from: { $ref: '#/components/schemas/Timestamp' }
    AssignmentPatch:
      type: object
      minProperties: 1
      properties:
        assigned_to:
          type: string
          format: date-time
          description: Fin de la asignación (puede ser futuro; vigente hasta esa fecha).
        crew_role: { $ref: '#/components/schemas/CrewRole' }
    AssignmentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Assignment' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CommOutage:
      type: object
      required: [id, mission_id, starts_at, reason]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mission_id: { $ref: '#/components/schemas/Uuid' }
        starts_at: { $ref: '#/components/schemas/Timestamp' }
        ends_at:
          { type: string, format: date-time, nullable: true, description: null = corte en curso. }
        reason: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    CommOutageCreate:
      type: object
      required: [mission_id, starts_at, reason]
      properties:
        mission_id: { $ref: '#/components/schemas/Uuid' }
        starts_at: { $ref: '#/components/schemas/Timestamp' }
        ends_at: { type: string, format: date-time, nullable: true }
        reason: { type: string, minLength: 1, maxLength: 200 }
    CommOutagePatch:
      type: object
      minProperties: 1
      properties:
        ends_at: { type: string, format: date-time, nullable: true }
        reason: { type: string, minLength: 1, maxLength: 200 }
    SimulatorHistoryRequest:
      type: object
      properties:
        days: { type: integer, minimum: 1, maximum: 60, default: 14 }
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 42
          description: Misma semilla → mismos valores y mismos client_uuid.
    SimulatorScenarioRequest:
      type: object
      properties:
        intensity: { type: string, enum: [low, high], default: low }
        astronaut:
          type: string
          description: Call sign de la tripulación vigente (ORION, VEGA, LYRA, ATLAS).
          example: VEGA
        module_id:
          type: string
          enum: [HAB-1, HAB-2]
          description: Solo `co2_spike`.
        contagion:
          type: boolean
          default: false
          description: Solo `crew_illness`.
    SimulatorCount:
      type: object
      required: [created, duplicate]
      properties:
        created: { type: integer }
        duplicate: { type: integer }
    SimulatorSummary:
      type: object
      required: [kind, mission_code, params, readings, wellbeing, levels, escalations, errors]
      properties:
        kind: { type: string, enum: [history, scenario] }
        scenario:
          type: string
          enum:
            [
              solar_event,
              crew_illness,
              co2_spike,
              wellbeing_decline,
              offline_batch,
              emergency_solar,
            ]
        mission_code: { type: string, example: ARES-1 }
        params: { type: object, additionalProperties: true }
        from: { type: string, format: date-time, description: Solo la historia. }
        to: { type: string, format: date-time, description: Solo la historia. }
        at: { type: string, format: date-time, description: Minuto del escenario. }
        readings:
          type: object
          required: [created, duplicate, rejected]
          properties:
            created: { type: integer }
            duplicate: { type: integer }
            rejected: { type: integer }
        wellbeing:
          type: object
          description: Solo cuántos registros (como el cumplimiento); nunca valores ni niveles.
          properties:
            checkins: { $ref: '#/components/schemas/SimulatorCount' }
            checkin_corrections: { type: integer }
            pvt_runs: { $ref: '#/components/schemas/SimulatorCount' }
            instruments: { $ref: '#/components/schemas/SimulatorCount' }
        levels:
          type: object
          description: Lecturas creadas por indicador ESTÁNDAR y nivel. Sin bienestar.
          additionalProperties:
            type: object
            additionalProperties: { type: integer }
        escalations:
          type: object
          description: Escalamientos no confidenciales creados, por destino.
          required: [created, by_level]
          properties:
            created: { type: integer }
            by_level:
              type: object
              additionalProperties: { type: integer }
        confidential_note: { type: string }
        emergency:
          type: object
          description: Solo `emergency_solar`. Sesión, evaluaciones, orden de atención y cuándo sale el reporte.
          additionalProperties: true
        sync:
          type: object
          description: Solo `offline_batch`. Conteos del lote empujado por POST /sync/push.
          properties:
            batch_id: { $ref: '#/components/schemas/Uuid' }
            device_id: { type: string }
            items: { type: integer }
            counts:
              type: object
              additionalProperties: { type: integer }
            late_sync: { type: integer, description: Items que llegaron con late_sync. }
        notes:
          type: array
          items: { type: string }
        errors:
          type: array
          description: Primeras lecturas rechazadas (debería estar vacío).
          items: { type: object, additionalProperties: true }
    DemoResetRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          enum: [ARES-1]
          description: Código de la misión que se reinicia (confirmación obligatoria).
        days: { type: integer, minimum: 1, maximum: 60, default: 14 }
        seed: { type: integer, minimum: 0, maximum: 2147483647, default: 42 }
    DemoResetSummary:
      type: object
      required:
        - mission_code
        - started_at
        - finished_at
        - history
        - emergencies
        - comm_outages
        - escalations
        - users
        - fitness
        - not_confirmed
        - panel_flags
        - triage
        - notes
      properties:
        mission_code: { type: string, example: ARES-1 }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { $ref: '#/components/schemas/Timestamp' }
        history:
          type: object
          properties:
            days: { type: integer }
            seed: { type: integer }
            from: { $ref: '#/components/schemas/Timestamp' }
            to: { $ref: '#/components/schemas/Timestamp' }
            readings:
              type: object
              properties:
                created: { type: integer }
                duplicate: { type: integer }
                rejected: { type: integer }
            errors:
              type: array
              items: { type: object, additionalProperties: true }
        emergencies:
          type: object
          properties:
            closed: { type: integer, description: Sesiones pending o active cerradas (cancelled). }
        comm_outages:
          type: object
          properties:
            closed: { type: integer }
            scheduled_left:
              type: integer
              description: Cortes programados a futuro (no se tocan).
        escalations:
          type: object
          description: Solo físicos y de emergencia. Lo conductual se cierra pero no se cuenta.
          properties:
            closed: { type: integer }
        users:
          type: array
          items:
            type: object
            properties:
              username: { type: string }
              unlocked: { type: boolean }
              reactivated: { type: boolean }
              password_restored: { type: boolean }
              must_change_password: { type: boolean }
              missing: { type: boolean, description: El usuario del seed no existe. }
        fitness:
          type: object
          description: Aptitud por call sign (lo mismo que ve admin en el dashboard).
          additionalProperties: { type: string, enum: [fit, not_confirmed] }
        not_confirmed:
          type: string
          nullable: true
          description: Quién quedó sin PVT reciente (null si los 4 ya tenían una apta).
        panel_flags:
          type: array
          description: |
            Última lectura física vigente en caution o critical: lo que el panel seguirá
            marcando.
          items:
            type: object
            properties:
              call_sign: { type: string }
              indicator_code: { type: string }
              level: { type: string, enum: [caution, critical] }
              measured_at: { $ref: '#/components/schemas/Timestamp' }
        triage:
          type: object
          properties:
            missed_checkin_counts_from: { $ref: '#/components/schemas/Timestamp' }
            missed_checkin_after_h: { type: integer }
        notes:
          type: array
          items: { type: string }
    CommOutagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CommOutage' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CommStatus:
      type: object
      required: [delay_seconds, link, upcoming_outages]
      properties:
        delay_seconds: { type: integer, minimum: 0 }
        link: { type: string, enum: [up, down], description: down = hay un corte en curso. }
        current_outage: { $ref: '#/components/schemas/CommOutage' }
        upcoming_outages:
          type: array
          items: { $ref: '#/components/schemas/CommOutage' }
    CurrentMission:
      type: object
      required: [mission, environment, comm]
      properties:
        mission: { $ref: '#/components/schemas/Mission' }
        environment: { $ref: '#/components/schemas/Environment' }
        crew_role:
          type: string
          nullable: true
          description: Rol del usuario en la tripulación (null para personal de Tierra).
          enum: [commander, pilot, crew_medical_officer, flight_engineer, mission_specialist, null]
        comm: { $ref: '#/components/schemas/CommStatus' }
    CrewMember:
      type: object
      required: [astronaut_id, call_sign, full_name, crew_role, assigned_from]
      properties:
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        user_id: { $ref: '#/components/schemas/Uuid' }
        call_sign: { type: string }
        full_name: { type: string }
        crew_role: { $ref: '#/components/schemas/CrewRole' }
        assigned_from: { $ref: '#/components/schemas/Timestamp' }
        sex:
          $ref: '#/components/schemas/BiologicalSex'
    CrewPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CrewMember' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CrewAlert:
      type: object
      description: Alerta física ya escalada a bordo (`crew`). Sin valores ni motivo.
      required: [escalation_id, indicator_code, indicator_name, level, created_at]
      properties:
        escalation_id: { $ref: '#/components/schemas/Uuid' }
        indicator_code: { type: string, example: HEART_RATE }
        indicator_name: { type: string, example: Frecuencia cardíaca en reposo }
        level: { $ref: '#/components/schemas/Level' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    CrewPhysical:
      type: object
      nullable: true
      description: |
        Semáforo físico de un tripulante. Solo si quien consulta es el oficial médico (CMO)
        vigente; null para los demás (el comandante incluido).
      required: [zones, indicators]
      properties:
        zones:
          type: array
          description: |
            Zonas del cuerpo (sin `environment` ni `by_symptom`), con el peor nivel de la última
            lectura de sus indicadores estándar. `SYMPTOM` cuenta en la zona de cada síntoma
            reportado. Zona sin lecturas = `unrated`. Como `GET /me/body-status`, pero sin
            `SLEEP_HOURS`: `brain` solo lo colorea `SYMPTOM`.
          items:
            type: object
            required: [zone, worst_level]
            properties:
              zone: { type: string, example: heart }
              worst_level: { $ref: '#/components/schemas/Level' }
        indicators:
          type: array
          description: |
            Indicadores estándar con alguna lectura en la misión, salvo `SLEEP_HOURS`, en el
            orden del catálogo.
          items:
            type: object
            required: [code, level, last_value, measured_at]
            properties:
              code: { type: string, example: HEART_RATE }
              level: { $ref: '#/components/schemas/Level' }
              last_value: { $ref: '#/components/schemas/ReadingValues' }
              measured_at: { $ref: '#/components/schemas/Timestamp' }
    CrewStatusMember:
      type: object
      required: [astronaut_id, call_sign, display_name, crew_role, emergency, crew_alerts, physical]
      properties:
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        call_sign: { type: string }
        display_name: { type: string }
        crew_role: { $ref: '#/components/schemas/CrewRole' }
        emergency:
          type: object
          nullable: true
          description: |
            Sesión de emergencia abierta (`pending` o `active`) de la misión; null si no hay.
            Es la misma en cada fila (una sesión cubre a toda la tripulación).
          required: [session_id, status]
          properties:
            session_id: { $ref: '#/components/schemas/Uuid' }
            status: { type: string, enum: [pending, active] }
        crew_alerts:
          type: array
          description: |
            Alertas físicas escaladas a bordo en las últimas 24 h, la más reciente primero. Sin
            las de `SLEEP_HOURS`.
          items: { $ref: '#/components/schemas/CrewAlert' }
        physical: { $ref: '#/components/schemas/CrewPhysical' }
    CrewStatus:
      type: object
      required: [mission, generated_at, viewer_crew_role, crew]
      properties:
        mission:
          type: object
          required: [id, code]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            code: { type: string }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        viewer_crew_role: { $ref: '#/components/schemas/CrewRole' }
        crew:
          type: array
          description: Tripulación vigente, por `call_sign`.
          items: { $ref: '#/components/schemas/CrewStatusMember' }

    # ---------------------------------------------------------------- catálogo
    Component:
      type: object
      required: [name, type, role, required]
      properties:
        name: { type: string }
        type: { type: string, description: 'number, integer, boolean, string o string[].' }
        role: { type: string, enum: [value, context] }
        required: { type: boolean }
        unit: { type: string }
        values: { type: string, description: Valores admitidos (texto). }
    DerivedField:
      type: object
      required: [name, type, how]
      properties:
        name: { type: string }
        type: { type: string }
        how: { type: string, description: Cómo lo calcula el motor a partir del historial. }
    Guide:
      type: object
      description: Las 5 preguntas del reto.
      required: [measurable, why, hazard_effect, when_to_escalate, prevention]
      properties:
        measurable: { type: string, description: ¿Se puede medir en el espacio? ¿Cómo? }
        why: { type: string, description: ¿Por qué es necesario? }
        hazard_effect: { type: string, description: ¿Cómo lo afectan los peligros? }
        when_to_escalate:
          { type: string, description: ¿Cuándo requiere a la tripulación o al flight surgeon? }
        prevention: { type: string, description: ¿Qué acciones previenen lo crítico? }
    Source:
      type: object
      required: [id, title, url]
      properties:
        id: { type: string }
        title: { type: string }
        url: { type: string, format: uri }
        language_version:
          { type: string, description: 'Versión de idioma de la fuente (cuestionarios).' }
    Condition:
      type: object
      description: |
        Condición del evaluador común (`conditions.js`): hoja `{ field, op, value }` con `op` en
        eq, in, has_any, lt, lte, gt, gte, between; o grupo `{ any: [...] }` / `{ all: [...] }`
        (anidables). `{ all: [] }` = siempre verdadero. Campo ausente = falso.
      additionalProperties: true
    Rule:
      type: object
      required: [level, when, recommendation, escalation, source_ids, basis]
      properties:
        level: { $ref: '#/components/schemas/Level' }
        when: { $ref: '#/components/schemas/Condition' }
        recommendation: { type: string }
        escalation: { $ref: '#/components/schemas/EscalationLevel' }
        source_ids:
          type: array
          minItems: 1
          items: { type: string }
        basis: { $ref: '#/components/schemas/Basis' }
        note: { type: string }
    Indicator:
      type: object
      required:
        [
          code,
          name,
          unit,
          value_type,
          components,
          derived_fields,
          hazards,
          body_zone,
          input_methods,
          sensitivity,
          rules_version,
          guide,
          sources,
        ]
      properties:
        code: { type: string }
        name: { type: string }
        unit: { type: string }
        value_type: { type: string, enum: [simple, composite, boolean, scale, catalog] }
        components:
          type: array
          items: { $ref: '#/components/schemas/Component' }
        derived_fields:
          type: array
          items: { $ref: '#/components/schemas/DerivedField' }
        hazards:
          type: array
          items: { $ref: '#/components/schemas/Hazard' }
        body_zone: { type: string }
        input_methods:
          type: array
          items: { $ref: '#/components/schemas/InputMethod' }
        sensitivity: { type: string, enum: [standard, confidential] }
        rules_version: { type: integer, minimum: 1 }
        direction:
          {
            type: string,
            enum: [high, low],
            description: Dirección "mejor" en escalas de bienestar.,
          }
        guide: { $ref: '#/components/schemas/Guide' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        notes:
          type: array
          items: { type: string }
    IndicatorDetail:
      allOf:
        - $ref: '#/components/schemas/Indicator'
        - type: object
          required: [rules]
          properties:
            rules:
              type: array
              description: 'Ordenadas; gana la primera que se cumple. La última es `{ all: [] }`.'
              items: { $ref: '#/components/schemas/Rule' }
    IndicatorList:
      type: object
      required: [catalog_version, rules_version, items]
      properties:
        catalog_version: { type: integer }
        rules_version: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/Indicator' }
    IndicatorRules:
      type: object
      required: [code, rules_version, rules]
      properties:
        code: { type: string }
        rules_version: { type: integer }
        rules:
          type: array
          items: { $ref: '#/components/schemas/Rule' }
    RulesBundle:
      type: object
      required: [catalog_version, rules_version, up_to_date, indicators]
      properties:
        catalog_version: { type: integer }
        rules_version: { type: integer, description: Versión más alta publicada. }
        up_to_date: { type: boolean }
        indicators:
          type: array
          items: { $ref: '#/components/schemas/IndicatorRules' }
    BodyZone:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    BodyZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BodyZone' }
    Symptom:
      type: object
      required: [code, label, body_zone, red_flag]
      properties:
        code: { type: string }
        label: { type: string }
        body_zone: { type: string }
        red_flag: { type: boolean, description: Señal de alarma. }
    SymptomList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Symptom' }
    IndicatorEvaluation:
      type: object
      description: |
        Resultado de `evaluateIndicator`. Si ninguna regla aplica solo trae `code`,
        `level: unrated`, `rule_index: -1` y `escalation: self_care` (el catálogo v1 siempre
        tiene regla por defecto, así que en la práctica llegan todos los campos).
      required: [code, level, rule_index, escalation]
      properties:
        code: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        recommendation:
          { type: string, description: Texto para el astronauta; nunca nombra una enfermedad. }
        escalation: { $ref: '#/components/schemas/EscalationLevel' }
        rule_index: { type: integer, minimum: -1 }
        rules_version: { type: integer }
        basis: { $ref: '#/components/schemas/Basis' }
        source_ids:
          type: array
          items: { type: string }

    # ---------------------------------------------------------------- lecturas
    ReadingValues:
      type: object
      description: 'Componentes del indicador por nombre (ver `components` del catálogo). Para un indicador simple, `{ "value": n }`.'
      additionalProperties: true
    ReadingCreate:
      type: object
      required: [client_uuid, indicator_code, measured_at, values, input_method]
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        supersedes_uuid:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: client_uuid de la lectura que esta corrige.,
          }
        indicator_code: { type: string }
        measured_at: { $ref: '#/components/schemas/Timestamp' }
        values: { $ref: '#/components/schemas/ReadingValues' }
        input_method: { $ref: '#/components/schemas/InputMethod' }
        device_id: { type: string, nullable: true }
        attachment_id: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true, maxLength: 500 }
    Reading:
      type: object
      required:
        [
          id,
          client_uuid,
          astronaut_id,
          indicator_code,
          values,
          input_method,
          measured_at,
          received_at,
          synthetic,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        supersedes_uuid: { type: string, format: uuid, nullable: true }
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        indicator_code: { type: string }
        values: { $ref: '#/components/schemas/ReadingValues' }
        input_method: { $ref: '#/components/schemas/InputMethod' }
        device_id: { type: string, nullable: true }
        attachment_id: { type: string, format: uuid, nullable: true }
        measured_at: { $ref: '#/components/schemas/Timestamp' }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        superseded_by: { type: string, format: uuid, nullable: true }
        synthetic: { type: boolean }
    ReadingCreated:
      type: object
      required: [reading, evaluation, escalation_id]
      properties:
        reading: { $ref: '#/components/schemas/Reading' }
        evaluation: { $ref: '#/components/schemas/IndicatorEvaluation' }
        escalation_id:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: Escalamiento creado (crew o flight_surgeon); null si no escaló.,
          }
        emergency:
          type: object
          description: |
            Solo si la lectura quedó crítica y abrió (o se unió a) una emergencia (indicadores del
            protocolo, medida hace menos de TRIAGE_AUTO_READING_MAX_AGE_MIN). Muestra "¿Estás
            bien?" hasta deadline_at (POST /emergency/sessions/{id}/confirm).
          properties:
            session_id: { $ref: '#/components/schemas/Uuid' }
            status: { $ref: '#/components/schemas/EmergencyStatus' }
            trigger_type: { $ref: '#/components/schemas/TriggerType' }
            deadline_at: { type: string, format: date-time, nullable: true }
    ReadingPoint:
      type: object
      required: [id, indicator_code, values, level, measured_at, received_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        indicator_code: { type: string }
        values: { $ref: '#/components/schemas/ReadingValues' }
        level: { $ref: '#/components/schemas/Level' }
        measured_at: { $ref: '#/components/schemas/Timestamp' }
        received_at: { $ref: '#/components/schemas/Timestamp' }
    ReadingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReadingPoint' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    LastValue:
      type: object
      required: [reading_id, values, measured_at]
      properties:
        reading_id: { $ref: '#/components/schemas/Uuid' }
        values: { $ref: '#/components/schemas/ReadingValues' }
        measured_at: { $ref: '#/components/schemas/Timestamp' }
    IndicatorStatus:
      type: object
      required: [code, name, level, escalation]
      properties:
        code: { type: string }
        name: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        escalation: { $ref: '#/components/schemas/EscalationLevel' }
        recommendation: { type: string, nullable: true }
        last_value: { $ref: '#/components/schemas/LastValue' }
    ZoneStatus:
      type: object
      required: [zone, name, worst_level, indicators]
      properties:
        zone: { type: string }
        name: { type: string }
        worst_level: { $ref: '#/components/schemas/Level' }
        indicators:
          type: array
          items: { $ref: '#/components/schemas/IndicatorStatus' }
        checkin_completed:
          type: boolean
          description: 'Solo en brain: ¿completó hoy (día UTC) el check-in de bienestar? Sí/no, nunca el resultado.'
    BodyStatus:
      type: object
      required: [astronaut_id, generated_at, rules_version, zones]
      properties:
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        rules_version: { type: integer }
        zones:
          type: array
          items: { $ref: '#/components/schemas/ZoneStatus' }
        environment: { $ref: '#/components/schemas/HabitatModuleStatus' }
    AttachmentUpload:
      type: object
      required: [file, client_uuid, kind]
      properties:
        file: { type: string, format: binary }
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [measurement_photo] }
        indicator_code: { type: string }
    Attachment:
      type: object
      required: [attachment_id, client_uuid, kind, content_type, size_bytes, sha256, created_at]
      properties:
        attachment_id: { $ref: '#/components/schemas/Uuid' }
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [measurement_photo] }
        indicator_code: { type: string, nullable: true }
        content_type: { type: string, enum: [image/jpeg, image/png] }
        size_bytes: { type: integer, maximum: 5242880 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------------------------------------------------------------- hábitat
    HabitatReadingCreate:
      type: object
      required: [client_uuid, indicator_code, module_id, measured_at, value, source]
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        indicator_code: { type: string, enum: [HAB_CO2, HAB_TEMP, HAB_HUMIDITY, HAB_NOISE] }
        module_id: { type: string }
        measured_at: { $ref: '#/components/schemas/Timestamp' }
        value: { type: number }
        period: { type: string, enum: [work, sleep], description: Obligatorio para HAB_NOISE. }
        source: { type: string, enum: [sensor, simulator, manual] }
    HabitatReadingBatch:
      type: object
      required: [readings]
      properties:
        readings:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/HabitatReadingCreate' }
    HabitatReadingResult:
      type: object
      required: [client_uuid, status]
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [accepted, duplicate, rejected] }
        reading_id: { type: string, format: uuid, nullable: true }
        escalation_id: { type: string, format: uuid, nullable: true }
        evaluation: { $ref: '#/components/schemas/IndicatorEvaluation' }
        error: { $ref: '#/components/schemas/ErrorBody' }
    HabitatBatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/HabitatReadingResult' }
    HabitatIndicatorStatus:
      type: object
      required: [code, level, value, measured_at, escalation]
      properties:
        code: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        value: { type: number }
        avg_7d: { type: number, nullable: true }
        measured_at: { $ref: '#/components/schemas/Timestamp' }
        escalation: { $ref: '#/components/schemas/EscalationLevel' }
        recommendation: { type: string }
    HabitatStatus:
      type: object
      required: [mission_id, generated_at, modules]
      properties:
        mission_id: { $ref: '#/components/schemas/Uuid' }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        modules:
          type: array
          items: { $ref: '#/components/schemas/HabitatModuleStatus' }
    HabitatModuleStatus:
      type: object
      required: [module_id, worst_level, indicators]
      properties:
        module_id: { type: string }
        worst_level: { $ref: '#/components/schemas/Level' }
        indicators:
          type: array
          items: { $ref: '#/components/schemas/HabitatIndicatorStatus' }

    # ---------------------------------------------------------------- extras de la app
    Routine:
      type: object
      required: [code, title, indicator_codes, schedule, next_due_at, done_today]
      properties:
        code: { type: string }
        title: { type: string }
        indicator_codes:
          type: array
          items: { type: string }
        schedule: { type: string, description: Texto legible del horario. }
        next_due_at: { $ref: '#/components/schemas/Timestamp' }
        done_today: { type: boolean }
    RoutineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Routine' }
    Gamification:
      type: object
      required: [streak_days, checkins_this_week, checkins_goal_week, badges]
      properties:
        streak_days: { type: integer, minimum: 0 }
        checkins_this_week: { type: integer, minimum: 0 }
        checkins_goal_week: { type: integer, minimum: 1 }
        badges:
          type: array
          items:
            type: object
            required: [code, title, earned_at]
            properties:
              code: { type: string }
              title: { type: string }
              earned_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------------------------------------------------------------- sync
    SyncItem:
      type: object
      required: [client_uuid, entity, priority, created_at, payload]
      properties:
        client_uuid:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: El mismo en cada reintento (es la clave de idempotencia).
        entity:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
          description: |
            Tipo de registro. Con servicio: `reading`, `habitat_reading`, `wellbeing_checkin`,
            `pvt_run`, `wellbeing_screening` y los de emergencia (prioridad emergency aunque el
            item diga normal; se procesan en este orden): `emergency_session` (=
            EmergencySessionCreate), `emergency_confirm` ({ session_id, confirmed_at }),
            `emergency_assessment` (AssessmentCreate + `session_id`), `emergency_answer`
            (AnswerInput + `assessment_id`), `emergency_complete` (CompleteRequest +
            `assessment_id`), `emergency_heartbeat` ({ session_id, sent_at }),
            `emergency_question` ({ session_id, body, asked_at }) y `emergency_close`
            (CloseRequest + `session_id`). `session_id` / `assessment_id` aceptan el id del
            servidor o el `client_uuid` (sin conexión la app solo conoce los suyos). Una sesión
            creada sin conexión cuando ya había otra abierta se une a ella (`result.joined`,
            `merged_into`) y sus evaluaciones quedan en la principal. `support_request`
            (= SupportRequestCreate sin `client_uuid`, tarea 10). Un segundo `wellbeing_checkin`
            del mismo día corrige al anterior (`result.supersedes_id`). Cualquier otro:
            `rejected` `UNKNOWN_ENTITY` (no tumba el lote).
          example: reading
        priority:
          type: string
          enum: [emergency, normal]
          description: emergency se procesa antes que todo (triaje, tarea 9).
        created_at: { $ref: '#/components/schemas/Timestamp' }
        supersedes_uuid:
          type: string
          format: uuid
          description: Opcional; igual que `payload.supersedes_uuid` (gana el del payload).
        payload:
          type: object
          description: Mismo body que el endpoint en línea equivalente, sin client_uuid (va en el item).
          additionalProperties: true
    SyncPushRequest:
      type: object
      required: [device_id, sent_at, items]
      properties:
        device_id: { type: string }
        sent_at: { $ref: '#/components/schemas/Timestamp' }
        items:
          type: array
          minItems: 1
          maxItems: 500
          description: Máximo SYNC_MAX_BATCH (500 por defecto); más → 413.
          items: { $ref: '#/components/schemas/SyncItem' }
    SyncItemResult:
      type: object
      required: [client_uuid, entity, status]
      properties:
        client_uuid:
          type: string
          format: uuid
          nullable: true
          description: null si el item no traía un UUID válido.
        entity: { type: string, nullable: true }
        status: { type: string, enum: [accepted, duplicate, conflict, rejected] }
        server_id: { type: string, format: uuid, nullable: true }
        sequence:
          type: integer
          minimum: 1
          description: Orden en que se procesó; no viene si se rechazó antes de procesarlo.
        result:
          type: object
          description: |
            Lo mismo que devolvería el endpoint en línea (p. ej. `evaluation` y `escalation_id`
            de una lectura; de bienestar, solo `message` neutro, `offer_support`, en el check-in
            `supersedes_id`, `streak` y `screening_due`, en `pvt_run` `fitness`, y en
            `support_request` `status`, `urgency`, `channel`, `deliver_at` y `suggestions`), más
            `late_sync` (boolean) y `lag_s` (segundos entre la medición y la recepción).
          additionalProperties: true
        error: { $ref: '#/components/schemas/ErrorBody' }
    SyncPushResponse:
      type: object
      required: [server_time, batch_id, clock_offset_s, counts, results]
      properties:
        server_time: { $ref: '#/components/schemas/Timestamp' }
        batch_id: { $ref: '#/components/schemas/Uuid' }
        clock_offset_s:
          type: integer
          description: Recepción − `sent_at`, en segundos. Solo se registra; measured_at no se corrige.
        counts:
          type: object
          required: [accepted, duplicate, conflict, rejected]
          properties:
            accepted: { type: integer }
            duplicate: { type: integer }
            conflict: { type: integer }
            rejected: { type: integer }
        results:
          type: array
          description: En el orden de `items`.
          items: { $ref: '#/components/schemas/SyncItemResult' }
    DeliveredMessage:
      type: object
      required: [id, channel, thread_id, direction, author_role, body, created_at, deliver_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        channel: { type: string, enum: [escalation, support] }
        thread_id: { $ref: '#/components/schemas/Uuid' }
        direction: { $ref: '#/components/schemas/MessageDirection' }
        author_role: { type: string, enum: [flight_surgeon, behavioral_health, admin] }
        body: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        deliver_at: { $ref: '#/components/schemas/Timestamp' }
    Reminder:
      type: object
      required: [id, kind, title, due_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [checkin, pvt, reading, routine] }
        title: { type: string }
        due_at: { $ref: '#/components/schemas/Timestamp' }
        indicator_code: { type: string, nullable: true }
    SyncEvaluation:
      type: object
      required: [reading_id, client_uuid, indicator_code, measured_at, received_at, evaluation]
      properties:
        reading_id: { $ref: '#/components/schemas/Uuid' }
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        supersedes_uuid:
          type: string
          format: uuid
          nullable: true
          description: Si no es null, esta lectura corrige a la que tiene ese client_uuid.
        indicator_code: { type: string }
        measured_at: { $ref: '#/components/schemas/Timestamp' }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        evaluation: { $ref: '#/components/schemas/IndicatorEvaluation' }
        escalation_id: { type: string, format: uuid, nullable: true }
        late_sync: { type: boolean }
        lag_s: { type: integer }
    SyncEscalation:
      type: object
      required: [id, level, priority, status, reason, created_at, deliver_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        source_type: { type: string }
        source_id: { type: string, format: uuid, nullable: true }
        level: { $ref: '#/components/schemas/EscalationLevel' }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/EscalationStatus' }
        reason: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        deliver_at: { $ref: '#/components/schemas/Timestamp' }
    SyncRoutine:
      type: object
      required: [code, title, indicator_codes, schedule]
      properties:
        code: { type: string }
        title: { type: string }
        indicator_codes:
          type: array
          items: { type: string }
        schedule: { type: string }
    SyncPullResponse:
      type: object
      required:
        [
          cursor,
          has_more,
          server_time,
          rules,
          protocol,
          catalog,
          mission,
          evaluations,
          escalations,
          messages,
          reminders,
          routines,
        ]
      properties:
        cursor: { type: string, description: Guárdalo para la próxima llamada. }
        has_more: { type: boolean }
        server_time: { $ref: '#/components/schemas/Timestamp' }
        rules:
          type: object
          required: [rules_version, changed]
          properties:
            rules_version: { type: integer }
            changed: { type: boolean }
        protocol:
          type: object
          required: [code, version, changed]
          properties:
            code: { type: string }
            version: { type: integer }
            changed: { type: boolean }
        catalog:
          type: object
          required: [catalog_version, changed]
          properties:
            catalog_version: { type: integer }
            changed: { type: boolean }
        mission:
          type: object
          nullable: true
          required: [id, code, status, comm_delay_seconds, link, version, changed]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            code: { type: string }
            status: { type: string }
            ends_at: { type: string, format: date-time, nullable: true }
            comm_delay_seconds: { type: integer }
            link:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [up, outage] }
                outage_ends_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Fin previsto del corte; null = sin fin conocido.
            version:
              type: string
              description: Cambia si cambia la misión o su entorno (p. ej. el retraso).
            changed: { type: boolean }
        evaluations:
          type: array
          items: { $ref: '#/components/schemas/SyncEvaluation' }
        escalations:
          type: array
          items: { $ref: '#/components/schemas/SyncEscalation' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/DeliveredMessage' }
        reminders:
          type: array
          items: { $ref: '#/components/schemas/Reminder' }
        routines:
          type: array
          items: { $ref: '#/components/schemas/SyncRoutine' }

    # ---------------------------------------------------------------- emergencia
    ProtocolSource:
      type: object
      required: [id, title, url]
      properties:
        id: { type: string }
        title: { type: string }
        publisher: { type: string }
        url: { type: string, format: uri }
    TriageProtocol:
      type: object
      required: [id, code, version, name, is_active, sources, definition]
      properties:
        id: { type: integer }
        code: { type: string }
        version: { type: integer }
        name: { type: string }
        is_active: { type: boolean }
        sources:
          type: array
          items: { $ref: '#/components/schemas/ProtocolSource' }
        definition:
          type: object
          description: Preguntas, ramas y reglas tal como están en `triage_protocols.definition` (se evalúa con `evaluateAssessment`).
          additionalProperties: true
    ValueAnswer:
      type: object
      description: Respuesta sí/no o numérica.
      required: [value]
      properties:
        value:
          oneOf:
            - type: boolean
            - type: number
    ChoiceAnswer:
      type: object
      description: Respuesta de opción (un código) o de opción múltiple (lista de códigos).
      required: [choice]
      properties:
        choice:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
    TriageAnswer:
      oneOf:
        - $ref: '#/components/schemas/ValueAnswer'
        - $ref: '#/components/schemas/ChoiceAnswer'
    EmergencyContext:
      type: object
      properties:
        solar_event_active: { type: boolean }
        environment_alarm:
          { type: string, nullable: true, description: 'p. ej. co2, pressure o fire.' }
      additionalProperties: true
    EmergencySessionCreate:
      type: object
      required: [client_uuid, trigger_type, started_at]
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        trigger_type: { $ref: '#/components/schemas/TriggerType' }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        context: { $ref: '#/components/schemas/EmergencyContext' }
        responder_safe: { $ref: '#/components/schemas/ValueAnswer' }
    EmergencySession:
      type: object
      required:
        [
          id,
          client_uuid,
          mission_id,
          protocol,
          trigger_type,
          status,
          context,
          responder_safe,
          next_step,
          started_at,
          received_at,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        mission_id: { $ref: '#/components/schemas/Uuid' }
        protocol:
          type: object
          required: [id, code, version]
          properties:
            id: { type: integer }
            code: { type: string }
            version: { type: integer }
        trigger_type: { $ref: '#/components/schemas/TriggerType' }
        started_by:
          { type: string, format: uuid, nullable: true, description: null si la activó el sistema. }
        status: { $ref: '#/components/schemas/EmergencyStatus' }
        context: { $ref: '#/components/schemas/EmergencyContext' }
        responder_safe:
          type: boolean
          nullable: true
          description: null en una activación automática hasta que lo conteste un evaluador.
        next_step: { type: string, enum: [start_assessments, secure_self] }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        activated_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        mission_code: { type: string }
        merged_into:
          type: string
          format: uuid
          nullable: true
          description: Si esta activación se unió a otra sesión.
        deadman:
          type: array
          description: Plazos de "estoy bien" de los afectados (activación automática).
          items: { $ref: '#/components/schemas/DeadmanEntry' }
        heartbeat:
          type: object
          properties:
            dead_man_switch_seconds: { type: integer }
            last_heartbeat_at: { type: string, format: date-time, nullable: true }
            expires_at: { type: string, format: date-time, nullable: true }
            lapsed_at: { type: string, format: date-time, nullable: true }
        joined_activations:
          type: integer
          description: Cuántas activaciones se unieron a esta sesión.
        synthetic: { type: boolean }
    DeadmanEntry:
      type: object
      required: [astronaut_id, call_sign, status]
      properties:
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        call_sign: { type: string }
        trigger_type: { $ref: '#/components/schemas/TriggerType' }
        deadline_at: { $ref: '#/components/schemas/Timestamp' }
        confirmed_at: { type: string, format: date-time, nullable: true }
        expired_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [waiting, confirmed, expired] }
    AttentionEntry:
      type: object
      required: [position, astronaut_id, call_sign, status, reason]
      properties:
        position: { type: integer, minimum: 1 }
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        call_sign: { type: string }
        status: { type: string, enum: [assessed, in_progress, unassessed] }
        assessment_id: { type: string, format: uuid, nullable: true }
        triage_category: { type: string, nullable: true, enum: [green, yellow, red, black, null] }
        radiation_flag: { type: string, nullable: true, enum: [none, possible, probable, null] }
        matches_device: { type: boolean, nullable: true }
        reason:
          type: string
          description: Motivo del lugar, p. ej. "Rojo (inmediato), radiación probable (vómito)".
    EmergencyQuestionCreate:
      type: object
      required: [client_uuid, body]
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        body: { type: string, minLength: 1, maxLength: 4000 }
        asked_at: { $ref: '#/components/schemas/Timestamp' }
    EmergencyQuestion:
      type: object
      required: [id, session_id, escalation_id, direction, body, created_at, deliver_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        session_id: { $ref: '#/components/schemas/Uuid' }
        escalation_id:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Hilo con Tierra (para responder, POST /admin/escalations/{id}/messages).
        direction: { $ref: '#/components/schemas/MessageDirection' }
        body: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        deliver_at:
          type: string
          format: date-time
          nullable: true
          description: null = en cola esperando enlace.
    PrefillValue:
      type: object
      required: [value]
      properties:
        value: { description: Valor sugerido para la pregunta. }
        source_reading_id: { type: string, format: uuid, nullable: true }
        measured_at: { $ref: '#/components/schemas/Timestamp' }
    RosterEntry:
      type: object
      required: [astronaut_id, call_sign, sequence_no, prefill]
      properties:
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        call_sign: { type: string }
        crew_role: { $ref: '#/components/schemas/CrewRole' }
        sequence_no: { type: integer, minimum: 1 }
        priority_reason: { type: string, nullable: true }
        prefill:
          type: object
          description: Respuestas sugeridas por pregunta a partir de lecturas recientes.
          additionalProperties: { $ref: '#/components/schemas/PrefillValue' }
    SessionWithRoster:
      type: object
      required: [session, roster]
      properties:
        session: { $ref: '#/components/schemas/EmergencySession' }
        roster:
          type: array
          items: { $ref: '#/components/schemas/RosterEntry' }
        assessments:
          type: array
          items: { $ref: '#/components/schemas/Assessment' }
        attention_order:
          type: array
          description: A quién atender primero (no viene para admin).
          items: { $ref: '#/components/schemas/AttentionEntry' }
        joined:
          type: boolean
          description: Solo al crear. true = había una sesión abierta y esta activación se unió.
    AssessmentCreate:
      type: object
      required: [client_uuid, astronaut_id, started_at]
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        sequence_no:
          type: integer
          minimum: 1
          description: Orden en que la tableta las inicia (el de atención lo calcula el servidor).
        is_self_assessment: { type: boolean }
        started_at: { $ref: '#/components/schemas/Timestamp' }
    Assessment:
      type: object
      required:
        [
          id,
          client_uuid,
          session_id,
          astronaut_id,
          sequence_no,
          is_self_assessment,
          status,
          started_at,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        session_id: { $ref: '#/components/schemas/Uuid' }
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        call_sign: { type: string }
        assessed_by: { type: string, format: uuid, nullable: true }
        is_self_assessment: { type: boolean }
        sequence_no: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/AssessmentStatus' }
        triage_category: { type: string, nullable: true, enum: [green, yellow, red, black, null] }
        radiation_flag: { type: string, nullable: true, enum: [none, possible, probable, null] }
        computed_by: { type: string, nullable: true, enum: [device, server, null] }
        rules_version: { type: integer, nullable: true }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        completed_at: { type: string, format: date-time, nullable: true }
        reassessment_of:
          type: string
          format: uuid
          nullable: true
          description: Evaluación anterior del mismo tripulante en la sesión (reevaluación).
        matches_device: { type: boolean, nullable: true }
        device_result:
          type: object
          nullable: true
          description: Lo que calculó la tableta (se guarda aunque difiera).
          additionalProperties: true
    AnswerInput:
      type: object
      required: [client_uuid, question_code, answer, source, answered_at]
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        question_code: { type: string }
        answer: { $ref: '#/components/schemas/TriageAnswer' }
        source: { $ref: '#/components/schemas/AnswerSource' }
        source_reading_id:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: 'Lectura usada para prellenar (pendiente de la tabla de lecturas, migración 004).',
          }
        answered_at: { $ref: '#/components/schemas/Timestamp' }
    AnswersPut:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/AnswerInput' }
    AnswersPutResult:
      type: object
      required: [accepted, duplicates, preview]
      properties:
        accepted: { type: integer, minimum: 0 }
        duplicates: { type: integer, minimum: 0 }
        preview: { $ref: '#/components/schemas/AssessmentResult' }
    CompleteRequest:
      type: object
      required: [completed_at]
      properties:
        completed_at: { $ref: '#/components/schemas/Timestamp' }
        device_result:
          type: object
          description: Lo que calculó la tableta sin conexión; se compara en matches_device.
          properties:
            status: { type: string, enum: [completed, incomplete, stopped] }
            triage_category: { $ref: '#/components/schemas/TriageCategory' }
            radiation_flag: { type: string, enum: [none, possible, probable] }
            rules_version: { type: integer }
    EscalationAction:
      type: object
      required: [level, priority]
      properties:
        level: { $ref: '#/components/schemas/EscalationLevel' }
        priority: { $ref: '#/components/schemas/Priority' }
        escalation_id: { type: string, format: uuid, description: Solo al completar. }
        deliver_at:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Solo al completar; null = en cola.,
          }
    AssessmentResult:
      type: object
      description: Resultado de `evaluateAssessment` (mismos nombres) más datos del servidor.
      required: [status, escalations, path, computed_by, rules_version]
      properties:
        status: { type: string, enum: [completed, incomplete, stopped] }
        triage_category: { type: string, nullable: true, enum: [green, yellow, red, black, null] }
        radiation_flag:
          {
            type: string,
            enum: [none, possible, probable],
            description: Solo si status = completed.,
          }
        priority: { $ref: '#/components/schemas/Priority' }
        escalations:
          type: array
          description: Acciones de la regla de escalamiento que aplicó (vacío si no está completed).
          items: { $ref: '#/components/schemas/EscalationAction' }
        path:
          type: array
          description: Recorrido del protocolo (para auditoría y depuración).
          items: { type: string }
        pending: { type: string, description: Pregunta que falta (status = incomplete). }
        reason:
          {
            type: string,
            description: 'Motivo de la parada (status = stopped), p. ej. STOP_SECURE_SELF.',
          }
        computed_by: { type: string, enum: [server, device] }
        rules_version: { type: integer, description: Versión del protocolo usada. }
        matches_device:
          { type: boolean, nullable: true, description: null si no se envió device_result. }
        mismatch_fields:
          type: array
          description: Qué difiere del dispositivo (status, triage_category, radiation_flag, rules_version).
          items: { type: string }
        device_result: { type: object, additionalProperties: true }
        next:
          type: object
          allOf:
            - $ref: '#/components/schemas/RosterEntry'
          nullable: true
          description: A quién evaluar después (null si ya están todos).
        attention_order:
          type: array
          items: { $ref: '#/components/schemas/AttentionEntry' }
    HeartbeatRequest:
      type: object
      required: [sent_at]
      properties:
        sent_at: { $ref: '#/components/schemas/Timestamp' }
        device_id: { type: string }
    HeartbeatResponse:
      type: object
      required: [session_id, status, received_at, dead_man_switch_seconds, expires_at]
      properties:
        session_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/EmergencyStatus' }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        dead_man_switch_seconds: { type: integer }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    CloseRequest:
      type: object
      required: [closed_at, status]
      properties:
        closed_at: { $ref: '#/components/schemas/Timestamp' }
        status: { type: string, enum: [closed, cancelled] }
        notes: { type: string, nullable: true, maxLength: 2000 }
    EscalationRef:
      type: object
      required: [id, level, priority, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        level: { $ref: '#/components/schemas/EscalationLevel' }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/EscalationStatus' }
        deliver_at: { type: string, format: date-time, nullable: true }
    TriageCounts:
      type: object
      required: [green, yellow, red, black, unreachable, in_progress]
      properties:
        green: { type: integer, minimum: 0 }
        yellow: { type: integer, minimum: 0 }
        red: { type: integer, minimum: 0 }
        black: { type: integer, minimum: 0 }
        unreachable: { type: integer, minimum: 0 }
        in_progress: { type: integer, minimum: 0 }
    SessionSummary:
      type: object
      required: [session, counts, escalations]
      properties:
        session: { $ref: '#/components/schemas/EmergencySession' }
        counts: { $ref: '#/components/schemas/TriageCounts' }
        escalations:
          type: array
          items: { $ref: '#/components/schemas/EscalationRef' }

    # ---------------------------------------------------------------- bienestar
    Slider:
      type: integer
      minimum: 0
      maximum: 100
    CheckinCreate:
      type: object
      required: [client_uuid, measured_at, mood, fatigue, stress, crew_conflict]
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        measured_at: { $ref: '#/components/schemas/Timestamp' }
        mood: { $ref: '#/components/schemas/Slider' }
        fatigue: { $ref: '#/components/schemas/Slider' }
        stress: { $ref: '#/components/schemas/Slider' }
        crew_conflict: { $ref: '#/components/schemas/Slider' }
        sleep_hours:
          type: number
          minimum: 0
          maximum: 24
          nullable: true
          description: Horas de sueño de la pulsera (opcional).
        private_note:
          { type: string, nullable: true, maxLength: 1000, description: Solo la ve el astronauta. }
    WellbeingAck:
      type: object
      description: Respuesta neutra. Nunca trae color, nivel ni puntaje.
      required: [id, client_uuid, received_at, message, offer_support]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        message:
          type: string
          description: Mensaje neutro de la regla del catálogo (sin números ni colores).
        offer_support:
          type: boolean
          description: true = mostrar "Quiero hablar con alguien" (siempre true).
        supersedes_id:
          type: string
          format: uuid
          nullable: true
          description: Solo check-in. No null = corrigió el check-in de ese mismo día.
        streak: { $ref: '#/components/schemas/Streak' }
        screening_due:
          type: boolean
          description: |
            Solo check-in. true = toca PHQ-2/GAD-2 (cada 14 días, un día antes de la conferencia
            psicológica; regla de diseño).
    Streak:
      type: object
      description: Racha del check-in. Cuenta check-ins completados, nunca el resultado.
      required: [streak_days, checkins_this_week, checkins_goal_week]
      properties:
        streak_days:
          type: integer
          minimum: 0
          description: Días UTC seguidos con check-in que terminan hoy (o ayer si hoy falta).
        checkins_this_week:
          { type: integer, minimum: 0, description: Días con check-in en los últimos 7 días. }
        checkins_goal_week: { type: integer, minimum: 1 }
    Instrument:
      type: object
      required:
        [
          code,
          name,
          indicator_code,
          lang,
          official,
          language_version,
          prompt,
          items,
          options,
          license,
          sources,
        ]
      properties:
        code: { type: string, enum: [PHQ2, GAD2] }
        name: { type: string }
        indicator_code: { type: string }
        lang: { type: string, enum: [es, en] }
        official:
          {
            type: boolean,
            description: 'true = traducción oficial de Pfizer; false = adaptación propia.',
          }
        language_version:
          {
            type: string,
            description: 'Versión de idioma de la fuente, p. ej. Spanish for Mexico o English.',
          }
        note: { type: string, description: Aclaración cuando el texto no es oficial. }
        license: { type: string }
        prompt: { type: string }
        items:
          type: array
          items:
            type: object
            required: [code, text]
            properties:
              code: { type: string }
              text: { type: string }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: integer, minimum: 0, maximum: 3 }
              label: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
    InstrumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Instrument' }
    ScreeningCreate:
      type: object
      required: [client_uuid, instrument, measured_at, item_1, item_2]
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        instrument: { type: string, enum: [PHQ2, GAD2] }
        measured_at: { $ref: '#/components/schemas/Timestamp' }
        item_1: { type: integer, minimum: 0, maximum: 3 }
        item_2: { type: integer, minimum: 0, maximum: 3 }
    PvtRunCreate:
      type: object
      required:
        [
          client_uuid,
          device_id,
          measured_at,
          before_critical_task,
          lapses,
          mean_rt_ms,
          false_starts,
        ]
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        device_id: { type: string, description: La línea base es por dispositivo. }
        measured_at: { $ref: '#/components/schemas/Timestamp' }
        before_critical_task: { type: boolean }
        duration_s: { type: integer, minimum: 1 }
        trials: { type: integer, minimum: 1 }
        lapses: { type: integer, minimum: 0, description: Respuestas de 355 ms o más. }
        mean_rt_ms: { type: number, minimum: 0 }
        false_starts: { type: integer, minimum: 0 }
    PvtRunResult:
      type: object
      required: [id, client_uuid, received_at, fitness, message]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        fitness: { $ref: '#/components/schemas/Fitness' }
        message: { type: string }
    SupportRequestCreate:
      type: object
      required: [client_uuid, urgency, channel, content, created_at]
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        urgency: { type: string, enum: [later, today, now] }
        channel: { type: string, enum: [message, session] }
        content: { type: string, minLength: 1, maxLength: 2000 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    SupportRequest:
      type: object
      required:
        [id, client_uuid, astronaut_id, status, urgency, channel, content, created_at, received_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [open, acknowledged, closed] }
        urgency: { type: string, enum: [later, today, now] }
        channel: { type: string, enum: [message, session] }
        content: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        deliver_at:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Llegada a Tierra; null = en cola.,
          }
        suggestions:
          type: array
          description: |
            Solo al crearla. Con urgencia `now`: qué ofrecer en la app mientras llega la respuesta.
            Son sugerencias: el servidor no avisa a nadie a bordo. Vacío en `later` y `today`.
          items: { $ref: '#/components/schemas/SupportSuggestion' }
    SupportSuggestion:
      type: object
      required: [code, title, description]
      properties:
        code: { type: string, enum: [guided_breathing, talk_to_cmo] }
        title: { type: string }
        description: { type: string }
    SupportRequestAck:
      type: object
      required: [id, status, acknowledged_at, acknowledged_by]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [open, acknowledged, closed] }
        acknowledged_at: { $ref: '#/components/schemas/Timestamp' }
        acknowledged_by: { type: string, format: uuid, nullable: true }
    ClosedItem:
      type: object
      required: [id, status, closed_at, closed_by]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [closed] }
        closed_at: { $ref: '#/components/schemas/Timestamp' }
        closed_by: { type: string, format: uuid, nullable: true }
    SupportMessage:
      type: object
      required: [id, request_id, direction, author_role, body, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        request_id: { $ref: '#/components/schemas/Uuid' }
        direction: { $ref: '#/components/schemas/MessageDirection' }
        author_role: { type: string, enum: [astronaut, behavioral_health] }
        body: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        deliver_at: { type: string, format: date-time, nullable: true }
    SupportMessagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SupportMessage' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    WellbeingHistoryItem:
      type: object
      required: [id, kind, measured_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [checkin, screening, pvt_run, support_request] }
        measured_at: { $ref: '#/components/schemas/Timestamp' }
        checkin:
          type: object
          properties:
            mood: { $ref: '#/components/schemas/Slider' }
            fatigue: { $ref: '#/components/schemas/Slider' }
            stress: { $ref: '#/components/schemas/Slider' }
            crew_conflict: { $ref: '#/components/schemas/Slider' }
            sleep_hours: { type: number }
            private_note: { type: string, nullable: true }
        instrument: { type: string, enum: [PHQ2, GAD2] }
        fitness: { $ref: '#/components/schemas/Fitness' }
        support_status: { type: string, enum: [open, acknowledged, closed] }
    WellbeingHistoryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WellbeingHistoryItem' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    # ---------------------------------------------------------------- Tierra
    SeriesPoint:
      type: object
      required: [measured_at, value]
      properties:
        measured_at: { $ref: '#/components/schemas/Timestamp' }
        value: { type: number }
    DashboardIndicator:
      type: object
      required: [code, level, last_value, measured_at, trend, series]
      properties:
        code: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        last_value: { $ref: '#/components/schemas/ReadingValues' }
        measured_at: { $ref: '#/components/schemas/Timestamp' }
        trend: { type: string, enum: [rising, falling, stable, insufficient_data] }
        series:
          type: array
          description: Valor principal (p. ej. sistólica) para la gráfica.
          items: { $ref: '#/components/schemas/SeriesPoint' }
    CrewDashboard:
      type: object
      required: [mission_id, mission_code, generated_at, astronauts]
      properties:
        mission_id: { $ref: '#/components/schemas/Uuid' }
        mission_code: { type: string }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        astronauts:
          type: array
          items:
            type: object
            required:
              [astronaut_id, call_sign, crew_role, worst_level, indicators, compliance, fitness]
            properties:
              astronaut_id: { $ref: '#/components/schemas/Uuid' }
              call_sign: { type: string }
              crew_role: { $ref: '#/components/schemas/CrewRole' }
              worst_level: { $ref: '#/components/schemas/Level' }
              indicators:
                type: array
                items: { $ref: '#/components/schemas/DashboardIndicator' }
              compliance:
                type: object
                nullable: true
                description: |
                  Check-ins de bienestar hechos en 7 días (solo el conteo). Solo para `admin`;
                  para el flight surgeon es `null`.
                required: [checkins_completed_7d, checkins_expected_7d]
                properties:
                  checkins_completed_7d: { type: integer, minimum: 0, maximum: 7 }
                  checkins_expected_7d:
                    type: integer
                    minimum: 1
                    maximum: 7
                    description: Días de la asignación dentro de la ventana (hasta 7).
              fitness:
                type: string
                enum: [fit, not_confirmed]
                nullable: true
                description: |
                  Aptitud para tarea crítica: la de la PVT más reciente de las últimas
                  `WELLBEING_FITNESS_MAX_AGE_H` (12) horas; sin PVT reciente = `not_confirmed`.
                  Solo el estado, nunca las métricas de la PVT. La ven `flight_surgeon` y `admin`;
                  `null` para un rol que no pueda verla.
    InboxItem:
      type: object
      required:
        [
          id,
          mission_id,
          category,
          source_type,
          level,
          priority,
          status,
          reason,
          created_at,
          deliver_at,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mission_id: { $ref: '#/components/schemas/Uuid' }
        mission_code: { type: string }
        astronaut_id: { type: string, format: uuid, nullable: true }
        call_sign: { type: string, nullable: true }
        category: { type: string, enum: [reading, emergency, wellbeing, manual] }
        source_type:
          {
            type: string,
            enum: [reading, emergency_assessment, emergency_session, wellbeing, manual],
          }
        source_id: { type: string, format: uuid, nullable: true }
        level: { $ref: '#/components/schemas/EscalationLevel' }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/EscalationStatus' }
        reason: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        deliver_at: { $ref: '#/components/schemas/Timestamp' }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        acknowledged_by: { type: string, format: uuid, nullable: true }
        measured_at:
          type: string
          format: date-time
          description: Solo si viene de una lectura. Cuándo se midió (puede ser horas antes de created_at si llegó por sync).
        late_sync:
          type: boolean
          description: Solo si viene de una lectura. true si se registró más de 15 min después de medirse.
        lag_s: { type: integer, description: Segundos entre la medición y la recepción. }
        evaluation: { $ref: '#/components/schemas/IndicatorEvaluation' }
        triage:
          type: object
          properties:
            triage_category: { $ref: '#/components/schemas/TriageCategory' }
            radiation_flag: { type: string, enum: [none, possible, probable] }
    InboxPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InboxItem' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    EscalationAck:
      type: object
      required: [id, status, acknowledged_at, acknowledged_by]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/EscalationStatus' }
        acknowledged_at: { $ref: '#/components/schemas/Timestamp' }
        acknowledged_by: { $ref: '#/components/schemas/Uuid' }
    MessageCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
    EscalationMessage:
      type: object
      required: [id, escalation_id, direction, body, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        escalation_id: { $ref: '#/components/schemas/Uuid' }
        direction: { $ref: '#/components/schemas/MessageDirection' }
        author_id: { type: string, format: uuid, nullable: true }
        author_role: { type: string, enum: [astronaut, flight_surgeon, admin] }
        body: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        deliver_at:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: null = en cola esperando enlace.,
          }
    EscalationMessagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EscalationMessage' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    EmergencyListItem:
      type: object
      required:
        [id, mission_id, trigger_type, status, started_at, received_at, first_delivered_at, counts]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mission_id: { $ref: '#/components/schemas/Uuid' }
        mission_code: { type: string }
        trigger_type: { $ref: '#/components/schemas/TriggerType' }
        status: { $ref: '#/components/schemas/EmergencyStatus' }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        closed_at: { type: string, format: date-time, nullable: true }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        first_delivered_at: { $ref: '#/components/schemas/Timestamp' }
        counts:
          type: object
          allOf:
            - $ref: '#/components/schemas/TriageCounts'
          nullable: true
          description: null para admin (solo estado operativo).
    EmergencyListPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EmergencyListItem' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    StoredAnswer:
      type: object
      required: [question_code, answer, source, answered_at]
      properties:
        question_code: { type: string }
        answer: { $ref: '#/components/schemas/TriageAnswer' }
        source: { $ref: '#/components/schemas/AnswerSource' }
        answered_at: { $ref: '#/components/schemas/Timestamp' }
        received_at: { $ref: '#/components/schemas/Timestamp' }
    EmergencyDetail:
      type: object
      required: [session, assessments, escalations, timeline, report]
      properties:
        session: { $ref: '#/components/schemas/EmergencySession' }
        assessments:
          type: array
          description: Lo que ya llegó. Para admin, sin categorías ni respuestas.
          items:
            allOf:
              - $ref: '#/components/schemas/Assessment'
              - type: object
                properties:
                  answers:
                    type: array
                    items: { $ref: '#/components/schemas/StoredAnswer' }
        escalations:
          type: array
          items: { $ref: '#/components/schemas/EscalationRef' }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/EmergencyEvent' }
        attention_order:
          type: array
          description: Solo flight_surgeon.
          items: { $ref: '#/components/schemas/AttentionEntry' }
        questions:
          type: array
          description: Solo flight_surgeon. Preguntas de la tripulación y respuestas, ya entregadas.
          items: { $ref: '#/components/schemas/EmergencyQuestion' }
        report:
          type: object
          nullable: true
          description: |
            Solo flight_surgeon, cuando llega el cierre: protocol, session, counts,
            attention_order, assessments (con answers y server_result), differences
            (dispositivo vs servidor), timeline, messages y joined_activations. Sin bienestar.
            Ejemplo: docs/examples/emergency-session.json.
          additionalProperties: true
    EmergencyEvent:
      type: object
      required: [id, event_type, at]
      properties:
        id: { type: integer }
        event_type:
          type: string
          enum:
            [
              opened,
              joined,
              merged,
              deadman_started,
              deadman_confirmed,
              deadman_expired,
              activated,
              cancelled,
              assessment_started,
              assessment_completed,
              device_mismatch,
              heartbeat_lost,
              question_to_earth,
              closed,
            ]
        at: { $ref: '#/components/schemas/Timestamp' }
        device_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        astronaut_id: { type: string, format: uuid, nullable: true }
        call_sign: { type: string, nullable: true }
        actor_role: { type: string, nullable: true }
        assessment_id: { type: string, format: uuid, nullable: true }
        details:
          type: object
          description: No viene para admin en los eventos clínicos.
          additionalProperties: true
    Compliance:
      type: object
      required: [mission_id, from, to, astronauts]
      properties:
        mission_id: { $ref: '#/components/schemas/Uuid' }
        from: { $ref: '#/components/schemas/Timestamp' }
        to: { $ref: '#/components/schemas/Timestamp' }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        astronauts:
          type: array
          items:
            type: object
            required: [astronaut_id, call_sign, checkins_completed, checkins_expected, fitness]
            properties:
              astronaut_id: { $ref: '#/components/schemas/Uuid' }
              call_sign: { type: string }
              checkin_today: { type: boolean, description: Hizo el check-in hoy (día UTC). }
              streak_days: { type: integer, minimum: 0, description: Racha (días seguidos). }
              checkins_completed: { type: integer, minimum: 0 }
              checkins_expected: { type: integer, minimum: 0 }
              screenings_completed: { type: integer, minimum: 0 }
              pvt_runs: { type: integer, minimum: 0 }
              fitness:
                allOf:
                  - $ref: '#/components/schemas/Fitness'
                description: Apto para tarea crítica (PVT de las últimas 12 h; si no, not_confirmed).
              last_checkin_at: { type: string, format: date-time, nullable: true }
    RulesUpdate:
      type: object
      required: [expected_rules_version, change_reason, rules]
      properties:
        expected_rules_version: { type: integer, minimum: 1 }
        change_reason: { type: string, minLength: 10, maxLength: 500 }
        rules:
          type: array
          minItems: 1
          description: 'La última regla debe ser `{ all: [] }` (por defecto).'
          items: { $ref: '#/components/schemas/Rule' }
    RulesUpdated:
      type: object
      required: [code, rules_version, updated_at, updated_by, audit_id]
      properties:
        code: { type: string }
        rules_version: { type: integer }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        updated_by: { $ref: '#/components/schemas/Uuid' }
        audit_id: { $ref: '#/components/schemas/Uuid' }

    # ---------------------------------------------------------------- salud conductual
    BehavioralInboxItem:
      type: object
      required: [id, astronaut_id, call_sign, kind, status, summary, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        call_sign: { type: string }
        kind: { type: string, enum: [wellbeing_alert, screening_alert, support_request] }
        indicator_code: { type: string, nullable: true }
        urgency: { type: string, nullable: true, enum: [later, today, now, null] }
        channel: { type: string, nullable: true, enum: [message, session, null] }
        priority:
          type: string
          nullable: true
          enum: [routine, urgent, emergency, null]
          description: Solo alertas.
        status:
          type: string
          description: |
            Alertas: delivered | acknowledged | responded | closed. Solicitudes: open |
            acknowledged | closed.
        summary: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        measured_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se midió (alertas) o se pidió en el dispositivo (solicitudes).
        deliver_at: { type: string, format: date-time, nullable: true }
    BehavioralInboxPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BehavioralInboxItem' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    BehavioralAstronautDetail:
      type: object
      required:
        [
          astronaut,
          generated_at,
          baseline_ready,
          indicators,
          screenings,
          pvt_runs,
          support_requests,
        ]
      properties:
        astronaut:
          type: object
          required: [id, call_sign]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            call_sign: { type: string }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        baseline_ready: { type: boolean }
        indicators:
          type: array
          items:
            type: object
            required: [code, level, escalation, series]
            properties:
              code: { type: string }
              level: { $ref: '#/components/schemas/Level' }
              escalation: { $ref: '#/components/schemas/EscalationLevel' }
              last_value: { type: number, nullable: true }
              adverse_z_3d: { type: number, nullable: true }
              adverse_sustained_days: { type: integer, minimum: 0 }
              trend: { type: string, enum: [rising, falling, stable, insufficient_data] }
              series:
                type: array
                items: { $ref: '#/components/schemas/SeriesPoint' }
        checkins:
          type: array
          description: Check-ins vigentes de los últimos 30 días (hasta 14). Sin la nota privada.
          items:
            type: object
            required: [id, measured_at, mood, fatigue, stress, crew_conflict]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              measured_at: { $ref: '#/components/schemas/Timestamp' }
              received_at: { $ref: '#/components/schemas/Timestamp' }
              mood: { type: number, nullable: true }
              fatigue: { type: number, nullable: true }
              stress: { type: number, nullable: true }
              crew_conflict: { type: number, nullable: true }
              sleep_hours: { type: number, nullable: true }
              supersedes_id: { type: string, format: uuid, nullable: true }
        escalations:
          type: array
          description: Escalamientos conductuales abiertos y ya entregados (para el acuse y el cierre).
          items:
            type: object
            required: [id, status, created_at, deliver_at]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              indicator_code: { type: string, nullable: true }
              status: { type: string }
              priority: { type: string }
              created_at: { $ref: '#/components/schemas/Timestamp' }
              deliver_at: { $ref: '#/components/schemas/Timestamp' }
              measured_at: { type: string, format: date-time, nullable: true }
        screenings:
          type: array
          items:
            type: object
            required: [id, instrument, score, item_1, item_2, level, measured_at]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              instrument: { type: string, enum: [PHQ2, GAD2] }
              score: { type: integer, minimum: 0, maximum: 6 }
              item_1: { type: integer, minimum: 0, maximum: 3 }
              item_2: { type: integer, minimum: 0, maximum: 3 }
              level: { $ref: '#/components/schemas/Level' }
              measured_at: { $ref: '#/components/schemas/Timestamp' }
        pvt_runs:
          type: array
          items:
            type: object
            required:
              [id, measured_at, lapses, mean_rt_ms, false_starts, before_critical_task, fitness]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              measured_at: { $ref: '#/components/schemas/Timestamp' }
              lapses: { type: integer, minimum: 0 }
              mean_rt_ms: { type: number, minimum: 0 }
              false_starts: { type: integer, minimum: 0 }
              before_critical_task: { type: boolean }
              fitness: { $ref: '#/components/schemas/Fitness' }
        support_requests:
          type: array
          items: { $ref: '#/components/schemas/SupportRequest' }

    # ---------------------------------------------------------------- auditoría
    DelegatedAction:
      type: object
      required:
        [
          id,
          mission_id,
          actor_user_id,
          crew_role,
          action,
          target_type,
          target_id,
          performed_at,
          received_at,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mission_id: { $ref: '#/components/schemas/Uuid' }
        actor_user_id: { $ref: '#/components/schemas/Uuid' }
        actor_call_sign: { type: string }
        crew_role: { $ref: '#/components/schemas/CrewRole' }
        action: { type: string, enum: [unlock_user, reset_offline_pin, register_device] }
        target_type: { type: string, enum: [user, device] }
        target_id: { $ref: '#/components/schemas/Uuid' }
        performed_at: { $ref: '#/components/schemas/Timestamp' }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        deliver_at: { type: string, format: date-time, nullable: true }
    DelegatedActionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DelegatedAction' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    ConfidentialAccess:
      type: object
      required: [id, actor_user_id, actor_role, astronaut_id, resource, accessed_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        actor_user_id: { $ref: '#/components/schemas/Uuid' }
        actor_username: { type: string }
        actor_role: { $ref: '#/components/schemas/Role' }
        astronaut_id: { $ref: '#/components/schemas/Uuid' }
        call_sign: { type: string }
        resource: { type: string, description: Método y ruta consultados. }
        accessed_at: { $ref: '#/components/schemas/Timestamp' }
    ConfidentialAccessPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfidentialAccess' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
