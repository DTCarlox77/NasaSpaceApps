                      details:
                        { session_id: '40000000-0000-4000-8000-000000000001', status: closed }

  /api/v1/emergency/assessments/{id}/answers:
    put:
      tags: [Emergencia]
      summary: Guarda respuestas del triaje (lote)
      description: |
        Formato de respuesta: `{ "value": … }` para sí/no y números, `{ "choice": "<código>" }`
        para opciones (lista de códigos en `multi_choice`). Idempotente: cada respuesta lleva
        `client_uuid` y, por pregunta, manda la más reciente (`answered_at`). Devuelve una
        vista previa de `evaluateAssessment` para saber qué pregunta sigue (`pending`).
        **Vocabulario cerrado**: la app lee la pregunta en voz alta y responde con botones; el
        servidor solo acepta las opciones del protocolo (si no, 400).
        La respuesta de sesión `responder_safe` se copia automáticamente en cada evaluación; en
        una activación automática (sin `responder_safe`) la contesta el primer evaluador.
        Responder a una evaluación ya completada → 409 `ASSESSMENT_COMPLETED` (reevalúa); un
        reintento de respuestas ya guardadas da `duplicates`.
      operationId: putAssessmentAnswers
      x-status: mvp
      x-roles: [astronaut]
      x-hazards: [distance_from_earth, space_radiation, hostile_closed_env]
      security:
        - bearerAuth: []
        - deviceCredential: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswersPut'
            examples:
              start:
                summary: Primeras respuestas sobre LYRA
                value:
                  answers:
                    - {
                        client_uuid: 'e1000000-0000-4000-8000-000000000001',
                        question_code: responsive_and_mobile,
                        answer: { value: false },
                        source: voice,
                        answered_at: '2026-11-14T08:02:41Z',
                      }
                    - {
                        client_uuid: 'e1000000-0000-4000-8000-000000000002',
                        question_code: breathing,
                        answer: { value: false },
                        source: tap,
                        answered_at: '2026-11-14T08:02:49Z',
                      }
                    - {
                        client_uuid: 'e1000000-0000-4000-8000-000000000004',
                        question_code: breathing_after_airway,
                        answer: { value: true },
                        source: tap,
                        answered_at: '2026-11-14T08:03:05Z',
                      }
                    - {
                        client_uuid: 'e1000000-0000-4000-8000-000000000005',
                        question_code: vomiting,
                        answer: { value: true },
                        source: tap,
                        answered_at: '2026-11-14T08:03:20Z',
                      }
                    - {
                        client_uuid: 'e1000000-0000-4000-8000-000000000006',
                        question_code: time_to_vomiting,
                        answer: { choice: 1_2h },
                        source: tap,
                        answered_at: '2026-11-14T08:03:31Z',
                      }
                    - {
                        client_uuid: 'e1000000-0000-4000-8000-000000000007',
                        question_code: prodromal_symptoms,
                        answer: { choice: [nausea, fatigue] },
                        source: tap,
                        answered_at: '2026-11-14T08:03:50Z',
                      }
      responses:
        '200':
          description: Respuestas guardadas y vista previa del resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswersPutResult'
              examples:
                saved:
                  summary: Todas guardadas; listo para completar
                  value:
                    accepted: 6
                    duplicates: 0
                    preview:
                      status: 'completed'
                      triage_category: 'red'
                      radiation_flag: 'probable'
                      priority: 'emergency'
                      escalations:
                        - level: 'crew'
                          priority: 'emergency'
                        - level: 'flight_surgeon'
                          priority: 'emergency'
                      path:
                        [
                          'responder_safe=true',
                          'responsive_and_mobile=false',
                          'breathing=false',
                          'breathing_after_airway=true',
                          'RESULT_RED',
                          'vomiting=true',
                          'time_to_vomiting="1_2h"',
                          'prodromal_symptoms=["nausea","fatigue"]',
                        ]
                      computed_by: 'server'
                      rules_version: 1
