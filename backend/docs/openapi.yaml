components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token del login. El token de cambio de contraseña (428) solo sirve para `POST /auth/change-password`.
    deviceCredential:
      type: apiKey
      in: header
      name: X-Device-Credential
      description: Credencial de una tableta registrada (`POST /admin/devices`). Solo para los endpoints de emergencia.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IndicatorCode:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z0-9_]+$' }
      example: SPO2
    MissionIdQuery:
      name: mission_id
      in: query
      description: Misión a consultar. Si se omite, la misión vigente del usuario (o la primera activa de su equipo en Tierra).
      schema:
        $ref: '#/components/schemas/Uuid'
    From:
      name: from
      in: query
      description: Desde (inclusive), ISO 8601 UTC.
      schema: { type: string, format: date-time }
      example: '2026-11-07T00:00:00Z'
    To:
      name: to
      in: query
      description: Hasta (exclusivo), ISO 8601 UTC.
      schema: { type: string, format: date-time }
      example: '2026-11-15T00:00:00Z'
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devuelto en `next_cursor` de la página anterior.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Tamaño de página.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    ValidationError:
      description: Datos inválidos (VALIDATION_ERROR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              summary: Campo inválido
              value:
                error:
                  code: VALIDATION_ERROR
                  message: La petición tiene campos inválidos.
                  details:
                    - { field: measured_at, issue: debe ser una fecha ISO 8601 en UTC }
    Unauthenticated:
      description: Falta el token o no es válido (UNAUTHENTICATED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingToken:
              summary: Sin token
              value:
                error:
                  code: UNAUTHENTICATED
                  message: Inicia sesión para continuar.
                  details: null
    Forbidden:
      description: El rol no tiene permiso (FORBIDDEN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            wrongRole:
              summary: Rol sin permiso
              value:
                error:
                  code: FORBIDDEN
                  message: Tu rol no tiene permiso para esta acción.
                  details: { required_roles: [admin] }
    NotFound:
      description: El recurso no existe (NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              summary: No existe
              value:
                error:
                  code: NOT_FOUND
                  message: El recurso no existe.
                  details: null
    Conflict:
      description: Choca con el estado actual (CONFLICT)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              summary: Estado incompatible
              value:
                error:
                  code: CONFLICT
                  message: La operación no es compatible con el estado actual.
                  details: null
    PayloadTooLarge:
      description: El cuerpo excede el tamaño permitido (PAYLOAD_TOO_LARGE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tooLarge:
              summary: Demasiado grande
              value:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: El cuerpo de la petición excede el tamaño permitido
                  details: null
    AccountLocked:
      description: Cuenta bloqueada tras 5 intentos fallidos (ACCOUNT_LOCKED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            locked:
              summary: Bloqueada 15 minutos
              value:
                error:
                  code: ACCOUNT_LOCKED
                  message: Cuenta bloqueada por intentos fallidos. Intenta más tarde o pide al comandante que la desbloquee.
                  details: { locked_until: '2026-11-14T08:30:00Z' }
    PasswordChangeRequired:
      description: |
        Debe cambiar la contraseña antes de continuar (PASSWORD_CHANGE_REQUIRED).
        `details.password_change_token` solo sirve para `POST /auth/change-password`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            mustChange:
              summary: Primer inicio de ATLAS
              value:
                error:
                  code: PASSWORD_CHANGE_REQUIRED
                  message: Debes cambiar tu contraseña temporal antes de continuar.
                  details:
                    password_change_token: eyJhbGciOiJIUzI1NiJ9.eyJzY29wZSI6InBhc3N3b3JkX2NoYW5nZSJ9.demo
                    expires_in: 600
                    user_id: '00000000-0000-4000-8000-000000000014'
    RateLimited:
      description: Demasiadas peticiones (RATE_LIMITED)
      headers:
        Retry-After:
          description: Segundos a esperar.
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tooMany:
              summary: Espera 30 s
              value:
                error:
                  code: RATE_LIMITED
                  message: Demasiados intentos. Espera unos segundos.
                  details: { retry_after_seconds: 30 }

