  /api/v1/indicators/{code}:
    get:
      tags: [Salud]
      summary: Ficha de un indicador con sus reglas
      operationId: getIndicator
      x-status: mvp
      x-roles: [astronaut, flight_surgeon, behavioral_health, admin]
      x-hazards:
        [
          space_radiation,
          isolation_confinement,
          distance_from_earth,
          gravity_fields,
          hostile_closed_env,
        ]
      parameters:
        - $ref: '#/components/parameters/IndicatorCode'
      responses:
        '200':
          description: Indicador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorDetail'
              examples:
                spo2:
                  summary: SPO2
                  value:
                    code: 'SPO2'
                    name: 'Saturación de oxígeno'
                    unit: '%'
                    value_type: 'simple'
                    components:
                      - name: 'value'
                        type: 'number'
                        role: 'value'
                        required: true
                        unit: '%'
                    derived_fields: []
                    hazards: ['hostile_closed_env']
                    body_zone: 'lungs'
                    input_methods: ['manual', 'wearable']
                    sensitivity: 'standard'
                    rules_version: 1
                    guide:
                      measurable: 'Sí. Pulsioxímetro de dedo o pulsera; dedo tibio y quieto durante la lectura.'
                      why: 'Indica cuánto oxígeno lleva la sangre. Un valor bajo puede significar que el cuerpo no recibe suficiente oxígeno.'
                      hazard_effect: 'Hostile/Closed: depende de la atmósfera de la cabina (presión, O₂) y de la salud pulmonar; NASA HRP estudia el riesgo de hipoxia en atmósferas de exploración.'
                      when_to_escalate: 'Tripulación + flight surgeon: 91 % o menos. Tripulación: 92–93 %.'
                      prevention: 'Revisar la atmósfera del módulo, repetir con buena técnica y reportar falta de aire de inmediato.'
                    rules:
                      - level: 'critical'
                        when:
                          field: 'value'
                          op: 'lte'
                          value: 91
                        recommendation: 'Tu oxígeno en sangre está bajo. Avisa ya a tu tripulación; revisen la atmósfera del módulo y el protocolo de oxígeno.'
                        escalation: 'flight_surgeon'
                        source_ids: ['who_pulseox', 'news2']
                        basis: 'source_adapted'
                        note: 'OMS: SpO₂ < 90 % es una emergencia clínica; NEWS2: ≤91 % = puntaje 3.'
                      - level: 'caution'
                        when:
                          field: 'value'
                          op: 'lte'
                          value: 93
                        recommendation: 'Tu oxígeno está por debajo de lo normal. Vuelve a medir con el dedo tibio; si se repite, avisa a tu tripulación.'
                        escalation: 'crew'
                        source_ids: ['who_pulseox', 'news2']
                        basis: 'source_adapted'
                      - level: 'caution'
                        when:
                          field: 'value'
                          op: 'lte'
                          value: 94
                        recommendation: 'Tu oxígeno está ligeramente bajo. Repite la medición con el dedo tibio y quieto.'
                        escalation: 'self_care'
                        source_ids: ['who_pulseox']
                        basis: 'source'
                      - level: 'normal'
                        when:
                          all: []
                        recommendation: 'Tu oxígeno está en rango normal (95 % o más).'
                        escalation: 'self_care'
                        source_ids: ['who_pulseox']
                        basis: 'source'
                    sources:
                      - id: 'who_pulseox'
                        title: 'WHO Pulse Oximetry Training Manual (texto literal reproducido por PhenX Toolkit)'
                        url: 'https://dev.phenxtoolkit.org/protocols/view/91102'
                      - id: 'news2'
                        title: 'Royal College of Physicians – NEWS2, Chart 1: The NEWS scoring system (reproducido por NHS NWAS)'
                        url: 'https://www.nwas.nhs.uk/publications/news2-national-early-warning-score'
                    notes:
                      [
                        'Los cortes valen para atmósfera a nivel del mar. En atmósferas de exploración con menor presión parcial de O₂, el admin debe poder ajustar los cortes por entorno (pendiente de fuente).',
                      ]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/rules:
    get:
      tags: [Salud]
      summary: Reglas versionadas para evaluar sin conexión
      description: |
        Devuelve las reglas de los indicadores cuya `rules_version` es mayor que `since_version`.
        La app las guarda y evalúa con el mismo `conditions.js` que el servidor. Sin
        `since_version` devuelve todas (el set completo es igual a `docs/catalogo-indicadores.json`;
        el ejemplo muestra dos indicadores).
      operationId: getRules
      x-status: mvp
      x-roles: [astronaut, flight_surgeon, behavioral_health, admin]
      x-hazards: [distance_from_earth]
      parameters:
        - name: since_version
          in: query
          schema: { type: integer, minimum: 0 }
          example: 0
      responses:
        '200':
          description: Reglas nuevas o cambiadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesBundle'
              examples:
                full:
                  summary: Primera descarga
                  value:
                    catalog_version: 1
                    rules_version: 1
                    up_to_date: false
                    indicators:
                      - code: 'SPO2'
                        rules_version: 1
                        rules:
                          - level: 'critical'
                            when:
                              field: 'value'
                              op: 'lte'
                              value: 91
                            recommendation: 'Tu oxígeno en sangre está bajo. Avisa ya a tu tripulación; revisen la atmósfera del módulo y el protocolo de oxígeno.'
                            escalation: 'flight_surgeon'
                            source_ids: ['who_pulseox', 'news2']
                            basis: 'source_adapted'
                            note: 'OMS: SpO₂ < 90 % es una emergencia clínica; NEWS2: ≤91 % = puntaje 3.'
                          - level: 'caution'
                            when:
                              field: 'value'
                              op: 'lte'
                              value: 93
                            recommendation: 'Tu oxígeno está por debajo de lo normal. Vuelve a medir con el dedo tibio; si se repite, avisa a tu tripulación.'
                            escalation: 'crew'
                            source_ids: ['who_pulseox', 'news2']
                            basis: 'source_adapted'
                          - level: 'caution'
                            when:
                              field: 'value'
                              op: 'lte'
                              value: 94
                            recommendation: 'Tu oxígeno está ligeramente bajo. Repite la medición con el dedo tibio y quieto.'
                            escalation: 'self_care'
                            source_ids: ['who_pulseox']
                            basis: 'source'
                          - level: 'normal'
                            when:
                              all: []
                            recommendation: 'Tu oxígeno está en rango normal (95 % o más).'
                            escalation: 'self_care'
                            source_ids: ['who_pulseox']
                            basis: 'source'
                      - code: 'HEART_RATE'
                        rules_version: 1
                        rules:
                          - level: 'unrated'
                            when:
                              field: 'at_rest'
                              op: 'eq'
                              value: false
                            recommendation: 'Esta medición se hizo en actividad; los rangos de reposo no aplican.'
                            escalation: 'self_care'
                            source_ids: ['aha_hr']
                            basis: 'source_adapted'
                            note: 'La AHA define el rango normal para personas sentadas o acostadas, en calma.'
                          - level: 'critical'
                            when:
                              any:
                                - field: 'value'
                                  op: 'lte'
                                  value: 40
                                - field: 'value'
                                  op: 'gte'
                                  value: 131
                            recommendation: 'Tu pulso en reposo está fuera de un rango seguro. Quédate en reposo, vuelve a medir en 5 minutos y avisa a tu tripulación.'
                            escalation: 'flight_surgeon'
                            source_ids: ['news2']
                            basis: 'source_adapted'
                            note: 'Puntaje 3 de NEWS2 (≤40 o ≥131).'
                          - level: 'caution'
                            when:
                              all:
                                - field: 'value'
                                  op: 'lt'
                                  value: 60
                                - field: 'symptoms'
                                  op: 'has_any'
                                  value: ['dizziness', 'fainting', 'confusion']
                            recommendation: 'Tu pulso está lento y tienes mareo. Quédate sujeto y avisa a tu tripulación.'
                            escalation: 'crew'
                            source_ids: ['aha_hr']
                            basis: 'source_adapted'
                          - level: 'caution'
                            when:
                              field: 'value'
                              op: 'gte'
                              value: 111
                            recommendation: 'Tu pulso en reposo está alto. Descansa, bebe agua y vuelve a medir en 15 minutos.'
                            escalation: 'crew'
                            source_ids: ['aha_hr', 'news2']
                            basis: 'source_adapted'
                            note: 'NEWS2 puntaje 2 en 111–130.'
                          - level: 'caution'
                            when:
                              field: 'value'
                              op: 'gt'
                              value: 100
                            recommendation: 'Tu pulso en reposo está algo alto. Descansa, hidrátate y vuelve a medir más tarde.'
                            escalation: 'self_care'
                            source_ids: ['aha_hr']
                            basis: 'source'
                          - level: 'caution'
                            when:
                              field: 'value'
                              op: 'lt'
                              value: 60
                            recommendation: 'Tu pulso está por debajo de 60. En personas muy entrenadas puede ser normal; si te sientes mareado, regístralo como síntoma.'
                            escalation: 'self_care'
                            source_ids: ['aha_hr']
                            basis: 'source'
                          - level: 'normal'
                            when:
                              all: []
                            recommendation: 'Tu pulso en reposo está en rango normal.'
                            escalation: 'self_care'
                            source_ids: ['aha_hr']
                            basis: 'source'
                upToDate:
                  summary: Ya tienes la última versión
                  value: { catalog_version: 1, rules_version: 1, up_to_date: true, indicators: [] }
        '401':
          $ref: '#/components/responses/Unauthenticated'

