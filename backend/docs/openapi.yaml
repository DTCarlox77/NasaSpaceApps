  /api/v1/admin/inbox:
    get:
      tags: [Tierra]
      summary: Bandeja de escalamientos ya entregados en Tierra
      description: |
        Basada en `v_ground_inbox`: escalamientos `flight_surgeon` con `deliver_at <= now()` y no
        cerrados, ordenados por prioridad (`emergency` > `urgent` > `routine`) y luego por
        `deliver_at` ascendente (lo que espera desde hace más tiempo, primero). Lo que está en cola
        (`deliver_at` futuro o null) no aparece todavía. `category`: `reading` (lectura),
        `emergency` (triaje), `wellbeing` (alerta de bienestar escalada al flight surgeon: solo
        estado; `admin` no la ve), `manual`. Lo confidencial (`behavioral_health`) nunca aparece.
        `admin` tampoco recibe las alertas de `SLEEP_HOURS` (v1.8: llega con el check-in y su
        `reason` lleva el valor); el flight surgeon sí recibe la crítica.
        Al leer la bandeja, lo que ya llegó pasa de `queued` a `delivered`.
      operationId: getGroundInbox
      x-status: mvp
      x-roles: [flight_surgeon, admin]
      x-hazards: [distance_from_earth]
      parameters:
        - $ref: '#/components/parameters/MissionIdQuery'
        - name: category
          in: query
          schema: { type: string, enum: [reading, emergency, wellbeing, manual] }
        - name: status
