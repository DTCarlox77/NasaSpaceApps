        corte sigue abierto, `deliver_at` es null (en cola) y se recalcula al cerrar el corte.
        El escalamiento pasa a `responded` (y cuenta como acuse si no lo había). Igual que el
        acuse: **404** si todavía no llegó a Tierra y **409** si está cerrado.
