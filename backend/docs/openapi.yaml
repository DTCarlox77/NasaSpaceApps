openapi: 3.0.3
info:
  title: Astro Health API
  version: 1.0.0
  description: |
    API de apoyo a la decisión para el monitoreo de salud de astronautas.

    **Importante:** todos los datos de astronautas son SINTÉTICOS. Esta API es una
    herramienta de apoyo a la decisión y **no** constituye un diagnóstico médico.

    ## Convenciones
    - Todas las rutas empiezan por `/api/v1` (las del panel de Tierra, por `/api/v1/admin/...`).
      En las descripciones se omite el prefijo: `POST /readings` = `POST /api/v1/readings`.
    - JSON, IDs UUID y fechas ISO 8601 en UTC.
    - Autenticación `Authorization: Bearer <access_token>` (JWT). Solo los endpoints de
      emergencia aceptan además `X-Device-Credential` (tableta registrada sin sesión).
    - Extensiones en cada operación:
      - `x-roles`: roles que pueden llamarla (`astronaut`, `flight_surgeon`,
        `behavioral_health`, `admin`). `public` = no requiere sesión.
      - `x-crew-role`: rol de tripulación exigido además del rol (`commander`,
        `crew_medical_officer`).
      - `x-status`: `mvp` o `extra`.
      - `x-hazards`: peligros RIDGE que atiende (`space_radiation`, `isolation_confinement`,
        `distance_from_earth`, `gravity_fields`, `hostile_closed_env`).
      - `x-sensitivity: confidential`: datos de bienestar (ver "Quién ve qué").
    - Idempotencia: lo que crea un dispositivo lleva `client_uuid`. La primera vez responde
      **201**; un duplicado responde **200** con el registro existente.
    - Lecturas: `measured_at` lo pone el dispositivo y `received_at` el servidor.
      `supersedes_uuid` corrige una lectura anterior sin borrarla.
    - Listas de datos paginadas por cursor: `?cursor=&limit=` → `{ items, next_cursor }`
      (`next_cursor: null` = última página). Los catálogos estáticos (indicadores, zonas,
      síntomas, instrumentos) se devuelven completos, sin paginar.
    - Errores con un único esquema: `{ "error": { "code", "message", "details" } }`.
    - Retraso con Tierra: lo que cruza el enlace lleva `deliver_at`, calculado con
      `compute_deliver_at` (retraso del entorno + cortes de comunicación).
      `deliver_at: null` = en cola esperando a que vuelva el enlace.
    - Resultado de un indicador = `evaluateIndicator` (`src/engine/conditions.js`).
      Resultado del triaje = `evaluateAssessment` (`src/engine/triage.js`).

    ## Quién ve qué (bienestar, confidencial)
    | Rol | Ve |
    |---|---|
    | `astronaut` | Solo lo suyo. Recibe mensajes neutros: nunca un color ni un puntaje. |
    | `behavioral_health` | Detalle: valores, tendencias, cuestionarios y solicitudes de apoyo. Cada acceso queda auditado. |
    | `flight_surgeon` | Estado y alertas escaladas a `flight_surgeon`, sin respuestas individuales. |
    | `admin` | Solo cumplimiento (check-ins completados) y aptitud: `fit` / `not_confirmed`. |
    | Tripulación | Nada. |

    ## Mock
    `npm run api:mock` levanta Prism en `http://localhost:4010` con los ejemplos de este
    contrato. Para pedir otra respuesta documentada usa el header `Prefer`, por ejemplo
    `Prefer: code=423` o `Prefer: example=duplicate`.
servers:
  - url: http://localhost:3000
    description: Desarrollo local
  - url: http://localhost:4010
    description: Mock con Prism (npm run api:mock)
security:
  - bearerAuth: []
tags:
  - name: Sistema
    description: Estado del servicio.
  - name: Auth
    description: Inicio de sesión, cambio obligatorio de contraseña, refresh rotativo y desbloqueo offline.
  - name: Admin-Cuentas
    description: Cuentas y dispositivos (admin) y permisos delegados del comandante (auditados y reportados a Tierra).
  - name: Misión
    description: Misión vigente, tripulación, entornos, asignaciones y cortes de comunicación.
  - name: Salud
    description: Catálogo de indicadores, reglas versionadas, lecturas, semáforo por zona del cuerpo y adjuntos.
  - name: Hábitat
    description: Sensores del módulo (CO₂, temperatura, humedad y ruido).
  - name: Sync
    description: Sincronización offline-first por lotes con prioridad de emergencia.
  - name: Emergencia
    description: Triaje Autónomo (START adaptado + módulo de radiación) con interruptor de hombre muerto.
  - name: Bienestar
    description: Check-ins, cuestionarios, prueba de reacción (PVT) y "Quiero hablar con alguien". Confidencial.
  - name: Tierra
    description: Panel del flight surgeon y control de misión. Sin estado conductual.
  - name: Salud conductual
    description: Bandeja y detalle confidencial para behavioral_health.
  - name: Auditoría
    description: Acciones delegadas y accesos a datos confidenciales.
paths:
  # ===================================================================== Sistema
  /api/v1/health:
    get:
      tags: [Sistema]
      summary: Verifica el estado de la API y de la base de datos
      description: Ejecuta `SELECT 1` contra PostgreSQL para comprobar la conexión.
      operationId: getHealth
      x-status: mvp
      x-roles: [public]
      x-hazards: []
      security: []
      responses:
        '200':
          description: API y base de datos operativas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  summary: Todo operativo
                  value:
                    status: ok
                    db: up
                    time: '2026-11-14T15:00:00.000Z'
                    version: 0.1.0
        '503':
          description: La base de datos no responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                dbDown:
                  summary: Base de datos caída
                  value:
                    status: error
                    db: down
                    time: '2026-11-14T15:00:00.000Z'
                    version: 0.1.0

  # ===================================================================== Auth
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión
      description: |
        Devuelve tokens y el contexto de la asignación vigente (`v_current_crew`): el astronauta
        queda asignado a su misión automáticamente, nunca la elige.
        - Tras 5 intentos fallidos la cuenta se bloquea 15 min (configurable) → **423**.
        - Si `must_change_password = true` → **428** con un token de un solo uso que solo sirve
          para `POST /auth/change-password` (no se emite refresh token).
        - Credenciales inválidas → **401** con el mismo mensaje exista o no el usuario.
      operationId: login
      x-status: mvp
      x-roles: [public]
      x-hazards: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              astronaut:
                summary: Astronauta ORION
                value: { username: a.ortega, password: Demo2026!, device_id: ipad-crew-01 }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                astronaut:
                  $ref: '#/components/examples/LoginOrion'
                flightSurgeon:
                  summary: dr.reyes (equipo en Tierra)
                  value:
                    access_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMDIifQ.demo
                    token_type: Bearer
                    expires_in: 3600
                    refresh_token: rt_51d0a7e3c2b94f18
                    must_change_password: false
                    offline_unlock_until: null
                    user:
                      id: '00000000-0000-4000-8000-000000000002'
                      username: dr.reyes
                      full_name: Dra. Elena Reyes (sintética)
                      role: flight_surgeon
                      email: surgeon@demo.local
                    context:
                      astronaut_id: null
                      call_sign: null
                      crew_role: null
                      ground_missions:
                        - id: '20000000-0000-4000-8000-000000000001'
                          code: ARES-1
                          name: Ares 1 · Tránsito a Marte (demo)
                          status: active
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  summary: Usuario o contraseña incorrectos
                  value:
                    error:
                      code: INVALID_CREDENTIALS
                      message: Usuario o contraseña incorrectos.
                      details: { attempts_left: 3 }
        '403':
          description: Astronauta sin asignación vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noAssignment:
                  summary: Sin misión vigente
                  value:
                    error:
                      code: NO_ACTIVE_ASSIGNMENT
                      message: No tienes una asignación de misión vigente.
                      details: null
        '423':
          $ref: '#/components/responses/AccountLocked'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Cambia la contraseña (obligatorio en el primer inicio)
      description: |
        Acepta el token normal o el `password_change_token` del 428. Política: mínimo 10
        caracteres y distinta de la actual. Devuelve tokens completos (misma forma que el login)
        y revoca los refresh tokens anteriores.
      operationId: changePassword
      x-status: mvp
      x-roles: [astronaut, flight_surgeon, behavioral_health, admin]
      x-hazards: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              firstLogin:
                summary: ATLAS cambia su contraseña temporal
                value:
                  current_password: Temp-4821-kx
                  new_password: Atlas#Mars2026
                  device_id: ipad-crew-04
      responses:
        '200':
          description: Contraseña cambiada; sesión completa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                atlas:
                  summary: ATLAS ya puede usar la app
                  value:
                    access_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMTQifQ.demo
                    token_type: Bearer
                    expires_in: 3600
                    refresh_token: rt_c93e7d21a04b5f66
                    must_change_password: false
                    offline_unlock_until: '2026-11-21T09:00:00Z'
                    user:
                      id: '00000000-0000-4000-8000-000000000014'
                      username: m.silva
                      full_name: Marco Silva (sintético)
                      role: astronaut
                      email: null
                    context:
                      astronaut_id: '10000000-0000-4000-8000-000000000014'
                      call_sign: ATLAS
                      crew_role: mission_specialist
                      mission:
                        id: '20000000-0000-4000-8000-000000000001'
                        code: 'ARES-1'
                        name: 'Ares 1 · Tránsito a Marte (demo)'
                        status: 'active'
                      environment:
                        code: 'mars_transit'
                        name: 'Tránsito a Marte'
                        type: 'spacecraft'
                        gravity_g: 0
                        comm_delay_seconds: 90
        '400':
          description: La nueva contraseña no cumple la política
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                weakPassword:
                  summary: Contraseña débil
                  value:
                    error:
                      code: WEAK_PASSWORD
                      message: La contraseña debe tener al menos 10 caracteres y ser distinta de la actual.
                      details: { min_length: 10 }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Renueva el access token (refresh rotativo)
      description: |
        Cada uso revoca el refresh token y entrega uno nuevo (`replaced_by`). Si se reusa un token
        ya revocado se asume robo: se revoca toda la familia de tokens del usuario, se registra
        `token_reuse_detected` y se responde **401** `TOKEN_REUSE_DETECTED`.
      operationId: refreshToken
      x-status: mvp
      x-roles: [public]
      x-hazards: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              refresh:
                summary: Renovar en la tableta de ORION
                value: { refresh_token: rt_8f2c1d0e9b7a4c3f, device_id: ipad-crew-01 }
      responses:
        '200':
          description: Tokens nuevos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              examples:
                rotated:
                  summary: Token rotado
                  value:
                    access_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMTEifQ.rotated
                    token_type: Bearer
                    expires_in: 3600
                    refresh_token: rt_0b7d4e2f9c1a8e53
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Refresh token inválido, vencido o reusado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                reuseDetected:
                  summary: Reuso detectado; se revocó la familia
                  value:
                    error:
                      code: TOKEN_REUSE_DETECTED
                      message: Se detectó el reuso de un token. Inicia sesión de nuevo.
                      details: { family_revoked: true }
                expired:
                  summary: Token vencido
                  value:
                    error:
                      code: UNAUTHENTICATED
                      message: La sesión expiró. Inicia sesión de nuevo.
                      details: null
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Cierra la sesión del dispositivo
      description: Revoca el refresh token del dispositivo (o de todos con `all_devices`).
      operationId: logout
      x-status: mvp
      x-roles: [astronaut, flight_surgeon, behavioral_health, admin]
      x-hazards: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            examples:
              thisDevice:
                summary: Solo esta tableta
                value: { device_id: ipad-crew-01, all_devices: false }
      responses:
        '204':
          description: Sesión cerrada (sin contenido)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/me:
    get:
      tags: [Auth]
      summary: Usuario actual y su contexto
      operationId: getMe
      x-status: mvp
      x-roles: [astronaut, flight_surgeon, behavioral_health, admin]
      x-hazards: []
      responses:
        '200':
          description: Usuario y contexto (igual que en el login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                astronaut:
                  summary: ORION
                  value:
                    user:
                      id: '00000000-0000-4000-8000-000000000011'
                      username: 'a.ortega'
                      full_name: 'Ana Ortega (sintética)'
                      role: 'astronaut'
                      email: null
                    context:
                      astronaut_id: '10000000-0000-4000-8000-000000000011'
                      call_sign: 'ORION'
                      crew_role: 'commander'
                      mission:
                        id: '20000000-0000-4000-8000-000000000001'
                        code: 'ARES-1'
                        name: 'Ares 1 · Tránsito a Marte (demo)'
                        status: 'active'
                      environment:
                        code: 'mars_transit'
                        name: 'Tránsito a Marte'
                        type: 'spacecraft'
                        gravity_g: 0
                        comm_delay_seconds: 90
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'

  /api/v1/me/offline-pin:
    put:
      tags: [Auth]
      summary: Define el PIN de desbloqueo offline del dispositivo
      description: |
        Permite desbloquear la app sin conexión hasta `offline_unlock_until` (7 días desde el
        último login en línea). El PIN se guarda con hash; nunca viaja de vuelta.
      operationId: setOfflinePin
      x-status: extra
      x-roles: [astronaut]
      x-hazards: [distance_from_earth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflinePinRequest'
            examples:
              pin:
                summary: PIN de 6 dígitos
                value: { pin: '482915', device_id: ipad-crew-01 }
      responses:
        '200':
          description: PIN guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflinePinResponse'
              examples:
                saved:
                  summary: PIN válido por 7 días
                  value: { device_id: ipad-crew-01, offline_unlock_until: '2026-11-21T16:00:00Z' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===================================================================== Admin-Cuentas
  /api/v1/admin/users:
    post:
      tags: [Admin-Cuentas]
      summary: Crea una cuenta (astronauta o personal de Tierra)
      description: |
        Con `role: astronaut` crea en una transacción el usuario, el perfil (`astronaut`) y la
        asignación a la misión. Para personal de Tierra, `ground_mission_ids` lo agrega al equipo
        de esas misiones. `temporary_password` se genera con `crypto.randomBytes`, **se muestra
        una sola vez** y solo se guarda su hash; la cuenta queda con `must_change_password`.
      operationId: createUser
      x-status: mvp
      x-roles: [admin]
      x-hazards: [isolation_confinement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              astronaut:
                summary: Alta de ATLAS en ARES-1
                value:
                  username: m.silva
                  full_name: Marco Silva (sintético)
                  role: astronaut
                  astronaut:
                    call_sign: ATLAS
                    agency: Demo Agency
                    mission_id: '20000000-0000-4000-8000-000000000001'
                    crew_role: mission_specialist
              flightSurgeon:
                summary: Alta de dr.reyes
                value:
                  username: dr.reyes
                  full_name: Dra. Elena Reyes (sintética)
                  email: surgeon@demo.local
                  role: flight_surgeon
                  ground_mission_ids: ['20000000-0000-4000-8000-000000000001']
      responses:
        '201':
          description: Cuenta creada; la contraseña temporal no se vuelve a mostrar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedUser'
              examples:
                astronaut:
                  summary: ATLAS creado
                  value:
                    user:
                      id: '00000000-0000-4000-8000-000000000014'
                      username: m.silva
                      email: null
                      full_name: Marco Silva (sintético)
                      role: astronaut
                      must_change_password: true
                      is_active: true
                      failed_login_attempts: 0
                      locked_until: null
                      last_login_at: null
                      created_at: '2026-09-30T08:00:00Z'
                    astronaut:
                      id: '10000000-0000-4000-8000-000000000014'
                      user_id: '00000000-0000-4000-8000-000000000014'
                      call_sign: ATLAS
                      agency: Demo Agency
                      synthetic: true
                    assignment:
                      id: '22000000-0000-4000-8000-000000000014'
                      mission_id: '20000000-0000-4000-8000-000000000001'
                      astronaut_id: '10000000-0000-4000-8000-000000000014'
                      call_sign: ATLAS
                      crew_role: mission_specialist
                      assigned_from: '2026-09-30T08:00:00Z'
                      assigned_to: null
                      created_at: '2026-09-30T08:00:00Z'
                    temporary_password: Temp-4821-kx
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Usuario o call sign ya existen, rol de tripulación ocupado o asignación solapada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                usernameTaken:
                  summary: Usuario repetido (sin distinguir mayúsculas)
                  value:
                    error:
                      code: USERNAME_TAKEN
                      message: El usuario m.silva ya existe.
                      details: { field: username }
                crewRoleTaken:
                  summary: Ya hay comandante vigente
                  value:
                    error:
                      code: CREW_ROLE_TAKEN
                      message: ARES-1 ya tiene un comandante vigente.
                      details: { crew_role: commander }

  /api/v1/admin/users/{id}/reset-password:
    post:
      tags: [Admin-Cuentas]
      summary: Restablece la contraseña de una cuenta
      description: Genera una contraseña temporal (se muestra una vez), activa `must_change_password` y revoca sus refresh tokens.
      operationId: resetUserPassword
      x-status: mvp
      x-roles: [admin]
      x-hazards: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Contraseña temporal generada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPasswordResponse'
              examples:
                reset:
                  summary: Reset de VEGA
                  value:
                    user_id: '00000000-0000-4000-8000-000000000012'
                    temporary_password: Temp-7730-qp
                    must_change_password: true
                    revoked_refresh_tokens: 2
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/users/{id}/unlock:
    post:
      tags: [Admin-Cuentas]
      summary: Desbloquea una cuenta bloqueada por intentos fallidos
      operationId: unlockUser
      x-status: mvp
      x-roles: [admin]
      x-hazards: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cuenta desbloqueada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
              examples:
                unlocked:
                  $ref: '#/components/examples/UserAdminLyra'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/devices:
    post:
      tags: [Admin-Cuentas]
      summary: Registra una tableta de la misión
      description: |
        Devuelve la credencial del dispositivo **una sola vez** (solo se guarda su hash). La
        tableta la envía en `X-Device-Credential` para usar los endpoints de emergencia sin sesión.
      operationId: registerDevice
      x-status: mvp
      x-roles: [admin]
      x-hazards: [distance_from_earth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
            examples:
              tablet:
                summary: Tableta del módulo HAB-1
                value:
                  {
                    label: TAB-1,
                    mission_id: '20000000-0000-4000-8000-000000000001',
                    module_id: HAB-1,
                  }
      responses:
        '201':
          description: Dispositivo registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCreated'
              examples:
                registered:
                  summary: TAB-1 registrada
                  value:
                    device:
                      id: '80000000-0000-4000-8000-000000000001'
                      label: 'TAB-1'
                      kind: 'tablet'
                      mission_id: '20000000-0000-4000-8000-000000000001'
                      module_id: 'HAB-1'
                      registered_by: '00000000-0000-4000-8000-000000000001'
                      registered_via: 'admin'
