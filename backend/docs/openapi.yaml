    post:
      tags: [Salud conductual]
      summary: Cierra una solicitud de apoyo
      description: |
        Solo sobre lo que ya llegó a Tierra (antes, **404**). Idempotente: cerrar otra vez devuelve
        el primer cierre. Cerrada, ya no admite respuestas (**409**) ni sale en la bandeja (salvo
        `include_closed=true`).
