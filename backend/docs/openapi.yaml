  # ===================================================================== Emergencia
  /api/v1/emergency/protocol:
    get:
      tags: [Emergencia]
      summary: Protocolo de triaje activo (o una versión)
      description: |
        La app lo guarda en caché para evaluar sin conexión con `evaluateAssessment`
        (`src/engine/triage.js`, el mismo código del servidor). El activo es la **v2** (si el
        tripulante no responde, el módulo de radiación solo pregunta signos observables).
        `?version=` devuelve otra versión: una sesión se evalúa siempre con la suya
        (`session.protocol.version`). El ejemplo es la v1 del seed.
      operationId: getEmergencyProtocol
      x-status: mvp
      x-roles: [astronaut, flight_surgeon, admin]
      x-hazards: [distance_from_earth, space_radiation, hostile_closed_env]
      security:
        - bearerAuth: []
        - deviceCredential: []
      parameters:
        - name: version
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Protocolo activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageProtocol'
              examples:
                crewEmergency:
                  summary: crew_emergency v1 (START adaptado + radiación)
                  value:
                    id: 1
                    code: crew_emergency
                    version: 1
                    name: Triaje de emergencia de tripulación (START adaptado)
                    is_active: true
                    sources:
                      - id: 'START'
                        title: 'START Adult Triage Algorithm'
                        publisher: 'HHS CHEMM'
                        url: 'https://chemm.hhs.gov/startalgotext.htm'
                      - id: 'START_STEPS'
                        title: 'Mass casualty incident triage (START)'
                        publisher: 'WikEM'
                        url: 'https://www.wikem.org/wiki/Start_triage'
                      - id: 'ARS_TRIAGE'
                        title: 'Triage handout: ARS prodrome and time to emesis'
                        publisher: 'ORAU / REACTS'
                        url: 'https://www.orau.gov/hsc/RadMassCasualties/assets/4_Triage_Handout.pdf'
                      - id: 'NASA_ARS'
                        title: 'Space Radiation Protection Strategies (ARS from SPE)'
                        publisher: 'NASA HRP Space Radiation Element'
                        url: 'https://ntrs.nasa.gov/api/citations/20170001372/downloads/20170001372.pdf'
                      - id: 'NASA_RISKS'
                        title: 'Risks of Human Spaceflight'
                        publisher: 'NASA HRP'
                        url: 'https://www.nasa.gov/hrp/risks/'
                    definition:
                      disclaimer: 'Apoyo a la decisión. No reemplaza el juicio del oficial médico de la tripulación ni del flight surgeon.'
                      start_question: 'responder_safe'
                      questions:
                        - code: 'responder_safe'
                          scope: 'session'
                          type: 'boolean'
                          prompt: 'Antes de ayudar: ¿estás en un lugar seguro? Si hay alarma de radiación o del hábitat, primero ve al refugio.'
                          prefill:
                            from: 'context'
                            keys: ['solar_event_active', 'environment_alarm']
                          next:
                            'true': 'responsive_and_mobile'
                            'false': 'STOP_SECURE_SELF'
                          source: 'START_STEPS'
                        - code: 'responsive_and_mobile'
                          scope: 'assessment'
                          type: 'boolean'
                          prompt: '¿{call_sign} responde y puede desplazarse por sí mismo hasta el punto de reunión?'
                          note: "En microgravedad no aplica 'caminar' de START: se adapta a desplazarse por sí mismo."
                          next:
                            'true': 'RESULT_GREEN_THEN_RADIATION'
                            'false': 'breathing'
                          source: 'START'
                        - code: 'breathing'
                          scope: 'assessment'
                          type: 'boolean'
                          prompt: '¿{call_sign} está respirando?'
                          next:
                            'true': 'resp_rate_over_30'
                            'false': 'breathing_after_airway'
                          source: 'START_STEPS'
                        - code: 'breathing_after_airway'
                          scope: 'assessment'
                          type: 'boolean'
                          prompt: 'Reposiciona la vía aérea (inclina la cabeza hacia atrás). ¿Respira ahora?'
                          next:
                            'true': 'RESULT_RED'
                            'false': 'RESULT_BLACK'
                          source: 'START_STEPS'
                        - code: 'resp_rate_over_30'
                          scope: 'assessment'
                          type: 'boolean'
                          prompt: '¿Respira más de 30 veces por minuto?'
                          prefill:
                            from: 'reading'
                            indicator: 'RESP_RATE'
                            max_age_minutes: 10
                            rule: 'value > 30'
                          next:
                            'true': 'RESULT_RED'
                            'false': 'perfusion_ok'
                          source: 'START_STEPS'
                        - code: 'perfusion_ok'
                          scope: 'assessment'
                          type: 'boolean'
                          prompt: '¿Tiene pulso en la muñeca, o al presionar una uña el color vuelve en 2 segundos o menos?'
                          next:
                            'true': 'follows_commands'
                            'false': 'RESULT_RED'
                          source: 'START_STEPS'
                        - code: 'follows_commands'
                          scope: 'assessment'
                          type: 'boolean'
                          prompt: "Pídele: 'aprieta mi mano'. ¿Obedece órdenes simples?"
                          next:
                            'true': 'RESULT_YELLOW'
                            'false': 'RESULT_RED'
                          source: 'START'
                        - code: 'vomiting'
                          scope: 'assessment'
                          type: 'boolean'
                          module: 'radiation'
                          condition:
                            any:
                              - ctx: 'solar_event_active'
                                op: 'eq'
                                value: true
                          prompt: '¿{call_sign} ha vomitado desde el evento de radiación?'
                          next:
                            'true': 'time_to_vomiting'
                            'false': 'prodromal_symptoms'
                          source: 'ARS_TRIAGE'
                        - code: 'time_to_vomiting'
                          scope: 'assessment'
                          type: 'choice'
                          module: 'radiation'
                          prompt: '¿Cuánto tiempo después del evento empezó a vomitar?'
                          choices: ['lt_1h', '1_2h', 'gt_2h', 'unknown']
                          note: 'El tiempo hasta el vómito es un indicador orientativo de gravedad; lo interpreta el flight surgeon.'
                          next:
                            '*': 'prodromal_symptoms'
                          source: 'ARS_TRIAGE'
                        - code: 'prodromal_symptoms'
                          scope: 'assessment'
                          type: 'multi_choice'
                          module: 'radiation'
                          prompt: '¿Tiene alguno de estos síntomas? Náusea, diarrea, fatiga, dolor de cabeza, fiebre, piel enrojecida.'
                          choices:
                            [
                              'nausea',
                              'diarrhea',
                              'fatigue',
                              'headache',
                              'fever',
                              'skin_erythema',
                              'none',
                            ]
                          prefill:
                            from: 'reading'
                            indicator: 'BODY_TEMP'
                            max_age_minutes: 30
                            maps_to: 'fever'
                          next:
                            '*': 'END_ASSESSMENT'
                          source: 'ARS_TRIAGE'
                      results:
                        RESULT_GREEN_THEN_RADIATION:
                          category: 'green'
                          then: 'vomiting'
                        RESULT_YELLOW:
                          category: 'yellow'
                          then: 'vomiting'
                        RESULT_RED:
                          category: 'red'
                          then: 'vomiting'
                        RESULT_BLACK:
                          category: 'black'
                          then: 'END_ASSESSMENT'
                      radiation_flag_rules:
                        - when:
                            any:
                              - q: 'vomiting'
                                op: 'eq'
                                value: true
                          flag: 'probable'
                        - when:
                            any:
                              - q: 'prodromal_symptoms'
                                op: 'has_any'
                                value:
                                  [
                                    'nausea',
                                    'diarrhea',
                                    'fatigue',
                                    'headache',
                                    'fever',
                                    'skin_erythema',
                                  ]
                          flag: 'possible'
                      radiation_flag_default: 'none'
                      escalation_rules:
                        - when:
                            any:
                              - field: 'category'
                                op: 'in'
                                value: ['red', 'black']
                              - field: 'radiation_flag'
                                op: 'eq'
                                value: 'probable'
                          actions:
                            - level: 'crew'
                              priority: 'emergency'
                            - level: 'flight_surgeon'
                              priority: 'emergency'
                        - when:
                            any:
                              - field: 'category'
                                op: 'eq'
                                value: 'yellow'
                              - field: 'radiation_flag'
                                op: 'eq'
                                value: 'possible'
                          actions:
                            - level: 'crew'
                              priority: 'urgent'
                            - level: 'flight_surgeon'
                              priority: 'urgent'
                        - when:
                            any:
                              - field: 'category'
                                op: 'eq'
                                value: 'green'
                          actions:
                            - level: 'self_care'
                              priority: 'routine'
                            - level: 'crew'
                              priority: 'routine'
                      roster_order: 'Primero quien tenga lecturas críticas recientes o check-ins perdidos; luego el resto.'
                      dead_man_switch_seconds: 120
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/emergency/sessions:
    post:
      tags: [Emergencia]
      summary: Activa el modo emergencia
      description: |
        Cualquier tripulante de la misión vigente. `trigger_type`: botón manual (`manual_button`),
        aviso de un tripulante (`crew_event`) o lo que detectó la app sin conexión. Se abre
        **activa** de una vez (sin hombre muerto: ya hay alguien atendiendo) y escala a bordo
        (`crew`) y a Tierra (`flight_surgeon`, con `compute_deliver_at` y cortes).
        `responder_safe`: si es `{ "value": false }`, `next_step` es `secure_self` y la app
        muestra "ponte a salvo" antes de evaluar. Devuelve el roster ordenado por riesgo y el
        orden de atención. Si ya hay una sesión abierta en la misión, **se une** a ella:
        201 con `joined: true` y la sesión abierta (queda en la línea de tiempo). Las
        activaciones automáticas (lectura crítica, check-in perdido) las hace el servidor.
      operationId: createEmergencySession
      x-status: mvp
      x-roles: [astronaut]
      x-hazards: [distance_from_earth, space_radiation, hostile_closed_env]
      security:
        - bearerAuth: []
        - deviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencySessionCreate'
            examples:
              manual:
                summary: Botón manual durante un evento solar
                value:
                  client_uuid: 'c4000000-0000-4000-8000-000000000001'
                  trigger_type: manual_button
                  started_at: '2026-11-14T08:02:00Z'
                  context: { solar_event_active: true, environment_alarm: null }
                  responder_safe: { value: true }
      responses:
        '201':
          description: Sesión creada con su roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionWithRoster'
              examples:
                created:
                  $ref: '#/components/examples/SessionWithRosterAres1'
        '200':
          description: Duplicado (mismo client_uuid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionWithRoster'
              examples:
                duplicate:
                  $ref: '#/components/examples/SessionWithRosterAres1'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/emergency/sessions/{id}:
    get:
      tags: [Emergencia]
      summary: Sesión con su roster ordenado por riesgo y el orden de atención
      description: |
        Roster: primero quien no respondió "estoy bien", luego quien lo está esperando y quien
        tiene una lectura crítica reciente; luego el resto (con `prefill` desde lecturas
        recientes). `attention_order`: a quién atender primero según el protocolo (rojo,
        amarillo, verde, negro; dentro, radiación probable antes que posible; quien no tiene
        evaluación va después de los rojos), con el motivo de cada lugar.
        Al leerla corre el barrido del hombre muerto (`sweepDeadman`). flight_surgeon y admin
        ven solo lo que ya llegó a Tierra (404 antes); admin, sin datos clínicos.
      operationId: getEmergencySession
      x-status: mvp
      x-roles: [astronaut, flight_surgeon, admin]
      x-hazards: [distance_from_earth, space_radiation, hostile_closed_env]
      security:
        - bearerAuth: []
        - deviceCredential: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sesión y roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionWithRoster'
              examples:
                inProgress:
                  $ref: '#/components/examples/SessionWithRosterAres1'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/emergency/sessions/{id}/confirm:
    post:
      tags: [Emergencia]
      summary: '"Estoy bien" del tripulante afectado (interruptor de hombre muerto)'
      description: |
        En una activación automática (lectura crítica o check-in perdido) la sesión nace
        `pending` y el tripulante afectado tiene `TRIAGE_DEADMAN_S` (60 s) para confirmar. Si
        todos los afectados confirman, la sesión se **cancela** (queda registrada). Si el plazo
        vence, el servidor la activa, avisa a bordo y escala a Tierra (una sola vez). Solo el
        propio afectado confirma; después del plazo → 409 `DEADMAN_EXPIRED`. Idempotente.
      operationId: confirmEmergencyOk
      x-status: mvp
      x-roles: [astronaut]
      x-hazards: [distance_from_earth, isolation_confinement]
      security:
        - bearerAuth: []
        - deviceCredential: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmed_at: { $ref: '#/components/schemas/Timestamp' }
                astronaut_id:
                  allOf:
                    - $ref: '#/components/schemas/Uuid'
                  description: |
                    Solo con `X-Device-Credential` (tableta compartida, sin sesión): quién confirma.
                    Debe tener un plazo pendiente en la sesión (si no, 409).
            examples:
              ok:
                summary: LYRA está bien
                value: { confirmed_at: '2026-11-14T08:00:20Z' }
              tablet:
                summary: Desde la tableta TAB-1 (sin sesión)
                value:
                  {
                    confirmed_at: '2026-11-14T08:00:20Z',
                    astronaut_id: '10000000-0000-4000-8000-000000000013',
                  }
      responses:
        '200':
          description: Sesión (cancelled si todos confirmaron)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionWithRoster'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No tienes alerta pendiente (CONFLICT) o el plazo ya venció (DEADMAN_EXPIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                expired:
                  summary: Llegó tarde
                  value:
                    error:
                      code: DEADMAN_EXPIRED
                      message: 'El plazo ya venció: la emergencia está activa.'
                      details: { session_id: '40000000-0000-4000-8000-000000000001' }

  /api/v1/emergency/sessions/{id}/questions:
    post:
      tags: [Emergencia]
      summary: Pregunta a Tierra lo que no cubre el protocolo
      description: |
        El sistema no diagnostica ni receta: lo que está fuera del protocolo se consulta con el
        flight surgeon. La pregunta viaja por el hilo de la sesión con `deliver_at`
        (`compute_deliver_at`; durante un corte, null = en cola). Tierra responde con
        `POST /admin/escalations/{escalation_id}/messages` y la respuesta llega a toda la
        tripulación de la misión por `GET /sync/pull` cuando su `deliver_at` ya pasó.
        Idempotente por `client_uuid` (201 / 200). Solo con la sesión activa o cerrada.
      operationId: askEmergencyQuestion
      x-status: mvp
      x-roles: [astronaut]
      x-hazards: [distance_from_earth]
      security:
        - bearerAuth: []
        - deviceCredential: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyQuestionCreate'
            examples:
              nausea:
                summary: Fuera del protocolo
                value:
                  client_uuid: 'c6000000-0000-4000-8000-000000000001'
                  body: 'VEGA pide algo para la náusea y LYRA sigue sin responder. ¿Qué indican?'
                  asked_at: '2026-11-14T08:06:00Z'
      responses:
        '201':
          description: Pregunta enviada (o en cola)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyQuestion'
        '200':
          description: Duplicado (mismo client_uuid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyQuestion'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/emergency/sessions/{id}/assessments:
    post:
      tags: [Emergencia]
      summary: Inicia la evaluación de un tripulante
      description: |
        Idempotente por `client_uuid`. Una evaluación nueva del mismo tripulante es una
        **reevaluación**: la anterior se conserva (append-only, `reassessment_of`) y manda la
        última completada. Se evalúa con la versión del protocolo de la sesión. Si la sesión
        esperaba "estoy bien", empezar a evaluar la activa. `{id}` acepta el id o el
        `client_uuid` de la sesión.
      operationId: createAssessment
      x-status: mvp
      x-roles: [astronaut]
      x-hazards: [distance_from_earth, space_radiation, hostile_closed_env]
      security:
        - bearerAuth: []
        - deviceCredential: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentCreate'
            examples:
              lyra:
                summary: ORION evalúa a LYRA
                value:
                  client_uuid: 'c5000000-0000-4000-8000-000000000001'
                  astronaut_id: '10000000-0000-4000-8000-000000000013'
                  sequence_no: 1
                  is_self_assessment: false
                  started_at: '2026-11-14T08:02:30Z'
      responses:
        '201':
          description: Evaluación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
              examples:
                created:
                  $ref: '#/components/examples/AssessmentLyraInProgress'
        '200':
          description: Duplicado (mismo client_uuid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
              examples:
                duplicate:
                  $ref: '#/components/examples/AssessmentLyraInProgress'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: La sesión está cerrada (SESSION_CLOSED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                closed:
                  summary: Sesión cerrada
                  value:
                    error:
                      code: SESSION_CLOSED
