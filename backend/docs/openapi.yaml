            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentList'
              examples:
                instruments:
                  summary: PHQ-2 y GAD-2
                  value:
                    items:
                      - code: PHQ2
                        name: PHQ-2
                        indicator_code: PHQ2_SCORE
                        prompt: Durante las últimas 2 semanas, ¿con qué frecuencia te han molestado estos problemas?
                        items:
                          - { code: item_1, text: Poco interés o placer en hacer cosas }
                          - { code: item_2, text: 'Sentirte decaído, deprimido o sin esperanza' }
                        options:
                          - { value: 0, label: Ningún día }
                          - { value: 1, label: Varios días }
                          - { value: 2, label: Más de la mitad de los días }
                          - { value: 3, label: Casi todos los días }
                        sources:
                          - {
                              id: phq2_nida,
                              title: NIDA CDE – Patient Health Questionnaire-2 (PHQ-2),
                              url: 'https://cde.nida.nih.gov/node/22',
                            }
                      - code: GAD2
                        name: GAD-2
                        indicator_code: GAD2_SCORE
                        prompt: Durante las últimas 2 semanas, ¿con qué frecuencia te han molestado estos problemas?
                        items:
                          - {
                              code: item_1,
                              text: 'Sentirte nervioso, ansioso o con los nervios de punta',
                            }
                          - {
                              code: item_2,
                              text: No poder dejar de preocuparte o no poder controlar la preocupación,
                            }
                        options:
                          - { value: 0, label: Ningún día }
                          - { value: 1, label: Varios días }
                          - { value: 2, label: Más de la mitad de los días }
                          - { value: 3, label: Casi todos los días }
                        sources:
                          - {
                              id: gad2_kroenke,
                              title: Kroenke et al. 2007 – validación GAD-2,
                              url: 'https://pubmed.ncbi.nlm.nih.gov/17339617/',
                            }
