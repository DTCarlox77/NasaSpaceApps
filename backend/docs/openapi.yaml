  /api/v1/admin/audit/confidential-access:
    get:
      tags: [Auditoría]
      summary: Accesos a datos confidenciales (salud conductual)
      description: |
        Quién vio datos de bienestar, de quién y cuándo, sobre los astronautas de la misión
        (`mission_id` o la del equipo de behavioral_health). Sin el contenido ni la IP. Solo
        behavioral_health: saber de quién se consultó ya revela algo conductual, así que admin y
        el flight surgeon → 403. Cada astronauta ve lo suyo en `GET /me/confidential-access`.
      operationId: listConfidentialAccess
