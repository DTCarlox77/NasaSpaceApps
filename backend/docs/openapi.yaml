openapi: 3.0.3
info:
  title: Astro Health API
  version: 1.8.0
  description: |
    API de apoyo a la decisión para el monitoreo de salud de astronautas.

    **Importante:** todos los datos de astronautas son SINTÉTICOS. Esta API es una
    herramienta de apoyo a la decisión y **no** constituye un diagnóstico médico.

    ## Convenciones
    - Todas las rutas empiezan por `/api/v1` (las del panel de Tierra, por `/api/v1/admin/...`).
      En las descripciones se omite el prefijo: `POST /readings` = `POST /api/v1/readings`.
    - JSON, IDs UUID y fechas ISO 8601 en UTC.
    - Autenticación `Authorization: Bearer <access_token>` (JWT). Solo los endpoints de
      emergencia aceptan además `X-Device-Credential` (tableta registrada sin sesión).
    - Extensiones en cada operación:
      - `x-roles`: roles que pueden llamarla (`astronaut`, `flight_surgeon`,
        `behavioral_health`, `admin`, `service`). `public` = no requiere sesión.
        `service` = cuenta de servicio de los sensores del hábitat: **solo** puede llamar
        `POST /habitat/readings`; cualquier otra ruta le responde 403.
      - `x-crew-role`: rol de tripulación exigido además del rol (`commander`,
        `crew_medical_officer`).
      - `x-status`: `mvp` o `extra`.
      - `x-status-impl: pending`: todavía no está implementada en la API local (`:3000`);
        sigue siendo solo mock (`:4010`). Sin esa marca, la operación ya es real.
      - `x-hazards`: peligros RIDGE que atiende (`space_radiation`, `isolation_confinement`,
        `distance_from_earth`, `gravity_fields`, `hostile_closed_env`).
      - `x-sensitivity: confidential`: datos de bienestar (ver "Quién ve qué").
    - Si la cuenta debe cambiar la contraseña (`must_change_password`), cualquier ruta salvo
      `POST /auth/change-password` y `POST /auth/logout` responde **428** con un
      `password_change_token` en `error.details`.
    - Idempotencia: lo que crea un dispositivo lleva `client_uuid`. La primera vez responde
      **201**; un duplicado responde **200** con el registro existente.
    - Lecturas: `measured_at` lo pone el dispositivo y `received_at` el servidor.
      `supersedes_uuid` corrige una lectura anterior sin borrarla.
    - Listas de datos paginadas por cursor: `?cursor=&limit=` → `{ items, next_cursor }`
      (`next_cursor: null` = última página). Los catálogos estáticos (indicadores, zonas,
      síntomas, instrumentos) se devuelven completos, sin paginar.
    - Errores con un único esquema: `{ "error": { "code", "message", "details" } }`.
    - Retraso con Tierra: lo que cruza el enlace lleva `deliver_at`, calculado con
      `compute_deliver_at` (retraso del entorno + cortes de comunicación).
      `deliver_at: null` = en cola esperando a que vuelva el enlace.
    - Resultado de un indicador = `evaluateIndicator` (`src/engine/conditions.js`).
      Resultado del triaje = `evaluateAssessment` (`src/engine/triage.js`).

    ## Quién ve qué (bienestar, confidencial)
    | Rol | Ve |
    |---|---|
    | `astronaut` | Solo lo suyo. Recibe mensajes neutros: nunca un color ni un puntaje. |
    | `behavioral_health` | Detalle: valores, tendencias, cuestionarios y solicitudes de apoyo. Cada acceso queda auditado. |
    | `flight_surgeon` | Estado y alertas escaladas a `flight_surgeon`, y aptitud `fit` / `not_confirmed`; sin respuestas individuales ni cumplimiento. |
    | `admin` | Solo cumplimiento (check-ins completados) y aptitud: `fit` / `not_confirmed`. |
    | Tripulación | Nada. |

    ## Mock
    `npm run api:mock` levanta Prism en `http://localhost:4010` con los ejemplos de este
    contrato. Para pedir otra respuesta documentada usa el header `Prefer`, por ejemplo
    `Prefer: code=423` o `Prefer: example=duplicate`.

    ## Cambios
    **1.8.0** (panel de Tierra). Cambio aditivo y una restricción:
    - Nuevo `GET /admin/escalations/{id}/messages` (`flight_surgeon`, `admin`): el hilo de un
      escalamiento visto desde Tierra (`EscalationMessagePage`, el mismo esquema que el hilo a
      bordo). Mismo alcance que el acuse y la respuesta: 404 si todavía no llegó a la bandeja; el
      flight surgeon, solo de las misiones de su equipo; admin, de todas, salvo las alertas de
      bienestar (403, como en el acuse). Lo que manda Tierra sale siempre con su `deliver_at`
      (futuro, `null` = en cola sin enlace, o pasado); lo de a bordo, solo cuando ya llegó.
    - `SLEEP_HOURS` sale de `GET /admin/dashboard/crew` para todos los roles: llega con el
      check-in y su valor diría quién lo hizo y a qué hora (cumplimiento). La alerta crítica de
      sueño (7 noches con 6 h o menos) sigue llegando al flight surgeon en `GET /admin/inbox`;
      admin ya no la recibe (antes le llegaba con el valor en `reason`) y el acuse, la respuesta
      y el hilo de esa alerta le responden 403.

    **1.7.0** (pantalla "Tripulación" de la app). Cambio aditivo:
    - Nuevo `GET /crew/status` (solo `astronaut` con asignación vigente; su misión): roster, la
      sesión de emergencia abierta de la misión (`id` y estado) y las alertas físicas escaladas
      a bordo (`crew`) en las últimas 24 h, sin valores. Solo el oficial médico (CMO) recibe
      además `physical` de cada tripulante (peor nivel por zona y, por indicador estándar, nivel,
      último valor y hora); para los demás, el comandante incluido, `physical: null`. Nunca
      bienestar, check-ins, solicitudes de apoyo, escalamientos conductuales, `sex` ni notas, y
      `SLEEP_HOURS` no sale ni en `physical` ni en las alertas (llega con el check-in).
      Tierra y `service` → 403 (tienen el panel). Esquemas nuevos: `CrewStatus`,
      `CrewStatusMember`, `CrewAlert` y `CrewPhysical`.

    **1.6.0** (tarea 12, despliegue y demo). Cambios al contrato (aditivos):
    - Nuevo `POST /admin/demo/reset` (`x-status: extra`, solo `admin`): reinicio de la demo de
      ARES-1 sin borrar nada. Mismo gate que el simulador: 404 fuera del modo demo
      (`SIMULATOR_ENABLED=true` y, en producción, `DEMO_SEED=true`). Confirmación obligatoria
      en el body: `{ "confirm": "ARES-1" }` (si no, 400). Lo conductual se cierra pero no se
      cuenta en la respuesta.
    - `OfflinePinResponse.offline_verifier.iterations` sale de `OFFLINE_PIN_PBKDF2_ITERATIONS`
      (600 000 por defecto, mínimo 10 000): la app usa el valor que recibe, no uno fijo.
    - CORS: el navegador solo puede llamar a la API desde los orígenes de `CORS_ORIGIN` (en
      producción nunca `*`). Las apps nativas no mandan `Origin` y no les afecta.

    **1.5.0** (tarea 11, acceso). Cambios al contrato (aditivos salvo los marcados ⚠):
    - Implementadas: `GET`/`POST /admin/devices`, `POST /admin/devices/{id}/revoke`,
      `POST /crew/users/{id}/unlock`, `POST /crew/users/{id}/reset-pin`, `POST /crew/devices`,
      `PUT /me/offline-pin`, `GET /admin/audit/delegated-actions` y `GET /missions/current`.
    - Nuevo `GET /admin/devices` (el contrato solo tenía el alta y la revocación).
    - **Emergencia sin sesión**: `X-Device-Credential` ya autentica las rutas del triaje (la
      tableta es el actor; `actor_device` en la línea de tiempo). Se agrega a
      `POST /emergency/sessions/{id}/confirm` (con `astronaut_id` en el body: quién confirma
      desde la tableta compartida) y a `/questions`. Credencial desconocida, revocada, de una
      misión que no está activa o usada sobre otra misión → **401** `INVALID_DEVICE_CREDENTIAL`;
      demasiados fallos desde la misma IP → **429** `RATE_LIMITED`
      (`RATE_LIMIT_DEVICE_CREDENTIAL_PER_MINUTE`). En cualquier otra ruta la credencial no
      autentica (401).
    - `Device` agrega `status` (`active` | `revoked`). Registrar una etiqueta repetida en la
      misión → 409 `DEVICE_LABEL_TAKEN`. Revocar es idempotente e invalida los PIN offline
      definidos en esa tableta.
    - ⚠ `DelegatedAudit.reported_to_earth` = el aviso ya tiene hora de llegada (`false` = en cola
      por un corte). `deliver_at` se calcula al leer (`compute_deliver_at(misión, recepción)`):
      `delegated_actions` es append-only. `GET /admin/audit/delegated-actions` solo muestra lo
      que ya llegó a Tierra.
    - `PUT /me/offline-pin`: `device_id` debe ser el de la sesión (si no, 403 `DEVICE_NOT_OWNED`;
      tableta revocada, 403 `DEVICE_REVOKED`). `OfflinePinResponse` agrega `offline_verifier`
      (parámetros del verificador local de la app). `offline_unlock_until` = ahora +
      `OFFLINE_UNLOCK_DAYS` (7) y cada login en línea en ese dispositivo lo renueva.
    - `GET /missions/current` agrega 403 (astronauta sin asignación o personal de Tierra fuera
      del equipo de la misión).
    - ⚠ `GET /admin/audit/confidential-access`: `x-roles` pasa de `[admin, behavioral_health]` a
      **`[behavioral_health]`** (saber de quién consultó salud conductual ya revela algo
      conductual) y agrega `mission_id`. Nuevo `GET /me/confidential-access`: el astronauta ve
      quién consultó SUS datos y cuándo. Admin y el flight surgeon → 403.

    **1.4.0** (tarea 10, bienestar). Cambios al contrato (aditivos salvo los marcados ⚠):
    - Rutas de bienestar implementadas: `/wellbeing/*`, `GET /me/wellbeing`,
      `GET /admin/compliance` y `/admin/behavioral/*`.
    - ⚠ `CheckinCreate.sleep_hours` deja de ser obligatorio (viene de la pulsera; puede faltar).
    - Un check-in por día de misión (día UTC de `measured_at`): otro el mismo día es una
      **corrección** (append-only; `WellbeingAck.supersedes_id` = el check-in que corrige). Gana
      el último que llega.
    - `WellbeingAck` agrega `supersedes_id`, `streak` (racha: cuenta check-ins completados,
      nunca el resultado) y `screening_due` (toca PHQ-2/GAD-2). `message` es el mensaje neutro
      de la regla del catálogo; `offer_support` siempre es true (el botón no depende del
      resultado). Nunca un nivel, un color ni un puntaje.
    - `SupportRequest` agrega `suggestions` (con urgencia `now`: respiración guiada y hablar con
      el oficial médico de a bordo; solo sugerencias, no se avisa a nadie). Las urgencias son
      `later | today | now` (`later` = "puede esperar").
    - Nuevos para behavioral_health: `POST /admin/behavioral/support-requests/{id}/ack` y
      `/close`, `POST /admin/behavioral/escalations/{id}/ack` y `/close` (el contrato no tenía
      acuse ni cierre). Un escalamiento conductual queda abierto por astronauta e indicador
      hasta que behavioral_health lo cierra: mientras tanto, un cambio que sigue sostenido no
      vuelve a escalar (regla de diseño, `WELLBEING_ONE_OPEN_ESCALATION`).
    - `GET /admin/behavioral/inbox` agrega `include_closed`, y cada item `channel`, `priority`
      y `measured_at`. `BehavioralAstronautDetail` agrega `checkins` (sin la nota privada),
      `escalations` e `indicators[].trend`.
    - `Compliance` agrega `generated_at` y por astronauta `checkin_today` y `streak_days`.
    - ⚠ Aptitud (`fitness` en `GET /admin/dashboard/crew` y `GET /admin/compliance`): la de una
      PVT de las últimas `WELLBEING_FITNESS_MAX_AGE_H` (12) horas; sin PVT reciente,
      `not_confirmed` (antes: la PVT más reciente, de cuando fuera).
    - `PVT_LAPSES` crítico: además del detalle a behavioral_health, el flight surgeon recibe en
      `GET /admin/inbox` una alerta `wellbeing` con solo el estado ("aptitud no confirmada"),
      sin métricas. Admin no la ve.
    - Sync: `support_request` ya tiene servicio (antes `ENTITY_NOT_SUPPORTED`); el mismo
      `client_uuid` con otro contenido es `conflict` `PAYLOAD_MISMATCH`.
    - `POST /wellbeing/screenings` y `/wellbeing/pvt-runs` responden 200 con el registro
      existente si el `client_uuid` ya llegó (como el resto).

    **1.3.0** (tarea 9, triaje). Cambios al contrato (aditivos salvo los marcados ⚠):
    - Rutas de emergencia implementadas: `/emergency/*` y `GET /admin/emergencies(/{id})`.
    - ⚠ `POST /emergency/sessions` con una sesión ya abierta en la misión ya no responde 409
      `SESSION_ALREADY_ACTIVE`: **se une** a la abierta (201 con `joined: true` y la sesión
      abierta). La activación queda en la línea de tiempo.
    - `EmergencyStatus` agrega `pending` (activación automática esperando "estoy bien") y
      `merged` (activación que se unió a otra; `merged_into`). Una sola sesión abierta
      (`pending` o `active`) por misión.
    - Nuevos: `POST /emergency/sessions/{id}/confirm` ("estoy bien" del tripulante afectado,
      interruptor de hombre muerto de `TRIAGE_DEADMAN_S`, 60 s) y
      `POST /emergency/sessions/{id}/questions` (pregunta fuera del protocolo a Tierra, con
      `deliver_at`; la respuesta llega por `GET /sync/pull`).
    - `EmergencySession` agrega `mission_code`, `activated_at`, `merged_into`, `deadman`,
      `heartbeat` y `joined_activations`; `responder_safe` puede ser null (activación
      automática: lo contesta el primer evaluador). `SessionWithRoster` agrega `joined`,
      `assessments` y `attention_order` (orden de atención con su motivo).
    - ⚠ Reevaluación: `POST /emergency/sessions/{id}/assessments` acepta otra evaluación del
      mismo tripulante (append-only, `reassessment_of`); el 409 queda para la sesión cerrada
      (`SESSION_CLOSED`). `sequence_no` es opcional.
    - Respuestas: `responder_safe` se puede contestar en una evaluación; responder a una
      evaluación completada → 409 `ASSESSMENT_COMPLETED`.
    - `AssessmentResult` agrega `device_result`, `mismatch_fields` y `attention_order`; al
      completar siempre hay un escalamiento a `flight_surgeon` (además de las acciones del
      protocolo).
    - `GET /emergency/protocol?version=` (la versión con que se evaluó una sesión vieja).
    - `POST /readings` (y el `reading` de sync) agrega `emergency` si la lectura crítica abrió
      o se unió a una emergencia.
    - Panel: `EmergencyListItem.counts` es null para admin; `EmergencyDetail` agrega
      `timeline`, `attention_order`, `questions` y `report` (al llegar el cierre); para admin,
      sin datos clínicos (`answers`, categorías ni reporte). `GET /admin/inbox`: admin no
      recibe `triage`.
    - Sync: `emergency_session`, `emergency_assessment`, `emergency_answer`,
      `emergency_heartbeat` ya tienen servicio, y se agregan `emergency_confirm`,
      `emergency_complete`, `emergency_question` y `emergency_close`. Todos con prioridad
      emergency (aunque el item diga normal). Las referencias (`session_id`,
      `assessment_id`) aceptan el id del servidor o el `client_uuid`.
    - Simulador: escenario `emergency_solar` y campo `emergency` en el resumen.

    **1.2.0** (tarea 8):
    - Perfil del astronauta: campo nuevo `sex` (`female` | `male` | null), sexo biológico para
      referencias clínicas (no es identidad de género). Lo escribe admin en
      `POST /admin/users` (`astronaut.sex`) y en el nuevo `PATCH /admin/astronauts/{id}`, pero
      **no lo recibe**. Lo ven el propio astronauta (`GET /me` → `context.sex`) y
      `flight_surgeon` / `behavioral_health` de su misión (`GET /missions/{id}/crew`). Nunca
      otro astronauta ni el dashboard. El motor lo pone en el contexto de las reglas; ninguna
      regla actual lo usa.
    - `GET /missions/{id}/crew` ya está implementado.
    - **Sync implementado** (`POST /sync/push`, `GET /sync/pull`). Cambios al contrato:
      - `SyncItem.entity` deja de ser un enum cerrado: es un nombre (`^[a-z][a-z0-9_]{0,39}$`).
        Un tipo desconocido no da 400 al lote: ese item sale `rejected` con `UNKNOWN_ENTITY`
        (así la tarea 9 puede agregar `triage_*` sin romper apps viejas). Los del contrato que
        todavía no tienen servicio (`emergency_*`, `support_request`) salen `rejected` con
        `ENTITY_NOT_SUPPORTED`.
      - Orden de proceso: `priority: emergency`, luego los **críticos** (evaluados con sus
        propios valores) y luego el resto por `measured_at` del payload (o `created_at`). Antes
        decía solo "por created_at".
      - `SyncItem.supersedes_uuid` opcional (alias del `payload.supersedes_uuid`).
      - `SyncPushResponse` agrega `batch_id`, `clock_offset_s` y `counts`; `SyncItemResult`
        agrega `sequence` (orden de proceso) y en `result` van `late_sync` y `lag_s`.
        `client_uuid` y `entity` pueden venir `null` si el item no los traía válidos.
      - Códigos por item: `PAYLOAD_MISMATCH` y `SUPERSEDE_CONFLICT` (conflict),
        `FUTURE_TIMESTAMP`, `VALIDATION_ERROR`, `UNKNOWN_ENTITY` y `ENTITY_NOT_SUPPORTED`
        (rejected). Push agrega 403 (`DEVICE_NOT_OWNED`, `NO_ACTIVE_ASSIGNMENT`).
      - `GET /sync/pull` acepta `limit` y agrega `catalog`, `mission` (versión y estado del
        enlace), `evaluations`, `escalations` y `routines`. Responde 400 con un cursor inválido.
    - `GET /admin/inbox`: cada item de una lectura trae `measured_at`, `late_sync` y `lag_s`
      ("registrado hace X h").
    - Simulador: escenario nuevo `offline_batch` y campo `sync` en el resumen.
servers:
  - url: http://localhost:3000
    description: Desarrollo local
  - url: http://localhost:4010
    description: Mock con Prism (npm run api:mock)
  - url: https://astro-health-api-81jd.onrender.com
    description: Demo desplegada en Render (datos sintéticos; se duerme sin uso)
security:
  - bearerAuth: []
tags:
  - name: Sistema
    description: Estado del servicio.
  - name: Auth
    description: Inicio de sesión, cambio obligatorio de contraseña, refresh rotativo y desbloqueo offline.
  - name: Admin-Cuentas
    description: Cuentas y dispositivos (admin) y permisos delegados del comandante (auditados y reportados a Tierra).
  - name: Misión
    description: Misión vigente, tripulación, entornos, asignaciones y cortes de comunicación.
  - name: Salud
    description: Catálogo de indicadores, reglas versionadas, lecturas, semáforo por zona del cuerpo y adjuntos.
  - name: Hábitat
    description: Sensores del módulo (CO₂, temperatura, humedad y ruido).
  - name: Sync
    description: Sincronización offline-first por lotes con prioridad de emergencia.
  - name: Emergencia
    description: Triaje Autónomo (START adaptado + módulo de radiación) con interruptor de hombre muerto.
  - name: Bienestar
    description: Check-ins, cuestionarios, prueba de reacción (PVT) y "Quiero hablar con alguien". Confidencial.
  - name: Tierra
    description: Panel del flight surgeon y control de misión. Sin estado conductual.
  - name: Salud conductual
    description: Bandeja y detalle confidencial para behavioral_health.
  - name: Auditoría
    description: Acciones delegadas y accesos a datos confidenciales.
  - name: Simulador
    description: |
      **Solo demo.** Datos sintéticos de ARES-1 (historia, escenarios y reinicio de la demo).
      Solo existen con `SIMULATOR_ENABLED=true`; si no, responden 404.
paths:
  # ===================================================================== Sistema
  /api/v1/health:
    get:
      tags: [Sistema]
      summary: Verifica el estado de la API y de la base de datos
      description: Ejecuta `SELECT 1` contra PostgreSQL para comprobar la conexión.
      operationId: getHealth
      x-status: mvp
      x-roles: [public]
      x-hazards: []
      security: []
      responses:
        '200':
          description: API y base de datos operativas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  summary: Todo operativo
                  value:
                    status: ok
                    db: up
                    time: '2026-11-14T15:00:00.000Z'
                    version: 0.1.0
        '503':
          description: La base de datos no responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                dbDown:
                  summary: Base de datos caída
                  value:
                    status: error
                    db: down
                    time: '2026-11-14T15:00:00.000Z'
                    version: 0.1.0

  # ===================================================================== Auth
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión
      description: |
        Devuelve tokens y el contexto de la asignación vigente (`v_current_crew`): el astronauta
        queda asignado a su misión automáticamente, nunca la elige.
        - Tras 5 intentos fallidos la cuenta se bloquea 15 min (configurable) → **423**.
        - Si `must_change_password = true` → **428** con un token de un solo uso que solo sirve
          para `POST /auth/change-password` (no se emite refresh token).
        - Credenciales inválidas → **401** con el mismo mensaje exista o no el usuario.
      operationId: login
      x-status: mvp
      x-roles: [public]
      x-hazards: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              astronaut:
                summary: Astronauta ORION
                value: { username: a.ortega, password: Demo2026!, device_id: ipad-crew-01 }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                astronaut:
                  $ref: '#/components/examples/LoginOrion'
                flightSurgeon:
                  summary: dr.reyes (equipo en Tierra)
                  value:
                    access_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMDIifQ.demo
                    token_type: Bearer
                    expires_in: 900
                    refresh_token: rt_51d0a7e3c2b94f18
                    must_change_password: false
                    offline_unlock_until: null
                    user:
                      id: '00000000-0000-4000-8000-000000000002'
                      username: dr.reyes
                      full_name: Dra. Elena Reyes (sintética)
                      role: flight_surgeon
                      email: surgeon@demo.local
                    context:
                      astronaut_id: null
                      call_sign: null
                      crew_role: null
                      ground_missions:
                        - id: '20000000-0000-4000-8000-000000000001'
                          code: ARES-1
                          name: Ares 1 · Tránsito a Marte (demo)
                          status: active
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  summary: Usuario o contraseña incorrectos
                  value:
                    error:
                      code: INVALID_CREDENTIALS
                      message: Usuario o contraseña incorrectos.
                      details: null
        '403':
          description: Astronauta sin asignación vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noAssignment:
                  summary: Sin misión vigente
                  value:
                    error:
                      code: NO_ACTIVE_ASSIGNMENT
                      message: No tienes una asignación de misión vigente.
                      details: null
        '423':
          $ref: '#/components/responses/AccountLocked'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Cambia la contraseña (obligatorio en el primer inicio)
      description: |
        Acepta el token normal o el `password_change_token` del 428. Política: mínimo 10
        caracteres y distinta de la actual. Devuelve tokens completos (misma forma que el login)
        y revoca los refresh tokens anteriores.
      operationId: changePassword
      x-status: mvp
