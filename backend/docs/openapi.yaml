                          - id: 'ntrs_nc_dba'
                            title: 'NASA NTRS – Goodman, acústica en naves (NC-50 ≈ 58.1 dBA; NC-40 ≈ 49.0 dBA)'
                            url: 'https://ntrs.nasa.gov/api/citations/20090043801/downloads/20090043801.pdf'
