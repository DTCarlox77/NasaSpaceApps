  /api/v1/sync/pull:
    get:
      tags: [Sync]
      summary: Recibe lo nuevo desde la última sincronización
      description: |
        Solo lo del astronauta. Guarda `cursor` y envíalo en la próxima llamada; si `has_more`,
        vuelve a llamar enseguida. El cursor es opaco y monótono: con el mismo cursor sale lo
        mismo. Sin cursor, empieza desde el principio.

        **Incremental** (hasta `limit` en total, por fecha):
        - `evaluations`: evaluación y estado de sus lecturas **estándar** (nunca bienestar), con
          `supersedes_uuid` para marcar las corregidas y `late_sync` / `lag_s`;
        - `escalations`: sus escalamientos no confidenciales que ya llegaron a destino
          (`deliver_at <= now()`; el estado es el del momento en que llegaron);
        - `messages`: respuestas de Tierra ya entregadas (`deliver_at <= now()`). Durante un corte
          de enlace `deliver_at` es null y no sale nada hasta que se restablezca.

        **Estado** (en cada respuesta): `rules`, `protocol`, `catalog` y `mission` con `changed`
        respecto del cursor (si `rules.changed`, descarga `GET /rules`; si `protocol.changed`,
        `GET /emergency/protocol`), recordatorios pendientes y rutinas activas.

        Para no saltar filas, solo devuelve lo que tiene más de 2 s (`SYNC_PULL_SETTLE_MS`).
      operationId: syncPull
      x-status: mvp
      x-roles: [astronaut]
      x-hazards: [distance_from_earth]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cambios desde el cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
              examples:
                fromEarth:
                  summary: Respuesta del flight surgeon y recordatorio
                  value:
                    cursor: eyJ0IjoiMjAyNi0xMS0xNFQwODoxMjozMFoifQ
                    has_more: false
                    server_time: '2026-11-14T08:13:00Z'
                    rules: { rules_version: 1, changed: false }
                    protocol: { code: crew_emergency, version: 1, changed: false }
                    catalog: { catalog_version: 1, changed: false }
                    mission:
                      id: '20000000-0000-4000-8000-000000000001'
                      code: ARES-1
                      status: active
                      ends_at: null
                      comm_delay_seconds: 90
                      link: { status: up, outage_ends_at: null }
                      version: '2026-09-30T08:00:00.000000Z'
                      changed: false
                    evaluations:
                      - reading_id: '30000000-0000-4000-8000-000000000131'
                        client_uuid: 'c1000000-0000-4000-8000-000000000131'
                        supersedes_uuid: null
                        indicator_code: SPO2
                        measured_at: '2026-11-14T02:00:00Z'
