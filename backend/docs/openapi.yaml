    post:
      tags: [Bienestar]
      summary: Envía una corrida de la prueba de reacción (PVT)
      description: |
        Métricas del minijuego (lapso = respuesta ≥ 355 ms), `device_id` (la línea base es por
        dispositivo: 3 corridas previas en descanso) y `before_critical_task`. Devuelve solo la
        aptitud: `fit` si los tres indicadores PVT quedan en `normal`, si no `not_confirmed`
        (`fitnessFromPvt`). Es lo único que llega a admin. `PVT_LAPSES` crítico: el detalle va a
        behavioral_health y el flight surgeon recibe solo "aptitud no confirmada".
