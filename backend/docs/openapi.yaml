  # ===================================================================== Bienestar
  /api/v1/wellbeing/checkins:
    post:
      tags: [Bienestar]
      summary: Check-in diario de bienestar
      description: |
        Cuatro deslizadores 0–100 (ánimo, fatiga, estrés, conflicto con la tripulación), horas de
        sueño y una nota privada opcional que solo ve el astronauta. La respuesta es un **mensaje
        neutro**: nunca un color ni un puntaje. `offer_support: true` = mostrar el botón
        "Quiero hablar con alguien".
      operationId: createWellbeingCheckin
      x-status: mvp
      x-roles: [astronaut]
      x-sensitivity: confidential
      x-hazards: [isolation_confinement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinCreate'
            examples:
              evening:
                summary: Check-in de ORION
                value:
                  client_uuid: 'ca000000-0000-4000-8000-000000000001'
                  measured_at: '2026-11-14T06:45:00Z'
                  mood: 62
                  fatigue: 40
                  stress: 35
                  crew_conflict: 10
                  sleep_hours: 6.5
                  private_note: Dormí poco por el ruido del ventilador.
      responses:
        '201':
          description: Check-in guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellbeingAck'
              examples:
                thanks:
                  $ref: '#/components/examples/CheckinAck'
        '200':
          description: Duplicado (mismo client_uuid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellbeingAck'
              examples:
                duplicate:
                  $ref: '#/components/examples/CheckinAck'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/wellbeing/instruments:
    get:
      tags: [Bienestar]
      summary: Cuestionarios breves (PHQ-2 y GAD-2)
