        con los mismos nombres (`status`, `triage_category`, `radiation_flag`, `escalations`,
        `path`, `pending`, `reason`), más `priority` (la mayor de `escalations`), los IDs y
        `deliver_at` de los escalamientos creados y `matches_device` contra `device_result`.
        - `completed`: se crean los escalamientos (`crew` se entrega a bordo de inmediato;
          `flight_surgeon` con `compute_deliver_at`).
        - `incomplete`: no se completa; `pending` es la pregunta que falta.
        - `stopped`: `reason` (p. ej. `STOP_SECURE_SELF`).
      operationId: completeAssessment
      x-status: mvp
      x-roles: [astronaut]
      x-hazards: [distance_from_earth, space_radiation, hostile_closed_env]
      security:
        - bearerAuth: []
        - deviceCredential: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
            examples:
              lyra:
                summary: La tableta ya calculó rojo + probable
                value:
                  completed_at: '2026-11-14T08:04:10Z'
                  device_result:
                    {
                      status: completed,
                      triage_category: red,
                      radiation_flag: probable,
                      rules_version: 1,
                    }
      responses:
        '200':
          description: Resultado de evaluateAssessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
              examples:
                completed:
                  $ref: '#/components/examples/ResultRedProbableCompleted'
                incomplete:
                  summary: Falta una respuesta del módulo de radiación
                  value:
                    status: incomplete
                    triage_category: green
                    pending: vomiting
                    escalations: []
                    path:
                      [responder_safe=true, responsive_and_mobile=true, RESULT_GREEN_THEN_RADIATION]
                    computed_by: server
                    rules_version: 1
                    matches_device: null
                stopped:
                  summary: El evaluador no está a salvo
                  value:
                    status: stopped
                    triage_category: null
                    reason: STOP_SECURE_SELF
                    escalations: []
                    path: [responder_safe=false]
                    computed_by: server
                    rules_version: 1
                    matches_device: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

