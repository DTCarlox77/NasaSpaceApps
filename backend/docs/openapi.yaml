        - name: astronaut_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de accesos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfidentialAccessPage'
              examples:
                vega:
                  summary: Consulta del detalle de VEGA
                  value:
                    items:
                      - {
                          id: 'b2000000-0000-4000-8000-000000000001',
                          actor_user_id: '00000000-0000-4000-8000-000000000003',
                          actor_username: bh.salas,
                          actor_role: behavioral_health,
                          astronaut_id: '10000000-0000-4000-8000-000000000012',
                          call_sign: VEGA,
                          resource: 'GET /api/v1/admin/behavioral/astronauts/{id}',
                          accessed_at: '2026-11-14T22:00:00Z',
                        }
                    next_cursor: null
        '400':
