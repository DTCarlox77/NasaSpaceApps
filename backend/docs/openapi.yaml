  /api/v1/readings:
    post:
      tags: [Salud]
      summary: Registra una lectura y la evalúa
      description: |
        Guarda la lectura, calcula los campos derivados, la evalúa con `evaluateIndicator` y, si
        la regla escala a `crew` o `flight_surgeon`, crea un escalamiento (`escalation_id`).
        Idempotente por `client_uuid` (201 la primera vez, 200 si es duplicado).
        `values` se valida contra los `components` del catálogo: requeridos, tipos, valores
        admitidos, códigos de síntomas y un rango plausible por unidad (detecta °F en vez de °C
        o lb en vez de kg). `input_method` debe estar en `input_methods` del indicador.
        **400** para los indicadores confidenciales (entran solo por `/wellbeing/*`) y para los
        del hábitat (`POST /habitat/readings`).
      operationId: createReading
      x-status: mvp
      x-roles: [astronaut]
      x-hazards: [gravity_fields, space_radiation, hostile_closed_env, distance_from_earth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingCreate'
            examples:
              bloodPressure:
                summary: Presión arterial de ORION (manual)
                value:
                  client_uuid: 'c1000000-0000-4000-8000-000000000101'
                  indicator_code: BLOOD_PRESSURE
                  measured_at: '2026-11-14T07:30:00Z'
                  values: { systolic: 145, diastolic: 88, symptoms: [] }
                  input_method: manual
                  device_id: ipad-crew-01
              bloodPressureWithPhoto:
                summary: Presión arterial con foto del tensiómetro
                description: |
                  Primero se sube la foto con `POST /attachments` y se usa el `attachment_id` que
                  devuelve; un `attachment_id` que no existe o no es del autor responde 400. El id de
                  este ejemplo es ilustrativo: no existe en el seed.
                value:
                  client_uuid: 'c1000000-0000-4000-8000-000000000102'
                  indicator_code: BLOOD_PRESSURE
                  measured_at: '2026-11-14T07:30:00Z'
                  values: { systolic: 145, diastolic: 88, symptoms: [] }
                  input_method: camera
                  device_id: ipad-crew-01
                  attachment_id: '90000000-0000-4000-8000-000000000001'
      responses:
        '201':
          description: Lectura guardada y evaluada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingCreated'
              examples:
                created:
                  $ref: '#/components/examples/ReadingCreatedBp'
        '200':
          description: Duplicado (mismo client_uuid); devuelve el registro existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingCreated'
              examples:
                duplicate:
                  $ref: '#/components/examples/ReadingCreatedBp'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Sin rol astronauta o sin asignación de misión vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noAssignment:
                  summary: Sin misión vigente
                  value:
                    error:
                      code: NO_ACTIVE_ASSIGNMENT
                      message: No tienes una asignación de misión vigente.
                      details: null
        '409':
          description: supersedes_uuid no existe o ya fue reemplazada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadySuperseded:
                  summary: La lectura ya fue corregida
                  value:
                    error:
                      code: CONFLICT
                      message: La lectura que intentas corregir ya fue reemplazada.
                      details: { supersedes_uuid: 'c1000000-0000-4000-8000-000000000100' }

