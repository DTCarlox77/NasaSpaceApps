        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/emergency/assessments/{id}/complete:
    post:
      tags: [Emergencia]
      summary: Completa la evaluación; el servidor recalcula y su resultado manda
      description: |
        Ejecuta `evaluateAssessment(protocolo, respuestas, contexto)` con la **versión del
        protocolo de la evaluación** y devuelve su resultado con los mismos nombres (`status`,
        `triage_category`, `radiation_flag`, `escalations`, `path`, `pending`, `reason`), más
        `priority` (la mayor de `escalations`), los IDs y `deliver_at` de los escalamientos
        creados, `next` (a quién evaluar después) y `attention_order`.
        **Dispositivo vs servidor**: si `device_result` difiere, se guardan los dos,
        `matches_device: false` y `mismatch_fields` dicen qué cambió, queda un evento
        `device_mismatch` y se usa el del servidor para priorizar (nunca se sobrescribe en
        silencio). Completar otra vez devuelve lo mismo sin volver a escalar.
        - `completed`: se crean los escalamientos de la regla del protocolo (`crew` se entrega
          a bordo de inmediato; `flight_surgeon` con `compute_deliver_at`) y siempre uno a
          `flight_surgeon` (Tierra recibe cada evaluación).
        - `incomplete`: no se completa; `pending` es la pregunta que falta.
        - `stopped`: `reason` (p. ej. `STOP_SECURE_SELF`).
      operationId: completeAssessment
      x-status: mvp
      x-roles: [astronaut]
      x-hazards: [distance_from_earth, space_radiation, hostile_closed_env]
      security:
        - bearerAuth: []
        - deviceCredential: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
            examples:
              lyra:
                summary: La tableta ya calculó rojo + probable
                value:
                  completed_at: '2026-11-14T08:04:10Z'
                  device_result:
                    {
                      status: completed,
                      triage_category: red,
                      radiation_flag: probable,
                      rules_version: 1,
                    }
      responses:
        '200':
          description: Resultado de evaluateAssessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
              examples:
                completed:
                  $ref: '#/components/examples/ResultRedProbableCompleted'
                incomplete:
                  summary: Falta una respuesta del módulo de radiación
                  value:
                    status: incomplete
                    triage_category: green
                    pending: vomiting
                    escalations: []
                    path:
                      [responder_safe=true, responsive_and_mobile=true, RESULT_GREEN_THEN_RADIATION]
                    computed_by: server
                    rules_version: 1
                    matches_device: null
                stopped:
                  summary: El evaluador no está a salvo
                  value:
                    status: stopped
                    triage_category: null
                    reason: STOP_SECURE_SELF
                    escalations: []
                    path: [responder_safe=false]
                    computed_by: server
                    rules_version: 1
                    matches_device: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/emergency/sessions/{id}/heartbeat:
    post:
      tags: [Emergencia]
      summary: Latido del interruptor de hombre muerto
      description: |
        La tableta lo envía mientras alguien atiende una sesión **activa**. Si pasan
        `dead_man_switch_seconds` (120 s en el protocolo) sin latido, el barrido del servidor
        escala a la tripulación y al flight surgeon (una vez por corte de latidos). Es distinto
        del "estoy bien" de una activación automática (`/confirm`).
      operationId: emergencyHeartbeat
      x-status: mvp
      x-roles: [astronaut]
      x-hazards: [distance_from_earth, isolation_confinement]
      security:
        - bearerAuth: []
        - deviceCredential: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
            examples:
              beat:
                summary: Latido desde TAB-1
                value: { sent_at: '2026-11-14T08:05:00Z', device_id: TAB-1 }
      responses:
        '200':
          description: Latido registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
              examples:
                ok:
                  summary: Próximo latido antes de expires_at
                  value:
                    session_id: '40000000-0000-4000-8000-000000000001'
                    status: active
                    received_at: '2026-11-14T08:05:01Z'
                    dead_man_switch_seconds: 120
                    expires_at: '2026-11-14T08:07:01Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/emergency/sessions/{id}/close:
    post:
      tags: [Emergencia]
      summary: Cierra o cancela la sesión de emergencia
      description: |
        Comandante o CMO. `closed` = atendida; `cancelled` = falsa alarma. Avisa a Tierra y deja
        el **reporte completo** (línea de tiempo, evaluaciones con respuestas, clasificaciones,
        versión del protocolo y diferencias dispositivo/servidor), que el flight surgeon ve en
        `GET /admin/emergencies/{id}` cuando llega el cierre (retraso + cortes). Cerrar una
        sesión que se fusionó cierra la principal. Idempotente.
      operationId: closeEmergencySession
      x-status: mvp
      x-roles: [astronaut]
      x-crew-role: [commander, crew_medical_officer]
      x-hazards: [distance_from_earth]
      security:
        - bearerAuth: []
        - deviceCredential: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseRequest'
            examples:
              close:
                summary: Emergencia atendida
                value:
                  {
                    closed_at: '2026-11-14T08:20:00Z',
                    status: closed,
                    notes: LYRA estable en el refugio.,
                  }
      responses:
        '200':
          description: Resumen de la sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
              examples:
                closed:
                  summary: Un rojo y un verde
                  value:
                    session:
                      id: '40000000-0000-4000-8000-000000000001'
                      client_uuid: 'c4000000-0000-4000-8000-000000000001'
                      mission_id: '20000000-0000-4000-8000-000000000001'
                      protocol:
                        id: 1
                        code: 'crew_emergency'
                        version: 1
                      trigger_type: 'manual_button'
                      started_by: '00000000-0000-4000-8000-000000000011'
                      status: 'closed'
                      context:
