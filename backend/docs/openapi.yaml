  /api/v1/crew/status:
    get:
      tags: [Misión]
      summary: Estado de la tripulación (pantalla "Tripulación" de la app)
      description: |
        Solo astronautas con asignación vigente; datos de **su** misión (sin parámetros).
        - **Toda la tripulación**: roster, la sesión de emergencia abierta de la misión (`id` y
          estado; una sola por misión y cubre a todos, así que es la misma en cada fila) y las
          alertas **físicas** ya escaladas a bordo (`crew`) en las últimas 24 h: indicador, nivel
          y hora, **sin valores**.
        - **Solo el oficial médico** (`crew_medical_officer`) vigente: además, `physical` de cada
          tripulante (también el suyo): peor nivel por zona del cuerpo y, por indicador estándar
          con alguna lectura, nivel, último valor y hora (`v_readings_standard`). Para los demás,
          `physical: null`; el comandante tampoco lo recibe (sus permisos delegados son de
          acceso, no médicos).
        - **Nunca**, para nadie: bienestar (`WB_*`, PHQ-2/GAD-2, `PVT_*`, aptitud), check-ins,
          solicitudes de apoyo, escalamientos conductuales, `sex` ni notas. `SLEEP_HOURS` no
          sale ni en `physical` ni en `crew_alerts`: llega con el check-in y diría quién lo hizo
          y a qué hora. Su alerta sigue llegando al propio astronauta (`GET /sync/pull`) y, si es
          crítica, al flight surgeon.
        - `admin`, `flight_surgeon`, `behavioral_health` y `service` → 403 (tienen el panel).
          Astronauta sin asignación vigente → 403 `NO_ACTIVE_ASSIGNMENT`.
        La regla vive en `canAccess` (vistas `crew_status` y `crew_physical`).
      operationId: getCrewStatus
      x-status: mvp
      x-roles: [astronaut]
      x-hazards: [isolation_confinement, distance_from_earth]
      responses:
        '200':
          description: Estado de la tripulación vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewStatus'
              examples:
                cmo:
                  summary: Vista del CMO (VEGA), recortada a 2 tripulantes
                  value:
                    mission: { id: '20000000-0000-4000-8000-000000000001', code: ARES-1 }
                    generated_at: '2026-11-15T10:00:00Z'
                    viewer_crew_role: crew_medical_officer
                    crew:
                      - astronaut_id: '10000000-0000-4000-8000-000000000013'
                        call_sign: LYRA
                        display_name: Lin Tanaka (sintética)
                        crew_role: flight_engineer
                        emergency: null
                        crew_alerts:
                          - escalation_id: '30000000-0000-4000-8000-000000000101'
                            indicator_code: HEART_RATE
                            indicator_name: Frecuencia cardíaca en reposo
                            level: caution
                            created_at: '2026-11-15T09:42:00Z'
                        physical:
                          zones:
                            - { zone: heart, worst_level: caution }
                            - { zone: lungs, worst_level: normal }
                            - { zone: immune, worst_level: unrated }
                            - { zone: metabolism, worst_level: unrated }
                            - { zone: muscle, worst_level: unrated }
                            - { zone: bones, worst_level: unrated }
                            - { zone: brain, worst_level: unrated }
                            - { zone: eyes, worst_level: unrated }
                          indicators:
                            - code: HEART_RATE
                              level: caution
                              last_value: { value: 120 }
                              measured_at: '2026-11-15T09:41:58Z'
                            - code: SPO2
                              level: normal
                              last_value: { value: 98 }
                              measured_at: '2026-11-15T09:30:00Z'
                      - astronaut_id: '10000000-0000-4000-8000-000000000011'
                        call_sign: ORION
                        display_name: Ana Ortega (sintética)
                        crew_role: commander
                        emergency: null
                        crew_alerts: []
                        physical:
                          zones:
                            - { zone: heart, worst_level: normal }
                            - { zone: lungs, worst_level: unrated }
                            - { zone: immune, worst_level: unrated }
                            - { zone: metabolism, worst_level: unrated }
                            - { zone: muscle, worst_level: unrated }
                            - { zone: bones, worst_level: unrated }
                            - { zone: brain, worst_level: unrated }
                            - { zone: eyes, worst_level: unrated }
                          indicators:
                            - code: BLOOD_PRESSURE
                              level: normal
                              last_value: { systolic: 118, diastolic: 76 }
                              measured_at: '2026-11-15T08:00:00Z'
                crew:
                  summary: Vista de un tripulante (LYRA) con una emergencia abierta
                  value:
                    mission: { id: '20000000-0000-4000-8000-000000000001', code: ARES-1 }
                    generated_at: '2026-11-15T10:00:00Z'
                    viewer_crew_role: flight_engineer
                    crew:
                      - astronaut_id: '10000000-0000-4000-8000-000000000013'
                        call_sign: LYRA
                        display_name: Lin Tanaka (sintética)
                        crew_role: flight_engineer
                        emergency:
                          { session_id: '40000000-0000-4000-8000-000000000001', status: active }
                        crew_alerts:
                          - escalation_id: '30000000-0000-4000-8000-000000000101'
                            indicator_code: HEART_RATE
                            indicator_name: Frecuencia cardíaca en reposo
                            level: caution
                            created_at: '2026-11-15T09:42:00Z'
                        physical: null
                      - astronaut_id: '10000000-0000-4000-8000-000000000012'
                        call_sign: VEGA
                        display_name: Kofi Mensah (sintético)
                        crew_role: crew_medical_officer
                        emergency:
                          { session_id: '40000000-0000-4000-8000-000000000001', status: active }
                        crew_alerts: []
                        physical: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Rol de Tierra o `service` (`FORBIDDEN`), o astronauta sin asignación vigente
            (`NO_ACTIVE_ASSIGNMENT`).
          content:
