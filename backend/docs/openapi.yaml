  /api/v1/admin/indicators/{code}/rules:
    put:
      tags: [Tierra]
      summary: Reemplaza las reglas de un indicador (nueva versión)
      description: |
        Crea una nueva `rules_version` (auditada) que la app recibe por `GET /sync/pull` →
        `GET /rules`. `flight_surgeon` edita indicadores estándar y `behavioral_health` los
        confidenciales. `expected_rules_version` evita pisar un cambio ajeno (**409**).
      operationId: replaceIndicatorRules
      x-status: extra
      x-roles: [flight_surgeon, behavioral_health]
      x-hazards:
        [
          space_radiation,
          isolation_confinement,
          distance_from_earth,
          gravity_fields,
          hostile_closed_env,
        ]
      parameters:
        - $ref: '#/components/parameters/IndicatorCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesUpdate'
            examples:
              spo2:
                summary: Ajusta el umbral de precaución de SPO2
                value:
                  expected_rules_version: 1
                  change_reason: Validado con el flight surgeon para la atmósfera de ARES-1.
                  rules:
                    - {
                        level: critical,
                        when: { field: value, op: lte, value: 91 },
                        recommendation: Tu oxígeno en sangre está bajo. Avisa ya a tu tripulación.,
                        escalation: flight_surgeon,
                        source_ids: [who_pulseox, news2],
                        basis: source_adapted,
                      }
                    - {
                        level: caution,
                        when: { field: value, op: lte, value: 94 },
                        recommendation: Tu oxígeno está ligeramente bajo. Repite la medición.,
                        escalation: crew,
                        source_ids: [who_pulseox],
                        basis: source_adapted,
                      }
                    - {
                        level: normal,
                        when: { all: [] },
                        recommendation: Tu oxígeno está en rango normal (95 % o más).,
                        escalation: self_care,
                        source_ids: [who_pulseox],
                        basis: source,
                      }
      responses:
        '200':
          description: Nueva versión publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesUpdated'
              examples:
                v2:
                  summary: SPO2 v2
                  value:
                    code: SPO2
                    rules_version: 2
                    updated_at: '2026-11-14T16:00:00Z'
                    updated_by: '00000000-0000-4000-8000-000000000002'
                    audit_id: 'b1000000-0000-4000-8000-000000000010'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Otra persona publicó una versión más nueva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                versionConflict:
                  summary: Versión desactualizada
                  value:
                    error:
                      code: CONFLICT
                      message: Las reglas de SPO2 ya están en la versión 2.
                      details: { current_rules_version: 2 }

