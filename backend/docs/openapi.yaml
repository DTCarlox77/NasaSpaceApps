        valor, serie (hasta 10 puntos; valor principal = `value` o la sistólica) y tendencia
        (último valor frente a la media de los anteriores, ±5 %; menos de 2 puntos =
        `insufficient_data`). Más aptitud (`flight_surgeon` y `admin`) y cumplimiento (solo `admin`).
        **Sin estado conductual**: las lecturas salen de `v_readings_standard`. **Sin
        `SLEEP_HOURS`** (v1.8): llega con el check-in de bienestar y diría quién lo hizo y a qué
